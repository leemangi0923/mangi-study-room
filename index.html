<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만기의 학습실 · 2학기 2차고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;600&family=Sora:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#F4F3EF; --surface:#FFFFFF; --soft:#F7F6F2; --soft2:#F1EFEA; --track:#ECEAE4; --seg:#DEDBD3;
  --ink:#15171C; --muted:#5B5F68; --faint:#8A8E97; --line:#E3E1DA; --line2:#EFEDE8;
  --accent:#2447D6; --accent-soft:#E8ECFB; --on-accent:#FFFFFF; --accent-on-dark:#9DB0F2;
  --bad:#C2410C; --bad-soft:#FCEBDD; --bad-bar:#E0823F; --bad-ink:#43291C;
  --hero:#15171C; --hero-line:#2C2F37; --hero-muted:#A9ADB6;
  --mono-bg:#15171C; --mono-fg:#FFFFFF;
  --focus:#2447D6;
  --kr:'Noto Sans KR','Noto Sans SC',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --num:'Sora','Noto Sans KR',system-ui,sans-serif;
  --zh:'Noto Sans SC','Noto Sans KR','PingFang SC','Microsoft YaHei',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111216; --surface:#1A1C21; --soft:#202329; --soft2:#23262D; --track:#2A2D34; --seg:#33363E;
    --ink:#ECEDEF; --muted:#A5A9B2; --faint:#7E828B; --line:#2A2D34; --line2:#24272D;
    --accent:#8AA0F6; --accent-soft:#232B45; --on-accent:#0E1330; --accent-on-dark:#9DB0F2;
    --bad:#F5A06E; --bad-soft:#3A2519; --bad-bar:#C8672F; --bad-ink:#F3D9C8;
    --hero:#0B0C0F; --hero-line:#26282E; --hero-muted:#9DA1AA;
    --mono-bg:#ECEDEF; --mono-fg:#15171C; --focus:#8AA0F6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111216; --surface:#1A1C21; --soft:#202329; --soft2:#23262D; --track:#2A2D34; --seg:#33363E;
  --ink:#ECEDEF; --muted:#A5A9B2; --faint:#7E828B; --line:#2A2D34; --line2:#24272D;
  --accent:#8AA0F6; --accent-soft:#232B45; --on-accent:#0E1330; --accent-on-dark:#9DB0F2;
  --bad:#F5A06E; --bad-soft:#3A2519; --bad-bar:#C8672F; --bad-ink:#F3D9C8;
  --hero:#0B0C0F; --hero-line:#26282E; --hero-muted:#9DA1AA;
  --mono-bg:#ECEDEF; --mono-fg:#15171C; --focus:#8AA0F6;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--kr);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:10px}
.zh{font-family:var(--zh)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* layout */
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:96px}
.page{padding:0 20px 28px;display:flex;flex-direction:column;gap:24px}
.top{padding:24px 20px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top .eyebrow{font-size:13px;font-weight:700;color:var(--muted)}
.top h1{margin:4px 0 0;font-size:29px;font-weight:800;letter-spacing:-0.035em;line-height:1.2}
.bar{padding:18px 20px 4px;display:flex;align-items:center;gap:12px}
.bar .t{flex:1;min-width:0}
.bar .t small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.bar .t b{display:block;font-size:16px;font-weight:800;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;flex-shrink:0;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--ink);text-decoration:none}
.icon-btn svg{width:20px;height:20px}
h2.sec{margin:0;font-size:17px;font-weight:800;letter-spacing:-0.02em}
.sec-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-row .meta{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}

/* hero */
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--hero-line)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .lab{font-size:13px;color:var(--hero-muted)}
.hero .dday{font-family:var(--num);font-size:50px;font-weight:600;letter-spacing:-0.03em;line-height:1;margin-top:6px}
.hero .pct{font-family:var(--num);font-size:22px;font-weight:600;margin-top:6px;text-align:right}
.hero .track{height:6px;border-radius:99px;background:var(--hero-line);overflow:hidden}
.hero .track i{display:block;height:100%;border-radius:99px;background:var(--accent-on-dark)}
.hero .rec{border-top:1px solid var(--hero-line);padding-top:16px;display:flex;align-items:center;gap:14px}
.hero .rec .k{font-size:12px;font-weight:700;color:var(--hero-muted)}
.hero .rec .v{font-size:15px;font-weight:700;line-height:1.4}
.hero .rec .s{font-size:13px;color:var(--hero-muted)}
.hero .go{flex-shrink:0;min-height:44px;padding:0 18px;border-radius:14px;background:#fff;color:#15171C;border:0;font-weight:800;font-size:14px}
.hero .setdate{background:transparent;border:1px dashed var(--hero-muted);color:#fff;border-radius:12px;min-height:40px;padding:0 12px;font-size:13px;font-weight:700;margin-top:10px}

/* subject cards */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;text-align:left;color:var(--ink);min-width:0}
.scard .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mono{width:40px;height:40px;border-radius:12px;background:var(--mono-bg);color:var(--mono-fg);font-weight:800;font-size:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Noto Sans KR',sans-serif}
.mono.sm{width:32px;height:32px;border-radius:10px;font-size:15px}
.mono.xs{width:26px;height:26px;border-radius:8px;font-size:13px}
.scard .nm{font-size:16px;font-weight:800}
.scard .rg{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;background:var(--soft2);color:var(--muted)}
.chip.good{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ink{background:var(--mono-bg);color:var(--mono-fg)}
.chip.line{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:3px 9px}
.thin{height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.thin i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.scard .cnt{font-family:var(--num);font-size:12px;color:var(--muted);margin-top:6px}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row-btn{width:100%;min-height:68px;padding:10px 16px;display:flex;align-items:center;gap:14px;background:transparent;border:0;border-bottom:1px solid var(--line2);text-align:left;color:var(--ink)}
.row-btn:last-child{border-bottom:0}
.row-btn .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--soft2)}
.row-btn .ic svg{width:20px;height:20px}
.row-btn .ic.acc{background:var(--accent-soft);color:var(--accent)}
.row-btn .ic.bad{background:var(--bad-soft);color:var(--bad)}
.row-btn .tx{flex:1;min-width:0}
.row-btn .tx b{display:block;font-size:15px;font-weight:700}
.row-btn .tx span{display:block;font-size:13px;color:var(--muted)}
.row-btn .chev{width:18px;height:18px;color:var(--faint);flex-shrink:0}

/* buttons */
.btn{min-height:52px;padding:0 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px}
.btn-row .grow{flex:1}

/* segmented + chips */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--track);padding:5px;border-radius:18px}
.seg button{min-height:56px;border:0;border-radius:14px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.seg button .h{font-size:16px;font-weight:800;font-family:'Noto Sans KR',sans-serif}
.seg button .l{font-size:11px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--mono-bg);color:var(--mono-fg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 2px}
.chips::-webkit-scrollbar{display:none}
.pill{min-height:38px;flex-shrink:0;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* notes */
.unit-h small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.unit-h h2{margin:2px 0 0;font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.card li{position:relative;padding-left:14px;font-size:14.5px;line-height:1.62}
.card li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.card li b{font-weight:700}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px;line-height:1.55}
.kv div:last-child{border-bottom:0;padding-bottom:2px}
.kv div:first-child{padding-top:2px}
.kv dt,.kv .k{width:92px;flex-shrink:0;font-weight:700;color:var(--muted);font-size:13px;padding-top:1px}
.kv .v{flex:1;min-width:0}
.tip{background:var(--accent-soft);border-radius:20px;padding:16px 18px;display:flex;gap:12px}
.tip .b{font-size:14px;font-weight:800;color:var(--accent)}
.tip p{margin:4px 0 0;font-size:13.5px;line-height:1.62}
.trap{background:var(--bad-soft);border-radius:20px;padding:16px 18px;display:flex;gap:12px}
.trap .b{font-size:14px;font-weight:800;color:var(--bad)}
.trap p{margin:4px 0 0;font-size:13.5px;line-height:1.62;color:var(--bad-ink)}
.tip svg,.trap svg{width:20px;height:20px;flex-shrink:0;margin-top:2px}
.formula{background:var(--soft);border-radius:14px;padding:12px 14px;font-family:var(--num);font-size:14px;line-height:1.7}

/* quiz */
.segbar{display:grid;gap:3px;padding:0 20px}
.segbar i{height:4px;border-radius:2px;background:var(--seg)}
.segbar i.ok{background:var(--accent)}
.segbar i.no{background:var(--bad-bar)}
.segbar i.cur{background:var(--ink)}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qmeta .pg{margin-left:auto;font-size:12px;color:var(--muted)}
.qtext{margin:0;font-size:18px;font-weight:700;line-height:1.6;letter-spacing:-0.01em}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.box .lab{font-size:13px;font-weight:800;color:var(--muted)}
.box div.it{display:flex;gap:10px;font-size:15px;line-height:1.55}
.box div.it b{flex-shrink:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:54px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px;text-align:left;font-size:15px;line-height:1.45;color:var(--ink);width:100%}
.opt .n{font-family:var(--num);font-weight:600;color:var(--faint);flex-shrink:0;min-width:18px}
.opt .l{flex:1}
.opt .tag{font-size:12px;font-weight:800;flex-shrink:0}
.opt svg{width:18px;height:18px;flex-shrink:0}
.opt[aria-pressed="true"]{border:1.5px solid var(--ink);background:var(--soft)}
.opt.right{border:1.5px solid var(--accent);background:var(--accent-soft)}
.opt.right .n,.opt.right .tag{color:var(--accent)}
.opt.wrong{border:1.5px solid var(--bad);background:var(--bad-soft)}
.opt.wrong .n,.opt.wrong .tag{color:var(--bad)}
.opt:disabled{cursor:default}
.ox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ox .opt{justify-content:center;min-height:84px;font-family:var(--num);font-size:30px;font-weight:600}
.numin{display:flex;gap:10px;align-items:center}
.numin input{flex:1;min-width:0;min-height:54px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-family:var(--num);font-size:20px}
.numin .u{font-size:15px;font-weight:700;color:var(--muted)}
.numin.right input{border:1.5px solid var(--accent);background:var(--accent-soft)}
.numin.wrong input{border:1.5px solid var(--bad);background:var(--bad-soft)}
.exp{background:var(--hero);color:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--hero-line)}
.exp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.exp h3{margin:0;font-size:17px;font-weight:800}
.exp .res{font-size:13px;font-weight:800}
.exp .res.ok{color:var(--accent-on-dark)}
.exp .res.no{color:#F5B488}
.exp p{margin:0;font-size:14px;line-height:1.7;color:#E6E7EA;white-space:pre-line}
.exp .ans{font-size:13px;color:var(--hero-muted)}
.dock{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));padding:12px 0 0;background:linear-gradient(to top,var(--ground) 70%,transparent)}

/* result */
.score{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;align-items:center;gap:22px}
.ring{position:relative;width:124px;height:124px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--num);font-size:38px;font-weight:600;letter-spacing:-0.03em;line-height:1}
.ring .c span{font-size:12px;color:var(--muted);margin-top:4px}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--num);font-size:18px;font-weight:600}
.stat b em{font-style:normal;color:var(--faint)}
.subrow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line2)}
.subrow:last-child{border-bottom:0}
.subrow .nm{width:64px;font-size:14px;font-weight:700;flex-shrink:0}
.blocks{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.blocks i{height:8px;border-radius:3px;background:var(--accent)}
.blocks i.no{background:var(--bad-bar)}
.subrow .fr{width:34px;text-align:right;font-family:var(--num);font-size:13px;font-weight:600}

/* mock */
.timer{font-family:var(--num);font-size:17px;font-weight:600;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.palette button{min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--num);font-size:13px;font-weight:600;color:var(--muted);padding:0}
.palette button.done{background:var(--soft2);color:var(--ink)}
.palette button[aria-current="true"]{border:1.5px solid var(--ink);color:var(--ink)}

/* flashcards */
.flip{perspective:1200px;min-height:280px}
.flip-in{position:relative;width:100%;min-height:280px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;border:0;padding:0;background:transparent;display:block}
.flip-in.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.face.f{background:var(--surface);border:1px solid var(--line)}
.face.b{background:var(--hero);color:#fff;transform:rotateY(180deg);border:1px solid var(--hero-line)}
.face .big{font-size:25px;font-weight:800;letter-spacing:-0.03em;line-height:1.35}
.face .sub{font-size:13px;color:var(--muted)}
.face.b .sub{color:var(--hero-muted)}
.face .ans{font-size:17px;line-height:1.6;font-weight:500}
.hint{font-size:12px;color:var(--faint);text-align:center}

/* misc */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{font-size:16px}
.empty p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:15px}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
.wrongitem{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.wrongitem .tx{flex:1;min-width:0}
.wrongitem .tx small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.wrongitem .tx p{margin:0;font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.unitrow{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink)}
.unitrow .tx{flex:1;min-width:0}
.unitrow .tx b{display:block;font-size:15px;font-weight:700;line-height:1.4}
.unitrow .tx span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.unitrow .thin{margin-top:8px}

.chev svg{width:100%;height:100%;display:block}
.btn svg{width:18px;height:18px;flex-shrink:0}
.palette button{min-height:40px}
.seg.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.field textarea{min-height:132px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;font-size:15px;line-height:1.65;resize:vertical;width:100%}
.field textarea:disabled{opacity:.75}
.kw{display:flex;flex-wrap:wrap;gap:8px}

{id:'h1a',u:'h1',p:'12–15쪽',q:'1910년대 일제의 통치 모습으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 헌병 경찰이 정식 재판 없이 즉결 심판을 하였다.','ㄴ. 치안 유지법을 만들어 독립운동가를 탄압하였다.','ㄷ. 회사를 설립하려면 총독의 허가를 받아야 하였다.','ㄹ. 산미 증식 계획으로 많은 쌀을 일본으로 가져갔다.'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ'],a:1,e:'ㄱ 헌병 경찰제(즉결 심판권)와 ㄷ 회사령(1910, 허가제)은 1910년대 무단 통치 시기예요.\nㄴ 치안 유지법(1925)과 ㄹ 산미 증식 계획(1920~1934)은 1920년대 ‘문화 통치’ 시기예요.'},

{id:'h3b',u:'h3',p:'33쪽',q:'지청천이 이끈 한국 독립군이 중국 호로군과 연합하여 승리한 전투는?',o:['영릉가 전투','흥경성 전투','대전자령 전투','봉오동 전투','청산리 대첩'],a:2,e:'한국 독립군(지청천)은 쌍성보·동경성·대전자령 전투, 조선 혁명군(양세봉)은 중국 의용군과 영릉가·흥경성 전투에서 승리했어요.'},
{id:'h3c',u:'h3',p:'34쪽',q:'다음 설명에 해당하는 단체는?',bl:'자료',bx:['1919년 만주 지린에서 김원봉 등이 조직하였으며, 신채호의 「조선 혁명 선언」을 활동 지침으로 삼았다.'],o:['한인 애국단','의열단','신간회','조선 의용대','대한 광복회'],a:1,e:'의열단에서는 김익상(조선 총독부), 김상옥(종로 경찰서), 나석주(동양 척식 주식회사) 등이 의거를 일으켰어요. 한인 애국단(1931)은 김구가 조직했어요.'},
{id:'h3d',u:'h3',p:'35쪽',q:'윤봉길의 훙커우 공원 의거(1932)가 가져온 결과로 옳은 것은?',o:['일제가 상하이 사변을 일으켰다.','중국 국민당 정부가 임시 정부를 적극 지원하였다.','미쓰야 협정이 맺어졌다.','만주에 3부가 성립하였다.','신간회가 해소되었다.'],a:1,e:'윤봉길 의거 뒤 중국 국민당 정부가 임시 정부를 적극 지원했고, 한중 공동 항일 전선의 계기가 되었어요. 상하이 사변은 이봉창 의거(1932.1)를 구실로 일어났어요.'},
{id:'h3e',u:'h3',p:'36쪽',q:'‘조선 사람 조선 것’, ‘내 살림 내 것으로’를 내걸고 평양에서 시작된 운동은?',o:['민립 대학 설립 운동','물산 장려 운동','브나로드 운동','문자 보급 운동','형평 운동'],a:1,e:'물산 장려 운동(1920)은 조만식 등이 회사령·관세 폐지에 위기감을 느껴 토산품 애용을 주장한 운동이에요. 토산품 가격이 오르고, 사회주의자에게 자본가의 이익만 챙긴다는 비판을 받았어요.'},
{id:'h3f',u:'h3',p:'42–43쪽',q:'신간회에 대한 설명으로 옳은 것은?',o:['사회주의 계열만 참여하였다.','일제 강점기 최대의 합법적 항일 단체였다.','1931년에 창립되었다.','6·10 만세 운동을 계기로 해소되었다.','회장은 김구였다.'],a:1,e:'신간회(1927)는 비타협적 민족주의와 사회주의 계열이 함께 만든 단체로, 회장은 이상재였어요. 140여 개 지회, 4만여 명으로 최대 합법 항일 단체였고 1931년에 해소되었어요.'},
{id:'h3g',u:'h3',p:'40–41쪽',q:'3·1 운동 이후 최대 규모의 항일 민족 운동은?',o:['6·10 만세 운동','광주 학생 항일 운동','원산 총파업','암태도 소작 쟁의','물산 장려 운동'],a:1,e:'광주 학생 항일 운동(1929)은 나주역 한일 학생 충돌을 일본 경찰이 편파적으로 처리한 데서 시작해 전국으로 퍼졌어요. 원산 총파업은 일제 강점기 최대 노동 운동이에요.'},
{id:'h3h',u:'h3',p:'36–41쪽',q:'운동과 관련 내용의 짝이 옳은 것은?',o:['문자 보급 운동 – 동아일보','브나로드 운동 – 동아일보','민립 대학 설립 운동 – 조만식','원산 총파업 – 1923년','6·10 만세 운동 – 고종의 장례'],a:1,e:'문자 보급 운동은 조선일보(1929), 브나로드 운동은 동아일보(1931)예요. 민립 대학 설립 운동은 이상재, 원산 총파업은 1929년, 6·10 만세 운동은 순종의 인산일이에요.'},
{id:'h4a',u:'h4',p:'50쪽',q:'다음 설명에 해당하는 단체는?',bl:'자료',bx:['1927년 민족주의와 사회주의 계열의 여성들이 힘을 모아 조직한 단체로, 신간회의 자매단체였다.'],o:['근우회','조선 형평사','천도교 소년회','조선어 학회','진단 학회'],a:0,e:'근우회는 기관지 『근우』를 펴냈어요. 조선 형평사는 백정 차별 철폐, 천도교 소년회는 방정환의 소년 운동이에요.'},
{id:'h4b',u:'h4',p:'51쪽',q:'1923년 진주에서 조선 형평사를 조직해 전개한 운동의 목적은?',o:['여성의 지위 향상','어린이 인권 보호','백정에 대한 차별 철폐','한글 맞춤법 통일','소작료 인하'],a:2,e:'갑오개혁으로 신분제는 없어졌지만 백정 차별이 계속되자 ‘저울처럼 평등한 세상’을 내걸고 형평 운동을 벌였어요.'},
{id:'h4c',u:'h4',p:'52–53쪽',q:'식민 사관의 정체성론을 극복하려고 세계사의 보편 법칙을 우리 역사에 적용한 역사학자는?',o:['박은식','신채호','정인보','백남운','방정환'],a:3,e:'백남운은 『조선사회경제사』를 쓴 사회 경제 사학자예요. 박은식(국혼)·신채호·정인보(얼)는 민족정신을 강조한 민족주의 사학이에요.'},
{id:'h4d',u:'h4',p:'53–54쪽',q:'조선어 학회의 활동으로 옳지 않은 것은?',o:['한글 맞춤법 통일안 제정','표준어 제정','『조선말 큰사전』 편찬 추진','문맹 퇴치 운동 참여','『조선사』 편찬'],a:4,e:'『조선사』는 일제가 세운 조선사 편수회가 식민 사관에 따라 펴낸 책이에요. 조선어 학회는 1942년 조선어 학회 사건으로 탄압받았어요.'},
{id:'h5a',u:'h5',p:'57–59쪽',q:'조선 의용대에 대한 설명으로 옳은 것은?',o:['1940년 충칭에서 창설되었다.','총사령관은 지청천이었다.','중국 관내에서 만들어진 최초의 한인 부대였다.','인도·미얀마 전선에 파견되었다.','미국 전략 정보국(OSS)과 국내 진공 작전을 준비하였다.'],a:2,e:'조선 의용대(1938, 한커우)는 김원봉의 조선 민족 전선 연맹이 중국 국민당의 지원을 받아 만들었어요. 나머지는 한국광복군에 대한 설명이에요.'},
{id:'h5b',u:'h5',p:'57, 59쪽',q:'한국광복군의 활동이 아닌 것은?',o:['태평양 전쟁 직후 대일 선전 포고','인도·미얀마 전선에서 심리전과 포로 심문','OSS와 협력해 국내 진공 작전 준비','연합군의 일원으로 참전','호가장 전투'],a:4,e:'호가장 전투는 조선 의용대 화북 지대의 활동이에요. 한국광복군은 1940년 충칭에서 창설되었고 총사령관은 지청천이에요.'},
{id:'h5c',u:'h5',p:'59쪽',q:'(가), (나) 단체를 바르게 짝지은 것은?',bl:'자료',bx:['(가) 1942년 화북에서 김두봉을 중심으로 조직된 사회주의 계열 단체','(나) 1944년 국내에서 여운형이 조직한 비밀 결사로, 광복에 대비하였다.'],o:['(가) 조선 독립 동맹 – (나) 조선 건국 동맹','(가) 조선 건국 동맹 – (나) 조선 독립 동맹','(가) 민족 혁명당 – (나) 한국 독립당','(가) 조선 의용대 – (나) 신간회','(가) 한국 독립당 – (나) 조선 건국 동맹'],a:0,e:'조선 독립 동맹(화북, 김두봉)은 조선 의용대 화북 지대를 조선 의용군으로 개편했어요. 조선 건국 동맹(국내, 여운형)에는 민족주의·사회주의 계열이 함께 참여했어요.'},
{id:'h5d',u:'h5',p:'60쪽',q:'연합국이 처음으로 한국의 독립을 약속한 회담은?',o:['카이로 회담(1943)','얄타 회담(1945)','포츠담 선언(1945)','파리 강화 회의(1919)','국민 대표 회의(1923)'],a:0,e:'카이로 선언(미·영·중)에서 ‘적절한 시기에’ 한국을 독립시키기로 처음 약속했어요. 얄타 회담은 소련의 대일전 참전, 포츠담 선언은 카이로 선언 재확인과 일본의 무조건 항복 촉구예요.'},

/* --- 통합과학2 --- */
{id:'s1a',u:'s1',p:'15쪽',q:'지질 시대를 상대적 길이가 긴 것부터 순서대로 나열한 것은?',o:['선캄브리아 시대 – 고생대 – 중생대 – 신생대','고생대 – 선캄브리아 시대 – 중생대 – 신생대','선캄브리아 시대 – 중생대 – 고생대 – 신생대','신생대 – 중생대 – 고생대 – 선캄브리아 시대','고생대 – 중생대 – 신생대 – 선캄브리아 시대'],a:0,e:'선캄브리아 시대(약 88.2 %) > 고생대(6.3 %) > 중생대(4.1 %) > 신생대(1.4 %)예요. 오래된 순서와 길이가 긴 순서가 같아요.'},
{id:'s1b',u:'s1',p:'16쪽',q:'고생대에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 오존층이 형성되어 생물이 육지로 진출하였다.','ㄴ. 공룡과 암모나이트가 번성하였다.','ㄷ. 말기에 판게아가 형성되고 삼엽충 등 많은 생물이 멸종하였다.'],o:['ㄱ','ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'],a:2,e:'공룡과 암모나이트는 중생대에 번성했어요. 고생대에는 삼엽충·어류·양서류·양치식물이 번성했어요.'},
{id:'s1c',u:'s1',p:'16–17쪽',q:'생물과 번성한 지질 시대의 짝이 옳은 것은?',o:['삼엽충 – 중생대','암모나이트 – 고생대','화폐석 – 신생대','매머드 – 중생대','겉씨식물 – 신생대'],a:2,e:'삼엽충은 고생대, 암모나이트·겉씨식물(은행나무)은 중생대, 화폐석·매머드·속씨식물은 신생대예요.'},
{id:'s1d',u:'s1',p:'16쪽',q:'선캄브리아 시대에 대한 설명으로 옳은 것은?',o:['화석이 많이 발견되어 당시 환경을 정확히 알 수 있다.','남세균의 광합성으로 바다와 대기의 산소가 늘었다.','양치식물이 육지에서 크게 번성하였다.','빙하기와 간빙기가 여러 차례 반복되었다.','공룡이 처음 나타났다.'],a:1,e:'선캄브리아 시대는 화석이 드물어요. 남세균이 광합성으로 산소를 만들었고, 스트로마톨라이트와 에디아카라 생물군 화석이 대표적이에요. 빙하기·간빙기 반복은 신생대 말이에요.'},
{id:'s1e',u:'s1',p:'17쪽',q:'중생대에 기후가 전반적으로 온난했던 까닭으로 가장 알맞은 것은?',o:['초대륙 판게아가 형성되었기 때문','화산 활동으로 이산화 탄소 농도가 높아져 온실 효과가 커졌기 때문','오존층이 처음 형성되었기 때문','빙하기가 반복되었기 때문','남세균이 산소를 많이 만들었기 때문'],a:1,e:'중생대에는 판게아가 분리되고 화산 활동이 활발해져 대기 중 이산화 탄소 농도가 높아졌고, 온실 효과로 기후가 따뜻했어요.'},
{id:'s1f',u:'s1',p:'18–19쪽',t:'ox',q:'급격한 환경 변화는 생물 대멸종의 원인이 되기도 하지만, 변화에 적응한 생물에게는 새로운 종으로 진화해 번성할 기회가 된다.',a:0,e:'맞아요. 그 결과 오늘날 지구에 다양한 생물이 분포하게 되었어요. 대멸종 가설에는 운석 충돌설, 화산 폭발설, 수륙 분포 변화설이 있어요.'},
{id:'s2a',u:'s2',p:'20쪽',q:'같은 종의 개체 사이에 변이가 나타나는 까닭으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 유성생식으로 자손이 서로 다른 유전자 조합을 가진다.','ㄴ. 돌연변이가 일어나 유전정보가 달라진다.','ㄷ. 개체마다 유전정보가 완전히 같다.'],o:['ㄱ','ㄴ','ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'],a:2,e:'변이는 개체마다 유전정보가 조금씩 다르기 때문에 나타나요. 유성생식과 돌연변이(유전자의 염기 배열 순서 변화)가 변이를 만들어요.'},
{id:'s2b',u:'s2',p:'22–23쪽',q:'자연선택 모의실험에서 ‘노란색 도화지 위의 초콜릿을 눈에 띄는 대로 손으로 집어내는 과정’은 무엇에 비유한 것인가?',o:['변이의 발생','돌연변이','포식자에게 잡아먹히는 것','살아남은 개체의 번식','유성생식'],a:2,e:'여러 색의 초콜릿 = 변이, 집어내기 = 포식(자연선택), 같은 색 추가 = 번식, 초록색 3개를 노란색으로 바꾸기 = 돌연변이예요. 배경과 색이 같은 노란색 초콜릿의 비율이 늘어나요.'},
{id:'s2c',u:'s2',p:'24–25쪽',q:'갈라파고스 제도에서 크고 단단한 씨앗이 많은 환경에 적응한 핀치의 부리 모양은?',o:['짧고 단단한 부리','뾰족하고 가느다란 부리','길고 뾰족한 부리','크고 두꺼운 부리','길고 휘어진 부리'],a:3,e:'핀치 조상 집단에 다양한 변이가 있었고, 먹이 환경에 맞는 부리를 가진 개체가 자연선택되어 여러 종으로 진화했어요. 길고 뾰족한 부리는 선인장이 잘 자라는 환경이에요.'},
{id:'s2d',u:'s2',p:'21쪽',q:'항생제에 계속 노출된 세균 집단에서 항생제 내성 세균의 비율이 늘어나는 현상을 설명하는 개념은?',o:['자연선택','생태계다양성','환원','에너지 보존','종다양성'],a:0,e:'항생제 내성이 있는 세균이 살아남아 자손을 더 많이 남기므로 내성 세균의 비율이 늘어요. 자연선택은 생물집단이 변하는 환경에 적응하게 해 줘요.'},
{id:'s2e',u:'s2',p:'26–27쪽',q:'헬리코니우스나비가 같은 종인데도 날개 무늬가 다양하게 나타나는 것은 생물다양성의 어떤 요소인가?',o:['유전적 다양성','종다양성','생태계다양성','개체군','군집'],a:0,e:'유전적 다양성은 한 종 안에서 개체들의 유전적 차이가 다양한 것이에요. 유전적 다양성이 높은 종은 환경이 급격히 변하거나 전염병이 돌아도 멸종할 가능성이 낮아요.'},
{id:'s2f',u:'s2',p:'27–28쪽',q:'종다양성에 대한 설명으로 옳은 것은?',o:['생물종의 수가 같으면 개체 수 비율과 상관없이 종다양성도 같다.','종다양성이 높을수록 먹이그물이 단순해진다.','종다양성이 높은 생태계일수록 안정적으로 유지된다.','생태계다양성이 높을수록 종다양성은 낮아진다.','한 종 안의 유전적 차이를 뜻한다.'],a:2,e:'종 수가 많고 각 종의 개체 수가 고를수록 종다양성이 높아요. 먹이그물이 복잡해져 한 종이 사라져도 다른 종이 역할을 대신하므로 생태계가 안정적이에요.'},
{id:'s2g',u:'s2',p:'28쪽',q:'생물자원과 그 이용의 짝이 옳지 않은 것은?',o:['디기탈리스 – 심장병 치료제','옥수수, 사탕수수 – 바이오에탄올','효모 – 식품 산업','목화, 누에 – 의복 재료','쌀, 콩 – 의약품'],a:4,e:'쌀·콩은 식량 자원이에요. 생물다양성이 높을수록 인간이 이용할 수 있는 생물자원의 종류도 많아져요.'},
{id:'s2h',u:'s2',p:'29–30쪽',q:'생물다양성 보전을 위한 노력으로 보기 어려운 것은?',o:['생물다양성이 높은 지역을 국립 공원으로 지정한다.','반달가슴곰 같은 멸종 위기종을 복원한다.','람사르 협약 같은 국제 협약을 맺는다.','대중교통을 이용하고 자원을 재활용한다.','습지를 메워 대규모 공장 단지를 짓는다.'],a:4,e:'서식지 파괴는 생물다양성을 낮추는 주요 원인이에요. 생물다양성 보전은 국가와 개인이 함께 노력해야 해요.'},
{id:'s3a',u:'s3',p:'40–45쪽',q:'산화에 해당하는 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 물질이 산소를 얻는다.','ㄴ. 물질이 전자를 얻는다.','ㄷ. 물질이 전자를 잃는다.'],o:['ㄱ','ㄴ','ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ'],a:3,e:'산화는 산소를 얻거나 전자를 잃는 반응, 환원은 산소를 잃거나 전자를 얻는 반응이에요. 산화와 환원은 항상 동시에 일어나요.'},
{id:'s3b',u:'s3',p:'41쪽',q:'다음 반응에서 산화되는 물질은?',bl:'반응식',bx:['CuO + CO → Cu + CO₂'],o:['CuO','CO','Cu','CO₂','O₂'],a:1,e:'일산화 탄소(CO)는 산소를 얻어 이산화 탄소가 되므로 산화되고, 산화 구리(Ⅱ)는 산소를 잃어 구리가 되므로 환원돼요. 구리판을 속불꽃에 넣으면 일어나는 반응이에요.'},
{id:'s3c',u:'s3',p:'42쪽',q:'아연판을 푸른색 황산 구리(Ⅱ) 수용액에 넣었을 때에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 아연은 전자를 잃어 산화된다.','ㄴ. 수용액의 푸른색이 점점 진해진다.','ㄷ. 구리 이온은 전자를 얻어 구리로 석출된다.'],o:['ㄱ','ㄴ','ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ'],a:3,e:'Zn + Cu²⁺ → Zn²⁺ + Cu. 푸른색을 띠게 하는 구리 이온이 줄어들어 푸른색은 점점 옅어져요.'},
{id:'s3d',u:'s3',p:'44쪽',q:'철의 제련 반응에서 환원되는 물질은?',bl:'반응식',bx:['Fe₂O₃ + 3CO → 2Fe + 3CO₂'],o:['Fe₂O₃','CO','Fe','CO₂','C'],a:0,e:'산화 철(Ⅲ)은 산소를 잃고 철이 되므로 환원되고, 일산화 탄소는 산소를 얻어 산화돼요.'},
{id:'s3e',u:'s3',p:'40–41쪽',q:'붉은색 구리판을 알코올램프의 겉불꽃에 넣어 가열하면 검은색으로 변하는 까닭은?',o:['구리가 산소를 잃어 환원되기 때문','구리가 산소를 얻어 산화 구리(Ⅱ)가 되기 때문','구리가 전자를 얻기 때문','겉불꽃에 일산화 탄소가 많기 때문','구리가 녹아 없어지기 때문'],a:1,e:'겉불꽃은 공기와 맞닿아 산소가 잘 공급돼요. 2Cu + O₂ → 2CuO. 반대로 속불꽃은 일산화 탄소가 많고 산소가 부족해요.'},
{id:'s4a',u:'s4',p:'72쪽',q:'일정한 지역에 사는 모든 개체군의 무리를 무엇이라고 하는가?',o:['개체','개체군','군집','생태계','비생물요소'],a:2,e:'개체군은 같은 지역에 사는 같은 종의 무리, 군집은 모든 개체군의 무리, 생태계는 생물이 다른 생물·환경과 영향을 주고받는 체계예요.'},
{id:'s4b',u:'s4',p:'74–75쪽',q:'생물요소가 비생물요소에 영향을 미친 사례는?',o:['국화는 낮이 짧아지는 시기에 꽃이 핀다.','사막여우는 북극여우보다 귀가 크다.','건조한 곳에 사는 선인장은 잎이 가시로 변했다.','비버가 만든 댐 때문에 강의 흐름이 느려지고 주변이 습지가 된다.','함초는 염분을 저장하는 조직이 발달했다.'],a:3,e:'나머지는 빛·온도·물·토양(비생물요소)이 생물에 영향을 준 사례예요. 식물이 광합성으로 산소 농도를 높이는 것도 생물 → 비생물 사례예요.'},
{id:'s4c',u:'s4',p:'73쪽',q:'버섯이나 곰팡이처럼 다른 생물의 사체나 배설물을 분해하여 양분을 얻는 생물은?',o:['생산자','1차 소비자','2차 소비자','분해자','비생물요소'],a:3,e:'생산자는 태양의 빛에너지로 양분을 만들고, 소비자는 다른 생물을 먹어 양분을 얻어요.'},
{id:'s5a',u:'s5',p:'99쪽',q:'태양 에너지의 생성에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 태양 중심부에서 수소 핵융합 반응으로 생성된다.','ㄴ. 헬륨 원자핵 1개의 질량은 수소 원자핵 4개의 질량을 합친 것보다 작다.','ㄷ. 핵융합 반응은 주로 태양 표면에서 일어난다.'],o:['ㄱ','ㄷ','ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'],a:2,e:'수소 원자핵 4개가 헬륨 원자핵 1개가 될 때 줄어든 질량이 에너지로 바뀌어요. 핵융합은 온도가 약 1500만 K인 중심부에서만 일어나요(표면은 약 6000 K).'},
{id:'s5b',u:'s5',p:'100–101쪽',q:'지표면이 태양 에너지를 받아 가열되면 기압 차가 생겨 바람이 분다. 이 과정의 에너지 전환으로 옳은 것은?',o:['빛에너지 → 화학 에너지','열에너지 → 운동 에너지','화학 에너지 → 전기 에너지','운동 에너지 → 소리 에너지','핵에너지 → 위치 에너지'],a:1,e:'태양의 열에너지가 지표면을 가열하고, 온도 차 → 기압 차 → 바람(운동 에너지)으로 전환돼요. 광합성은 빛에너지 → 화학 에너지예요.'},
{id:'s6a',u:'s6',p:'112쪽',q:'어떤 조명 기구에 전기 에너지 500 J을 공급하였더니 빛에너지 150 J과 열에너지 350 J로 전환되었다. 이 조명 기구의 에너지 효율은?',o:['15 %','30 %','35 %','70 %','100 %'],a:1,e:'에너지 효율(%) = 유용하게 사용한 에너지 ÷ 공급한 전체 에너지 × 100 = 150 ÷ 500 × 100 = 30 %. 조명 기구에서 유용한 에너지는 빛에너지예요.'},
{id:'s6b',u:'s6',p:'111쪽',t:'num',unit:'J',q:'휴대 전화에 전기 에너지 100 J을 공급했더니 빛에너지 30 J, 소리 에너지 15 J, 운동 에너지(진동) 5 J로 전환되고 나머지는 모두 열에너지로 전환되었다. 열에너지는 몇 J인가?',a:50,e:'에너지 보존 법칙: 전환 전 에너지의 총량 = 전환 후 에너지의 총량.\n100 − (30 + 15 + 5) = 50 J'},
{id:'s6c',u:'s6',p:'115쪽',q:'재생 에너지가 아닌 것은?',o:['태양광','풍력','수력','지열','수소 에너지'],a:4,e:'수소 에너지와 연료 전지는 신에너지예요. 신재생 에너지 = 신에너지 + 재생 에너지(태양광, 태양열, 풍력, 수력, 지열 등).'},
{id:'s6d',u:'s6',p:'112–114쪽',q:'에너지 효율과 에너지 절약에 대한 설명으로 옳지 않은 것은?',o:['백열등 대신 발광 다이오드(LED)를 쓰면 적은 전기로 같은 효과를 낼 수 있다.','전기 자동차는 감속할 때 운동 에너지를 전기 에너지로 바꿔 저장한다.','에너지 수확 기술은 버려지는 적은 양의 에너지를 모아 전기를 만든다.','에너지 절약 표시 제품은 사용하지 않을 때 소모되는 전기를 줄였다.','에너지 소비 효율 등급은 5등급에 가까울수록 효율이 높다.'],a:4,e:'에너지 소비 효율 등급은 1등급에 가까울수록 효율이 높아 에너지를 절약할 수 있어요.'},
{id:'s6e',u:'s6',p:'112–113쪽',t:'ox',q:'노트북을 사용할 때 발생하는 열에너지는 유용하게 사용한 에너지이다.',a:1,e:'전기 기구에서 발생하는 열은 대부분 쓸모없이 버려지는 에너지예요. 그래서 에너지 효율은 100 %보다 작아요.'},
{id:'s7a',u:'s7',p:'153쪽',q:'과학자의 연구 윤리 중 ‘다른 과학자의 연구 결과를 함부로 사용하지 않는다’에 해당하는 것은?',o:['정직성과 개방성','실험 대상에 대한 존중','지식 재산권 존중','상호 존중','사회적 책임'],a:2,e:'정직성과 개방성은 조작·거짓 금지와 연구 공개, 상호 존중은 동료 존중과 성과의 공정한 분배, 사회적 책임은 악영향을 끼치는 연구를 피하고 공공의 이익을 추구하는 것이에요.'},
{id:'s7b',u:'s7',p:'153쪽',t:'ox',q:'과학자는 사회에 악영향을 미치는 연구에도 적극적으로 참여해야 한다.',a:1,e:'사회적 책임에 따라 사회에 악영향을 미치는 연구는 피하고 공공의 이익을 위해 노력해야 해요.'},

/* --- 직무수학 --- */
{id:'m1a',u:'m1',p:'15쪽',t:'num',unit:'cm',q:'가로 72 cm, 세로 48 cm인 직사각형 모양의 종이를 남는 부분 없이 가장 큰 정사각형 여러 개로 자르려고 한다. 정사각형의 한 변의 길이는?',a:24,e:'가능한 한 큰 정사각형 → 최대공약수.\n72 = 2³ × 3², 48 = 2⁴ × 3 → 최대공약수 2³ × 3 = 24'},
{id:'m1b',u:'m1',p:'16쪽',t:'num',unit:'cm',q:'가로, 세로, 높이가 각각 4 cm, 6 cm, 10 cm인 상자를 같은 방향으로 쌓아 가장 작은 정육면체를 만들 때, 정육면체의 한 모서리의 길이는?',a:60,e:'쌓으면 모서리가 각 길이의 배수로 늘어나므로 최소공배수.\n4 = 2², 6 = 2 × 3, 10 = 2 × 5 → 2² × 3 × 5 = 60'},
{id:'m1c',u:'m1',p:'16쪽',q:'수명이 4년인 기계 A와 6년인 기계 B를 2025년에 함께 샀다. 수명이 다하면 바로 다시 산다고 할 때, 두 기계를 다음으로 동시에 사야 하는 해는?',o:['2029년','2031년','2035년','2037년','2049년'],a:3,e:'4와 6의 최소공배수는 12이므로 12년 뒤인 2037년이에요.'},
{id:'m1d',u:'m1',p:'17쪽',t:'num',unit:'km',q:'시속 80 km로 달리는 버스가 45분 동안 이동한 거리는?',a:60,e:'거리 = 속력 × 시간 = 80 × 45/60 = 60 km. 분은 60으로 나눠 시간으로 바꿔요.'},
{id:'m1e',u:'m1',p:'17쪽',t:'num',unit:'분',q:'둘레가 3 km인 호수 둘레를 두 사람이 같은 지점에서 반대 방향으로 각각 분속 70 m, 80 m로 걷기 시작했다. 처음 만나는 것은 몇 분 후인가?',a:20,e:'반대 방향이면 1분에 70 + 80 = 150 m씩 가까워져요.\n3 km = 3000 m → 3000 ÷ 150 = 20분'},
{id:'m1f',u:'m1',p:'20–21쪽',q:'직원 173명에게 음료를 한 캔씩 나눠 주려고 한다. 24캔들이 상자 단위로만 주문할 수 있다면 최소 몇 상자를 주문해야 하는가?',o:['6상자','7상자','8상자','9상자','10상자'],a:2,e:'173 ÷ 24 = 7.2…이므로 7상자로는 부족해요. 모자라면 안 되는 상황이라 올림해서 8상자예요.'},
{id:'m1g',u:'m1',p:'20쪽',q:'7,845,210을 반올림하여 만의 자리까지 나타낸 수는?',o:['7,840,000','7,845,000','7,850,000','7,800,000','7,900,000'],a:2,e:'만의 자리까지 나타내려면 바로 아래 천의 자리 숫자(5)를 봐요. 5 이상이므로 올려서 7,850,000이에요.'},
{id:'m1h',u:'m1',p:'10–14쪽',t:'num',unit:'원',q:'단가 1,200원인 볼펜 20자루, 단가 1,500원인 수정테이프 10개, 단가 500원인 메모지 20묶음을 주문했다. 총금액은?',a:49000,e:'1,200 × 20 + 1,500 × 10 + 500 × 20\n= 24,000 + 15,000 + 10,000 = 49,000원'},
{id:'m2a',u:'m2',p:'24–25쪽',q:'오전 9시 20분에 출발해 2시간 40분 이동하고, 휴게소에서 25분 쉰 뒤 다시 1시간 35분을 이동했다. 도착한 시각은?',o:['오후 1시 20분','오후 1시 40분','오후 2시','오후 2시 20분','오후 2시 40분'],a:2,e:'2시간 40분 + 25분 + 1시간 35분 = 4시간 40분.\n9시 20분 + 4시간 40분 = 14시 = 오후 2시'},
{id:'m2b',u:'m2',p:'28쪽',t:'num',unit:'in',q:'허리둘레가 76 cm인 손님에게 1인치 단위로 파는 청바지를 권하려고 한다. 몇 인치가 알맞은가? (1 in = 2.54 cm, 소수 첫째 자리에서 반올림)',a:30,e:'76 ÷ 2.54 = 29.92… → 반올림하여 30인치'},
{id:'m2c',u:'m2',p:'28쪽',q:'8 oz짜리 스테이크의 무게는 몇 g인가? (1 oz = 28.35 g)',o:['28.35 g','113.4 g','226.8 g','236.8 g','453.6 g'],a:2,e:'8 × 28.35 = 226.8 g. 무게의 oz(28.35 g)와 들이의 oz(29.6 mL)를 구별해요.'},
{id:'m2d',u:'m2',p:'28쪽',q:'12 lb짜리 볼링공의 무게는 몇 kg인가? (단, 1 lb = 0.453 kg)',o:['2.718 kg','5.436 kg','5.4 kg','12.453 kg','26.49 kg'],a:1,e:'12 × 0.453 = 5.436 kg. ‘단,’으로 주어진 환산값으로 계산해요.'},
{id:'m2e',u:'m2',p:'28쪽',q:'10 ft는 몇 cm인가? (1 ft = 30.48 cm)',o:['25.4 cm','30.48 cm','120 cm','254 cm','304.8 cm'],a:4,e:'10 × 30.48 = 304.8 cm. 1 ft = 12 in이라는 것도 같이 기억해요.'},
{id:'m3a',u:'m3',p:'38쪽',t:'num',unit:'g',q:'소금빵 12개를 만드는 데 밀가루 360 g이 필요하다. 같은 방법으로 30개를 만들 때 필요한 밀가루의 양은?',a:900,e:'12 : 360 = 30 : x → 외항의 곱 = 내항의 곱\n12x = 360 × 30, x = 900'},
{id:'m3b',u:'m3',p:'39쪽',t:'num',unit:'원',q:'중국의 1위안이 190원일 때, 250위안을 우리나라 돈으로 환산하면?',a:47500,e:'250 × 190 = 47,500원. 일본 엔과 중국 위안의 기호는 둘 다 ¥예요.'},
{id:'m3c',u:'m3',p:'41쪽',t:'num',unit:'명',q:'신입 사원 지원자 1,500명 중 15 %가 합격했다면 합격자는 몇 명인가?',a:225,e:'1,500 × 15/100 = 225명'},
{id:'m3d',u:'m3',p:'41쪽',q:'0.3752를 할, 푼, 리, 모로 나타낸 것은?',o:['3할 7푼 5리 2모','3푼 7리 5모 2할','37할 5푼 2리','3할 75푼 2리','3리 7모 5푼 2할'],a:0,e:'소수 첫째 자리 = 할, 둘째 = 푼, 셋째 = 리, 넷째 = 모예요.'},
{id:'m3e',u:'m3',p:'43쪽',q:'매입 원가가 250,000원인 의자를 320,000원에 팔았다. 이익률은?',o:['7 %','21.875 %','25 %','28 %','78 %'],a:3,e:'매출 이익 = 320,000 − 250,000 = 70,000원.\n이익률 = 70,000 ÷ 250,000 = 0.28 → 28 %. 기준은 판매가가 아니라 매입 원가예요.'},
{id:'m3f',u:'m3',p:'37쪽',q:'두 자동차 A, B의 과실 비율이 30 : 70으로 판정되었고 총 수리비가 2,500만 원일 때, A가 부담할 금액은?',o:['250만 원','750만 원','1,000만 원','1,750만 원','2,100만 원'],a:1,e:'A의 몫 = 2,500만 × 30/(30 + 70) = 750만 원. B는 1,750만 원이에요.'},
{id:'m4a',u:'m4',p:'85쪽',q:'직육면체의 겨냥도를 그릴 때 점선으로 그리는 모서리는 몇 개인가?',o:['1개','2개','3개','4개','9개'],a:2,e:'겨냥도에서 보이는 모서리는 실선, 보이지 않는 모서리는 점선으로 그려요. 직육면체는 보이는 모서리 9개, 보이지 않는 모서리 3개예요.'},
{id:'m4b',u:'m4',p:'91쪽',q:'입체도형을 위에서 수직으로 내려다본 모양을 그린 그림은?',o:['정면도','평면도','우측면도','겨냥도','전개도'],a:1,e:'앞 = 정면도, 위 = 평면도, 오른쪽 옆 = 우측면도이고, 이 셋을 통틀어 삼면도라고 해요.'},
{id:'m4c',u:'m4',p:'87–88쪽',q:'전개도에 대한 설명으로 옳지 않은 것은?',o:['입체도형의 모서리를 잘라 한 평면 위에 펼친 그림이다.','접히는 부분은 점선으로 그린다.','서로 마주 보는 면은 합동이 되도록 그린다.','같은 입체도형도 펼치는 방법에 따라 여러 가지로 그릴 수 있다.','접었을 때 두 면이 겹쳐도 전개도라고 할 수 있다.'],a:4,e:'접었을 때 겹치는 면이나 비는 면이 있으면 그 입체도형의 전개도가 될 수 없어요.'},
{id:'m4d',u:'m4',p:'97쪽',q:'축척이 1 : 50,000인 지도에서 두 지점 사이의 거리가 3 cm일 때, 실제 거리는?',o:['150 m','1.5 km','15 km','150 km','0.15 km'],a:1,e:'3 × 50,000 = 150,000 cm = 1,500 m = 1.5 km'},
{id:'m4e',u:'m4',p:'95쪽',q:'도형을 한 점을 중심으로 일정한 각도만큼 돌려서 옮기는 것은?',o:['평행이동','대칭이동','회전이동','합동','닮음'],a:2,e:'평행이동은 일정한 방향·거리, 대칭이동은 한 점이나 직선에 대칭, 회전이동은 한 점을 중심으로 일정한 각도만큼 옮기는 것이에요. 회전해도 각 점과 회전의 중심 사이의 거리는 같아요.'},
{id:'m5a',u:'m5',p:'102쪽',t:'num',unit:'mm',q:'한 변의 길이가 9 mm인 정육각형 모양 귀고리의 테두리에 필요한 금실의 길이는?',a:54,e:'정육각형의 둘레 = 9 × 6 = 54 mm'},
{id:'m5b',u:'m5',p:'103쪽',t:'num',unit:'개',q:'가로 4.8 m, 세로 3 m인 벽면에 한 변이 20 cm인 정사각형 타일을 빈틈없이 붙이려면 타일은 몇 개 필요한가?',a:360,e:'단위를 cm로 맞춰요. 480 ÷ 20 = 24개, 300 ÷ 20 = 15개\n→ 24 × 15 = 360개'},
{id:'m5c',u:'m5',p:'101쪽',q:'반지름이 6 cm, 중심각이 60°인 부채꼴의 넓이는?',o:['2π cm²','6π cm²','12π cm²','36π cm²','6 cm²'],a:1,e:'S = πr² × 중심각/360 = π × 36 × 60/360 = 6π cm²\n호의 길이는 2π × 6 × 60/360 = 2π cm예요.'},
{id:'m5d',u:'m5',p:'101쪽',t:'num',unit:'cm²',q:'윗변 6 cm, 아랫변 10 cm, 높이 5 cm인 사다리꼴의 넓이는?',a:40,e:'S = ½ × (윗변 + 아랫변) × 높이 = ½ × 16 × 5 = 40'},

/* --- 중국어 --- */
{id:'z1a',u:'z1',p:'9–10쪽',q:'중국의 수도는?',o:['상하이','베이징','홍콩','광저우','시안'],a:1,e:'수도는 베이징(北京)이에요. 정식 명칭은 중화인민공화국(中华人民共和国)이에요.'},
{id:'z1b',u:'z1',p:'10, 14쪽',q:'중국 인구의 약 91 %를 차지하는 민족은?',o:['한족','몽골족','만주족','티베트족','조선족'],a:0,e:'중국은 한족(汉族)과 55개의 소수 민족으로 이루어져 있어요. ‘한어(汉语)’는 한족이 쓰는 언어라는 뜻이에요.'},
{id:'z1c',u:'z1',p:'8–10쪽',q:'중국 국기의 이름은?',o:['일장기','청천백일기','오성홍기','태극기','성조기'],a:2,e:'오성홍기(五星红旗)에는 별 5개가 그려져 있어요.'},
{id:'z1d',u:'z1',p:'9쪽',t:'ox',q:'과일 등에 설탕물을 입혀 만든 중국인들의 간식은 ‘마라탕’이다.',a:1,e:'과일에 설탕물을 입혀 굳힌 간식은 탕후루예요. ‘중국의 샤부샤부’라고 불리는 음식은 훠궈예요.'},
{id:'z1e',u:'z1',p:'8–11쪽',q:'중국에 대한 설명으로 옳지 않은 것은?',o:['국토 면적은 세계 4위로 한반도의 약 44배이다.','중국어는 국제 연합(UN)의 공식 언어이다.','중국은 우리나라의 무역 상대국 1위이다.','행정 구역에는 4개의 직할시와 2개의 특별 행정구가 있다.','중국과 우리나라의 표준시는 같다.'],a:4,e:'중국과 우리나라의 표준시는 1시간 차이가 나요.'},
{id:'z2a',u:'z2',p:'14쪽',q:'중국 정부가 원활한 의사소통을 위해 정한 표준어는?',o:['한어병음(汉语拼音)','보통화(普通话)','간화자(简化字)','번체자','경성'],a:1,e:'표준어는 보통화, 간단하게 만든 한자는 간화자(马), 로마자로 발음을 적는 방법은 한어병음이에요.'},
{id:'z2b',u:'z2',p:'15쪽',q:'음높이가 2 → 1 → 4로 변하는 성조는?',o:['제1성','제2성','제3성','제4성','경성'],a:2,e:'제1성 5→5, 제2성 3→5, 제3성 2→1→4, 제4성 5→1. 성모와 운모가 같아도 성조에 따라 뜻이 달라져요(mā 엄마, mǎ 말).'},
{id:'z2c',u:'z2',p:'15쪽',q:'경성에 대한 설명으로 옳은 것은?',o:['음을 길고 높게 낸다.','성조 부호 ‘ˉ’로 표시한다.','본래의 성조를 잃고 짧고 가볍게 낸다.','항상 같은 높이로 발음한다.','음절의 첫머리에 오는 자음이다.'],a:2,e:'경성은 성조 표시를 하지 않고, 앞 음절의 성조에 따라 음높이가 달라져요(māma, bàba).'},
{id:'z2d',u:'z2',p:'16쪽',q:'혀뿌리를 여린입천장 뒤쪽에 가까이 대고 내는 성모끼리 묶은 것은?',o:['b p m','d t n l','g k h','j q x','z c s'],a:2,e:'b p m은 두 입술, d t n l은 혀끝과 윗잇몸, j q x는 혓바닥 앞부분, zh ch sh r은 혀끝을 말아서, z c s는 혀끝과 윗니 뒤쪽에서 소리 내요.'},
{id:'z2e',u:'z2',p:'16–17쪽',t:'ox',q:'성모는 음절의 첫머리에 오는 자음이고, 운모는 음절에서 성모를 뺀 나머지 부분이다.',a:0,e:'맞아요. 한어병음은 성모 + 운모 + 성조로 이루어져요.'},
{id:'z3a',u:'z3',p:'18쪽',q:'한어병음 표기가 옳지 않은 것은?',o:['yue','wo','jü','niu','kun'],a:2,e:'j, q, x 뒤에 ü가 오면 두 점을 생략해 ju로 써요. üe → yue, uo → wo, n + iou → niu, k + uen → kun은 모두 맞아요.'},
{id:'z3b',u:'z3',p:'18쪽',q:'성조 부호의 위치가 옳지 않은 것은?',o:['pǎo','duō','fēi','túi','liù'],a:3,e:'iu와 ui는 뒤 모음에 성조를 표기하므로 tuí가 맞아요. 모음이 둘 이상이면 a > o, e > i, u, ü 순서로 표기해요.'},
{id:'z3c',u:'z3',p:'18쪽',q:'성모 없이 운모 uai만 쓸 때의 표기로 옳은 것은?',o:['uai','wai','yai','wuai','uay'],a:1,e:'i, u, ü가 음절 첫 글자이고 뒤에 다른 모음이 오면 y, w, yu로 바꿔 써요(iao → yao, uo → wo, üan → yuan).'},
{id:'z3d',u:'z3',p:'18쪽',q:'x + iou를 한어병음 규칙에 맞게 쓴 것은?',o:['xiou','xiu','xou','xyou','xü'],a:1,e:'iou, uei, uen 앞에 성모가 있으면 가운데 모음을 생략해요. n + iou → niu, d + uei → dui, k + uen → kun'},
{id:'z3e',u:'z3',p:'19쪽',q:'숫자와 한어병음의 짝이 옳지 않은 것은?',o:['一 yī','三 sān','六 liù','八 bā','十 sì'],a:4,e:'十은 shí, 四가 sì예요.\n一 yī, 二 èr, 三 sān, 四 sì, 五 wǔ, 六 liù, 七 qī, 八 bā, 九 jiǔ, 十 shí'},
{id:'z4a',u:'z4',p:'24쪽',q:'你好! Nǐ hǎo!의 실제 발음으로 옳은 것은?',o:['nǐ hǎo','ní hǎo','nī hāo','nì hào','ní háo'],a:1,e:'제3성이 연속되면 앞의 제3성을 제2성으로 발음해요. 하지만 성조 표기는 바꾸지 않고 Nǐ hǎo로 써요.'},
{id:'z4b',u:'z4',p:'26쪽',q:'不客气의 한어병음 표기로 옳은 것은?',o:['bù kèqi','bú kèqi','bǔ kèqi','bū kèqi','bu kèqì'],a:1,e:'不는 원래 제4성이지만 뒤에 제4성이 오면 제2성으로 발음하고, 표기도 바뀐 성조로 해요. 不好(bù hǎo)는 그대로예요.'},

{id:'z4e',u:'z4',p:'26쪽',q:'A: 谢谢!  B: ______  빈칸에 들어갈 대답으로 알맞은 것은?',o:['你好!','不客气!','对不起。','再见!','没关系。'],a:1,e:'谢谢(Xièxie, 고마워)에는 不客气(Bú kèqi, 천만에)로 대답해요. 没关系는 사과에 대한 대답이에요.'},
{id:'z4f',u:'z4',p:'27–29쪽',q:'A: 对不起。 B: ______  빈칸에 들어갈 대답으로 알맞은 것은?',o:['没关系。','谢谢!','你们好!','明天见!','不好意思。'],a:0,e:'对不起(Duìbuqǐ, 미안합니다)에는 没关系(Méi guānxi, 괜찮아)로 대답해요.'},
{id:'z4g',u:'z4',p:'27쪽',q:'不好意思에 대한 설명으로 옳은 것은?',o:['감사의 뜻을 나타낸다.','对不起보다 비교적 가벼운 사과 표현이다.','헤어질 때 하는 인사이다.','对不起보다 더 정중하고 무거운 사과이다.','축하할 때 하는 말이다.'],a:1,e:'不好意思(bù hǎoyìsi)는 가벼운 사과, 对不起(duìbuqǐ)는 그보다 무거운 사과예요.'},
{id:'z4h',u:'z4',p:'24–25쪽',q:'‘그들’을 뜻하는 중국어로 옳은 것은?',o:['我们','你们','他们','大家','老师'],a:2,e:'们(men)은 복수를 나타내요. 我们 우리, 你们 너희, 他们 그들, 她们 그녀들. 大家는 ‘모두, 여러분’이에요.'},
{id:'z5a',u:'z5',p:'30쪽',q:'중국의 전통 인사법 拱手(gǒngshǒu)에 대한 설명으로 옳은 것은?',o:['허리를 깊이 숙여 절한다.','두 손을 모아 이마에 댄다.','한 손은 주먹을 쥐고 다른 손으로 감싸 가볍게 흔든다.','손바닥을 마주쳐 박수를 친다.','오른손을 가슴에 얹는다.'],a:2,e:'拱手는 ‘두 손을 맞잡다’라는 뜻으로 축복이나 존경을 표시해요. 무술 경기나 공연에서는 抱拳(bàoquán)으로 인사하기도 해요.'},
{id:'z5b',u:'z5',p:'30–31쪽',q:'인사말과 뜻의 짝이 옳지 않은 것은?',o:['恭喜恭喜! – 축하합니다!','晚安。 – 잘 자.','你去哪儿? – 어디 가니?','你吃饭了吗? – 밥 먹었니?','慢走。 – 축하합니다!'],a:4,e:'慢走(Mànzǒu)는 ‘잘 가’라는 배웅 인사예요. 恭喜恭喜(Gōngxǐ gōngxǐ)가 ‘축하합니다’예요.'},
{id:'z5c',u:'z5',p:'30쪽',t:'ox',q:'중국 학생들은 선생님께 손을 흔들어 인사해도 예의에 어긋나지 않는다.',a:0,e:'중국에서는 나이에 상관없이 손을 흔들며 인사하고, 어른께 고개를 숙이지 않고 악수나 가벼운 눈인사를 해도 예의에 어긋나지 않아요.'}

{id:'hw3',u:'h2',p:'23–26쪽',t:'essay',q:'3·1 운동이 대한민국 임시 정부 수립에 미친 영향을 서술하시오.',m:'3·1 운동을 계기로 독립운동을 체계적이고 조직적으로 이끌 지도부가 필요하다는 인식이 커졌다. 그 결과 1919년 9월 상하이에서 여러 임시 정부가 통합되어 대한민국 임시 정부가 수립되었고, 이는 우리 역사 최초의 민주 공화제 정부였다.',k:['조직적인 지도부 필요','1919년 9월 상하이에서 통합','최초의 민주 공화제 정부']},
{id:'hw4',u:'h3',p:'42–43쪽',t:'essay',q:'신간회의 결성 배경과 주요 활동을 서술하시오.',m:'6·10 만세 운동과 정우회 선언(1926)의 영향으로 비타협적 민족주의 세력과 사회주의 세력이 손잡고 1927년 신간회를 결성하였다(회장 이상재). 신간회는 일제 강점기 최대의 합법적 항일 단체로 전국에 지회를 두었고, 광주 학생 항일 운동이 일어나자 진상 조사단을 파견하였다.',k:['비타협적 민족주의 + 사회주의','정우회 선언','최대 합법 항일 단체','광주 학생 항일 운동 진상 조사단']},
{id:'sw1',u:'s2',p:'22–23쪽',t:'essay',q:'자연선택 모의실험에서 노란색 도화지 위의 노란색 초콜릿 비율이 늘어나는 까닭을 자연선택과 관련지어 서술하시오.',m:'노란색 초콜릿은 배경색과 같아 눈에 잘 띄지 않으므로 손(포식자)에게 덜 잡혀 살아남는다. 살아남은 초콜릿이 번식하여 같은 색 자손을 남기는 과정이 반복되면서 노란색 초콜릿의 비율이 늘어난다.',k:['배경색과 같아 눈에 덜 띔','포식자에게 덜 잡혀 살아남음','번식하여 자손을 남김','반복되며 비율 증가']},
{id:'sw2',u:'s2',p:'27–28쪽',t:'essay',q:'종다양성이 높은 생태계가 안정적으로 유지되는 까닭을 서술하시오.',m:'종다양성이 높으면 먹이그물이 복잡하게 형성되어, 한 생물종이 사라지더라도 다른 생물종이 그 역할을 대신할 수 있으므로 생태계가 안정적으로 유지된다.',k:['먹이그물이 복잡','한 종이 사라져도 다른 종이 역할 대체']},
{id:'sw3',u:'s3',p:'40–41쪽',t:'essay',q:'구리판을 알코올램프의 겉불꽃에서 가열하면 검게 변했다가, 속불꽃에 넣으면 다시 붉은색으로 변한다. 그 까닭을 산화·환원으로 서술하시오.',m:'겉불꽃은 산소가 충분하여 구리가 산소를 얻어 검은색 산화 구리(Ⅱ)로 산화된다. 속불꽃에는 일산화 탄소가 많아 산화 구리(Ⅱ)가 산소를 잃고 구리로 환원되므로 다시 붉은색이 된다. 이때 일산화 탄소는 산소를 얻어 이산화 탄소로 산화된다.',k:['겉불꽃: 구리가 산소를 얻어 산화','속불꽃: 일산화 탄소가 많음','산화 구리(Ⅱ)가 환원','일산화 탄소는 산화']},
{id:'sw4',u:'s5',p:'99쪽',t:'essay',q:'태양 에너지가 생성되는 원리를 서술하시오.',m:'태양 중심부에서 수소 원자핵 4개가 융합하여 헬륨 원자핵 1개가 되는 수소 핵융합 반응이 일어난다. 이때 반응 후 줄어든 질량이 에너지로 전환된다.',k:['태양 중심부','수소 핵융합 반응','수소 원자핵 4개 → 헬륨 원자핵 1개','줄어든 질량이 에너지로 전환']},
{id:'sw5',u:'s6',p:'114쪽',t:'essay',q:'전기 자동차가 일반 자동차보다 에너지 효율이 높은 까닭을 서술하시오.',m:'전기 자동차는 감속하는 동안 자동차의 운동 에너지를 전기 에너지로 전환하여 전지에 저장했다가 다시 사용하므로 에너지 효율이 높다.',k:['감속할 때','운동 에너지 → 전기 에너지','전지에 저장해 다시 사용']},
{id:'mw1',u:'m1',p:'15쪽',t:'essay',q:'가로 72 cm, 세로 48 cm인 종이를 남는 부분 없이 가장 큰 정사각형으로 자를 때, 만들어지는 정사각형의 개수를 구하는 과정을 서술하시오.',m:'72와 48의 최대공약수는 24이므로 정사각형의 한 변은 24 cm이다. 가로로 72 ÷ 24 = 3개, 세로로 48 ÷ 24 = 2개씩 나오므로 정사각형은 3 × 2 = 6개이다.',k:['최대공약수 24 cm','가로 3개, 세로 2개','답 6개']},
{id:'mw2',u:'m1',p:'17쪽',t:'essay',q:'오전 8시 45분에 출발하여 시속 60 km로 135 km를 이동하였다. 도착 시각을 구하는 과정을 서술하시오.',m:'시간 = 거리 ÷ 속력 = 135 ÷ 60 = 2.25시간이다. 0.25시간은 15분이므로 2시간 15분이 걸린다. 따라서 도착 시각은 8시 45분 + 2시간 15분 = 오전 11시이다.',k:['시간 = 거리 ÷ 속력','2.25시간 = 2시간 15분','답 오전 11시']},
{id:'mw3',u:'m3',p:'43쪽',t:'essay',q:'매입 원가가 8,000원인 상품을 6,800원에 팔았을 때 손실률을 구하는 과정을 서술하시오.',m:'매출 손실 금액 = 8,000 − 6,800 = 1,200원이다. 손실률 = 매출 손실 금액 ÷ 매입 원가 = 1,200 ÷ 8,000 = 0.15이므로 손실률은 15 %이다.',k:['손실 금액 1,200원','매입 원가로 나눔','답 15 %']},
{id:'mw4',u:'m5',p:'101쪽',t:'essay',q:'반지름이 10 cm, 중심각이 72°인 부채꼴의 둘레를 구하는 과정을 서술하시오. (원주율은 π로 나타낸다.)',m:'호의 길이 = 2π × 10 × 72/360 = 4π cm이다. 부채꼴의 둘레 = 호의 길이 + 반지름 2개 = 4π + 20이므로 둘레는 (4π + 20) cm이다.',k:['호의 길이 4π cm','반지름 2개(20 cm)를 더함','답 (4π + 20) cm']},
{id:'zw1',u:'z4',p:'24, 26쪽',t:'essay',q:'제3성의 성조 변화와 不의 성조 변화를 표기 방법의 차이를 포함하여 서술하시오.',m:'제3성이 연속되면 앞의 제3성을 제2성으로 발음하지만 표기는 원래 성조 그대로 한다(Nǐ hǎo). 不(bù)는 뒤에 제4성이 오면 제2성으로 발음하고, 표기도 바뀐 성조로 한다(bú kèqi).',k:['제3성 + 제3성 → 제2성 + 제3성','제3성 변화는 표기 그대로','不 + 제4성 → bú','不는 바뀐 성조로 표기']},
{id:'zw2',u:'z3',p:'18쪽',t:'essay',q:'한어병음 표기 규칙 중 ‘빼기 규칙’ 두 가지를 예를 들어 서술하시오.',m:'첫째, j, q, x 뒤에 ü가 오면 ü 위의 두 점을 생략하고 표기한다(j + ü → ju). 둘째, iou, uei, uen 앞에 성모가 있으면 가운데 모음을 생략하고 표기한다(n + iou → niu, d + uei → dui, k + uen → kun).',k:['j, q, x 뒤 ü의 두 점 생략','iou, uei, uen의 가운데 모음 생략','예: ju / niu, dui, kun']},
{id:'zw3',u:'z5',p:'30쪽',t:'essay',q:'중국인의 인사 문화가 우리나라와 다른 점을 한 가지 이상 서술하시오.',m:'중국에서는 나이에 상관없이 손을 흔들어 인사하며, 어른에게 고개를 숙이지 않고 한 손으로 악수하거나 가볍게 눈인사를 해도 예의에 어긋나지 않는다. 또 두 손을 맞잡는 전통 인사법인 拱手(gǒngshǒu)로 축복이나 존경을 표시하기도 한다.',k:['나이에 상관없이 손을 흔들어 인사','고개를 숙이지 않아도 예의에 맞음','拱手: 두 손을 맞잡는 인사']}

{id:'hc1',u:'h1',p:'12쪽',d:2,q:'다음 법령이 시행된 시기에 볼 수 있었던 모습으로 옳은 것은?',bl:'자료',bx:['제1조 3월 이하의 징역 또는 구류에 처하여야 할 자는 그 정상에 따라 태형에 처할 수 있다. … 제13조 본령은 조선인에 한하여 적용한다.'],o:['교사가 제복을 입고 칼을 차고 수업하였다.','치안 유지법으로 사회주의자를 탄압하였다.','학생들이 황국 신민 서사를 외웠다.','애국반이 공출과 징용을 담당하였다.','보통 경찰이 치안을 담당하였다.'],a:0,e:'조선 태형령(1912)으로, 1910년대 무단 통치 시기예요. 이때는 관리·교사도 제복을 입고 칼을 찼어요.'},
{id:'hc2',u:'h1',p:'15쪽',d:2,q:'1920년대 일제의 경제 정책으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 회사령을 폐지하고 신고제로 바꾸었다.','ㄴ. 일본 상품에 대한 관세를 대부분 폐지하였다.','ㄷ. 남부에는 면화, 북부에는 양 사육을 강요하였다.','ㄹ. 토지 조사 사업을 시작하였다.'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ'],a:0,e:'남면북양 정책은 1930년대, 토지 조사 사업은 1910년에 시작되었어요.'},

{id:'hc6',u:'h2',p:'26쪽',d:2,q:'대한민국 임시 정부가 상하이에 자리 잡은 까닭으로 가장 알맞은 것은?',o:['외교 활동에 유리하였기 때문','무장 투쟁에 가장 유리하였기 때문','국내와 가장 가까웠기 때문','일본의 허가를 받았기 때문','의열단 본부가 있었기 때문'],a:0,e:'외교 활동에 유리한 상하이가 선택되었어요. 간도·연해주가 무장 투쟁에 유리하다는 주장도 있었어요.'},
{id:'hc7',u:'h2',p:'22, 27쪽',d:3,q:'대한민국 임시 정부의 활동이 아닌 것은?',o:['독립 공채 발행','『독립신문』 발행','『한일 관계 사료집』 편찬','구미 위원부 설치','2·8 독립 선언 발표'],a:4,e:'2·8 독립 선언은 1919년 2월 도쿄 유학생들이 발표했어요. 임시 정부는 그 뒤인 1919년 9월에 통합되었어요.'},
{id:'hc8',u:'h2',p:'28쪽',d:2,q:'국민 대표 회의(1923)가 열리게 된 배경으로 옳은 것은?',o:['연통제·교통국이 발각되어 재정난이 심해졌다.','신간회가 해소되었다.','한국광복군이 창설되었다.','카이로 선언이 발표되었다.','윤봉길 의거가 일어났다.'],a:0,e:'연통제·교통국 발각으로 인한 재정난, 외교 성과 미흡, 이승만의 위임 통치 청원에 대한 비판이 겹쳤어요.'},
{id:'hc9',u:'h3',p:'30쪽',d:2,q:'훈춘 사건에 대한 설명으로 옳은 것은?',o:['일제가 마적을 매수해 일본 영사관을 공격하게 하고 만주에 군대를 보낼 구실로 삼았다.','독립군이 일본 영사관을 습격하였다.','3부가 하나로 통합되었다.','러시아 적군이 독립군을 무장 해제하였다.','만주 군벌이 독립운동가를 체포하기로 하였다.'],a:0,e:'훈춘 사건 뒤 일본군이 만주에 대규모로 들어왔고, 청산리 대첩과 간도 참변으로 이어졌어요.'},
{id:'hc10',u:'h3',p:'31쪽',d:2,q:'자유시 참변에 대한 설명으로 옳은 것은?',o:['러시아 자유시에서 지휘권 다툼 끝에 적군이 독립군을 무장 해제하였다.','일본군이 간도의 한인 마을을 학살하였다.','관동 대지진 때 한국인이 학살되었다.','만주 군벌이 독립운동가를 체포하였다.','청산리에서 독립군이 크게 이겼다.'],a:0,e:'독립군은 밀산에 모였다가 러시아 자유시로 옮겨 갔고, 1921년 자유시 참변을 겪었어요.'},
{id:'hc11',u:'h3',p:'32쪽',d:3,q:'3부에 대한 설명으로 옳지 않은 것은?',o:['참의부는 압록강 부근에서 활동하였다.','정의부는 남만주에서 활동하였다.','신민부는 북만주에서 활동하였다.','민정과 군정을 갖춘 자치 정부였다.','3부가 통합되어 의열단이 되었다.'],a:4,e:'3부 통합 운동으로 남만주에는 국민부, 북만주에는 혁신 의회가 만들어졌어요.'},
{id:'hc12',u:'h3',p:'36쪽',d:3,q:'다음 비판을 받은 운동은?',bl:'자료',bx:['“토산품 가격만 올려 자본가 계급의 이익만 도모한다.” — 사회주의자들의 비판'],o:['물산 장려 운동','민립 대학 설립 운동','브나로드 운동','형평 운동','6·10 만세 운동'],a:0,e:'물산 장려 운동은 토산품 애용을 주장했지만, 토산품 가격이 오르면서 이런 비판을 받았어요.'},
{id:'hc13',u:'h3',p:'38쪽',d:2,q:'암태도 소작 쟁의에 대한 설명으로 옳은 것은?',o:['1년여 투쟁 끝에 소작료를 40 %로 낮추는 데 성공하였다.','일제 강점기 최대 규모의 노동 운동이었다.','일본인 감독의 한국인 노동자 구타가 계기였다.','1929년에 일어났다.','순종의 인산일에 일어났다.'],a:0,e:'암태도 소작 쟁의(1923~1924)는 70~80 %의 소작료 인하를 요구했어요. 노동자 구타가 계기인 것은 원산 총파업(1929)이에요.'},
{id:'hc14',u:'h3',p:'39쪽',d:3,q:'원산 총파업에 대한 설명으로 옳은 것은?',o:['일본인 감독의 구타가 계기가 되어 4개월간 이어졌고, 국내외의 지원을 받았다.','소작료 인하를 요구하였다.','순종의 인산일을 계기로 일어났다.','나주역 한일 학생 충돌이 계기였다.','1923년에 일어났다.'],a:0,e:'원산 총파업(1929)에는 일본·프랑스 노동자도 격려문을 보냈어요. 일제 강점기 최대 규모의 노동 운동이에요.'},
{id:'hc15',u:'h3',p:'43쪽',d:3,q:'신간회가 해소(1931)된 배경으로 옳은 것은?',o:['새 집행부의 타협적 태도와 코민테른의 노선 변화','광주 학생 항일 운동의 실패','정우회 선언 발표','미쓰야 협정 체결','국민 대표 회의 결렬'],a:0,e:'새 집행부가 타협적 태도를 보이고 코민테른의 노선이 바뀌자, 사회주의자들이 해소론을 제기했어요.'},
{id:'hc16',u:'h3',p:'37쪽',d:2,q:'1920년대 자치 운동에 대한 설명으로 옳은 것은?',o:['식민 지배를 인정하는 범위 안에서 자치를 주장해 민족 분열에 이용되었다.','비타협적 민족주의 세력이 주도하였다.','신간회가 이끌었다.','무장 투쟁을 주장하였다.','사회주의 세력이 주도하였다.'],a:0,e:'이광수의 「민족적 경륜」(1924), 최린·김성수 등이 자치 운동을 주장했어요. 비타협적 민족주의 세력은 이를 비판했어요.'},
{id:'hc17',u:'h4',p:'47쪽',d:2,q:'1930년대 일제가 추진한 농촌 진흥 운동의 실제 목적은?',o:['농촌 통제 강화','소작료 인하','농민 자치 확대','토지 분배','교육 기회 확대'],a:0,e:'농민 생활 개선을 내세웠지만 실제로는 농촌 통제를 강화하고 빈곤의 책임을 농민에게 돌렸어요.'},
{id:'hc18',u:'h4',p:'49쪽',d:2,q:'연해주 한인 강제 이주(1937)에 대한 설명으로 옳은 것은?',o:['소련이 한인의 일본 협력을 우려한다는 구실로 중앙아시아로 강제 이주시켰다.','일본이 한인을 간도로 강제 이주시켰다.','자경단이 한국인을 학살하였다.','1920년에 일어났다.','미국 정부가 한인 이민을 막았다.'],a:0,e:'관동 대지진 학살(1923)은 일본에서 유언비어로 자경단 등이 한국인을 학살한 사건이에요.'},
{id:'hc19',u:'h4',p:'52쪽',d:2,q:'식민 사관 중 ‘한국사는 스스로 발전하지 못하고 정체되어 있었다’는 주장은?',o:['타율성론','정체성론','당파성론','민족주의 사학','실증 사학'],a:1,e:'타율성론은 한국사가 외세에 의해 움직였다는 주장, 당파성론은 분열성을 강조한 주장이에요. 백남운은 정체성론을 극복하려 했어요.'},
{id:'hc20',u:'h4',p:'54쪽',d:3,q:'종교와 민족 운동의 짝으로 옳지 않은 것은?',o:['대종교 – 중광단','천도교 – 『개벽』','불교 – 한용운','원불교 – 새 생활 운동','개신교 – 의민단'],a:4,e:'의민단은 천주교의 무장 단체예요. 개신교는 신사 참배를 거부했어요(주기철).'},
{id:'hc21',u:'h5',p:'56쪽',d:2,q:'민족 혁명당(1935)에 대한 설명으로 옳은 것은?',o:['중국 관내 최대 규모의 통일 전선 정당이었다.','김구가 주도하였다.','충칭에서 결성되었다.','한국광복군을 창설하였다.','사회주의 계열만 참여하였다.'],a:0,e:'난징에서 민족주의·사회주의 계열이 통합해 만들었어요. 김구 등 임시 정부 옹호 세력은 참여하지 않고 한국 국민당을 만들었어요.'},
{id:'hc22',u:'h5',p:'58, 61쪽',d:3,q:'대한민국 건국 강령(1941)의 내용으로 옳은 것은?',o:['삼균주의를 바탕으로 민주 공화국 건설, 보통 선거, 무상 의무 교육을 내세웠다.','왕조를 되살리자고 하였다.','일본의 지배 아래 자치를 주장하였다.','신분제를 유지하자고 하였다.','모든 토지의 무제한 사유를 보장하였다.'],a:0,e:'건국 강령은 조소앙의 삼균주의(정치·경제·교육의 균등)를 바탕으로 했어요. 독립운동 세력의 공통 목표는 민주 공화국 건설이었어요.'},
{id:'hx1',u:'h4',p:'54쪽',t:'ox',d:1,q:'조선어 학회 사건은 1942년에 일어났다.',a:0,e:'맞아요. 일제는 조선어 학회 회원들을 체포해 『조선말 큰사전』 편찬을 막았어요.'},
{id:'hx2',u:'h3',p:'31쪽',t:'ox',d:1,q:'청산리 대첩은 홍범도 부대만 단독으로 거둔 승리이다.',a:1,e:'청산리 대첩은 김좌진의 북로 군정서와 홍범도 부대가 함께 거둔 승리예요. 봉오동 전투는 홍범도의 대한 독립군 중심이에요.'},
/* 서술형 */
{id:'hw5',u:'h3',p:'36쪽',t:'essay',d:3,q:'물산 장려 운동의 배경, 주장, 한계를 서술하시오.',m:'회사령과 일본 상품 관세가 폐지되어 일본 자본과 상품이 밀려들자 위기감을 느낀 조만식 등이 평양에서 시작하였다. ‘내 살림 내 것으로’, ‘조선 사람 조선 것’을 내걸고 토산품 애용, 근검저축, 금주·단연을 주장하였다. 그러나 토산품 가격이 오르고, 사회주의자들에게 자본가 계급의 이익만 도모한다는 비판을 받았다.',k:['회사령·관세 폐지로 위기감','조만식, 평양에서 시작','토산품 애용','토산품 가격 상승','자본가 이익만 도모한다는 비판']},
{id:'hw6',u:'h3',p:'35쪽',t:'essay',d:3,q:'윤봉길 의거의 내용과 의의를 서술하시오.',m:'1932년 4월 김구가 조직한 한인 애국단의 윤봉길이 상하이 훙커우 공원에서 폭탄 의거를 일으켰다. 이를 계기로 중국 국민당 정부가 대한민국 임시 정부를 적극 지원하게 되었고, 한중 공동 항일 전선이 형성되는 계기가 되었다.',k:['한인 애국단(김구)','1932년 상하이 훙커우 공원','중국 국민당 정부의 임시 정부 지원','한중 공동 항일 전선의 계기']},
{id:'hw7',u:'h4',p:'52–53쪽',t:'essay',d:3,q:'식민 사관의 정체성론이 무엇인지 쓰고, 이를 극복하려 한 사회 경제 사학의 주장을 서술하시오.',m:'정체성론은 한국사가 스스로 발전하지 못하고 정체되어 있었다는 식민 사관의 주장이다. 백남운은 『조선사회경제사』에서 세계사의 보편 법칙을 우리 역사에 적용하여, 한국사도 세계사와 같은 발전 과정을 거쳤음을 밝혀 정체성론을 극복하려 하였다.',k:['정체성론 = 발전하지 못하고 정체','백남운, 『조선사회경제사』','세계사의 보편 법칙 적용','정체성론 극복']},
{id:'hw8',u:'h5',p:'57–59쪽',t:'essay',d:3,q:'조선 의용대와 한국광복군을 창설 시기·장소·지휘자·활동을 중심으로 비교하여 서술하시오.',m:'조선 의용대는 1938년 한커우에서 김원봉 중심의 조선 민족 전선 연맹이 중국 국민당의 지원을 받아 창설한 중국 관내 최초의 한인 부대로, 심리전·포로 심문 등을 하였다. 한국광복군은 1940년 충칭에서 대한민국 임시 정부가 창설하였고(총사령관 지청천), 대일 선전 포고 후 인도·미얀마 전선에 파견되었으며 OSS와 국내 진공 작전을 준비하였다.',k:['조선 의용대: 1938, 한커우, 김원봉','중국 관내 최초 한인 부대','한국광복군: 1940, 충칭, 지청천','인도·미얀마 전선, OSS 국내 진공 작전']}
);

/* ===== 2차: 통합과학 쉬운 설명 ===== */
Object.assign(EASY, {
s1:{sum:'지구의 역사 약 46억 년은 생물계의 큰 변화(대멸종)를 기준으로 네 시대로 나뉘어요.',
 body:['<b>지질 시대</b>는 지구가 생긴 약 46억 년 전부터 지금까지예요. 그때 살았던 생물의 흔적이 <b>화석</b>으로 남아서, 화석을 보면 그 시대의 환경을 알 수 있어요. 고사리 화석이 나오면 육지, 조개 화석이 나오면 바다였던 거예요.',
  '시대를 나누는 기준은 생물계의 큰 변화예요. 환경이 갑자기 바뀌면 많은 생물이 한꺼번에 사라지는 <b>생물 대멸종</b>이 일어나고, 살아남은 생물이 새로운 종으로 퍼져요.',
  '선캄브리아 시대에는 남세균이 산소를 만들었고, 고생대에는 오존층이 생겨 생물이 육지로 올라왔어요. 중생대는 따뜻해서 공룡이 번성했고, 신생대에는 포유류가 번성하고 인류의 조상이 나타났어요.'],

s2:{sum:'생물은 개체마다 조금씩 다르고(변이), 환경에 맞는 개체가 살아남으면서(자연선택) 새로운 종이 생겨 다양해졌어요.',
 body:['같은 종이라도 털색이나 크기가 조금씩 달라요. 이것이 <b>변이</b>예요. 유성생식으로 유전자 조합이 달라지고, 돌연변이가 생기기 때문이에요.',
  '환경에 유리한 변이를 가진 개체가 더 많이 살아남아 자손을 남기는 것이 <b>자연선택</b>이에요. 이것이 오랜 세월 반복되면 원래와 다른 새로운 종이 생기는데, 이것이 <b>진화</b>예요. 갈라파고스 핀치의 부리가 먹이에 따라 달라진 것이 대표 예예요.',

 ana:'변이는 ‘서로 다른 선수들’, 자연선택은 ‘경기 규칙(환경)에 맞는 선수가 살아남기’, 진화는 ‘그렇게 팀 구성이 완전히 바뀌는 것’이라고 생각하면 돼요.',
 flow:[{h:'변이',i:'같은 종 안에서 형질이 조금씩 다름'},{h:'자연선택',i:'환경에 유리한 개체가 살아남아 자손을 더 많이 남김'},{h:'진화',i:'여러 세대에 걸쳐 새로운 종이 생김'},{h:'생물다양성',i:'유전적 다양성 · 종다양성 · 생태계다양성'}],

s3:{sum:'산화는 산소를 얻거나 전자를 잃는 것, 환원은 그 반대예요. 둘은 항상 짝으로 함께 일어나요.',
 body:['광합성, 연소, 철의 제련처럼 우리 주변의 많은 변화에는 산소가 관여해요. 산소를 얻으면 <b>산화</b>, 산소를 잃으면 <b>환원</b>이에요.',
  '산소가 없어도 산화·환원이 일어나요. 이때는 <b>전자</b>로 봐요. 전자를 잃으면 산화, 전자를 얻으면 환원이에요. 아연판을 황산 구리(Ⅱ) 수용액에 넣으면 아연은 전자를 잃고(산화), 구리 이온은 전자를 얻어 구리가 돼요(환원).',
  '한 물질이 산소나 전자를 내주면 다른 물질이 받아야 하니까, 산화와 환원은 <b>항상 동시에</b> 일어나요.'],
 ana:'산소 기준은 이름 그대로 “산화 = 산소 얻기”, 전자 기준은 거꾸로 “산화 = 전자 잃기”예요. 이 한 줄만 기억하면 나머지는 반대예요.',

s4:{sum:'생태계는 생물(생물요소)과 환경(비생물요소)이 서로 영향을 주고받는 하나의 체계예요.',
 body:['같은 종의 무리가 <b>개체군</b>, 여러 개체군이 모이면 <b>군집</b>, 군집이 환경과 영향을 주고받으면 <b>생태계</b>예요.',
  '생물요소는 하는 일에 따라 나뉘어요. 빛으로 양분을 만드는 <b>생산자</b>, 다른 생물을 먹는 <b>소비자</b>, 사체와 배설물을 분해하는 <b>분해자</b>예요. 비생물요소는 빛, 공기, 온도, 물, 토양이에요.',
  '영향은 양방향이에요. 환경이 생물을 바꾸기도 하고(사막여우의 큰 귀), 생물이 환경을 바꾸기도 해요(비버의 댐).'],
 ana:'동네로 생각해 보세요. 참새 무리 = 개체군, 동네의 모든 생물 무리 = 군집, 여기에 햇빛·물·흙까지 합친 것 = 생태계예요.',
 grid:[{h:'생산자',i:'식물처럼 빛에너지로 양분을 만듦'},{h:'소비자',i:'다른 생물을 먹음 (1차·2차·3차)'},{h:'분해자',i:'버섯·곰팡이처럼 사체·배설물 분해'},{h:'비생물요소',i:'빛 · 공기 · 온도 · 물 · 토양'}]},
s5:{sum:'태양은 중심부의 수소 핵융합으로 에너지를 만들고, 이 에너지가 지구에서 여러 형태로 바뀌며 생명과 자연 현상을 움직여요.',
 body:['태양 중심부에서는 수소 원자핵 4개가 합쳐져 헬륨 원자핵 1개가 돼요. 이때 줄어든 질량만큼 엄청난 에너지가 나와요. 이것이 <b>수소 핵융합 반응</b>이에요.',
  '지구에 온 태양 에너지는 여러 형태로 바뀌어요(<b>에너지 전환</b>). 빛에너지는 광합성으로 식물의 화학 에너지가 되고, 오랜 세월이 지나 석탄·석유 같은 화석 연료가 돼요.',

 ana:'태양은 지구의 ‘충전기’예요. 우리가 쓰는 석유도, 부는 바람도 거슬러 올라가면 모두 태양 에너지예요.',

s6:{sum:'에너지는 형태가 바뀌어도 총량은 그대로지만, 일부가 쓸모없는 열로 새어 나가요. 그래서 효율을 높이고 신재생 에너지를 써야 해요.',
 body:['휴대 전화에 넣은 전기 에너지는 빛, 소리, 진동(운동), 열로 바뀌어요. 바뀐 에너지를 모두 더하면 처음 넣은 양과 같아요. 이것이 <b>에너지 보존 법칙</b>이에요.',
  '하지만 열처럼 쓸모없이 버려지는 에너지가 있어요. 그래서 공급한 에너지 중 실제로 유용하게 쓴 비율인 <b>에너지 효율</b>이 중요해요. 조명 기구라면 빛에너지가 유용한 에너지예요.',

 ana:'에너지 효율은 시험 점수처럼 생각하면 쉬워요. 공급한 에너지가 100점이라면, 실제로 쓸모 있게 쓴 에너지가 내 점수예요.',

s7:{sum:'과학기술은 생활을 바꾸지만 논쟁도 낳아요. 그래서 과학적으로 이해하고, 윤리를 지키며 판단해야 해요.',
 body:['생성형 인공지능 작품의 저작권처럼, 과학기술이 발전하면 사회·윤리·문화적으로 의견이 갈리는 문제가 생겨요. 이것이 <b>과학 관련 사회적 쟁점</b>이에요. 과학적으로 이해한 뒤 여러 의견을 고려해 합리적으로 결정해야 해요.',

{id:'sc1',u:'s1',p:'16쪽',d:2,q:'스트로마톨라이트에 대한 설명으로 옳은 것은?',o:['남세균의 활동으로 퇴적물이 층을 이룬 구조이다.','단단한 껍데기를 가진 고생대 해양 무척추동물이다.','중생대 바다에서 번성한 생물이다.','신생대 바다에서 번성한 생물이다.','육상 식물의 화석이다.'],a:0,e:'스트로마톨라이트는 선캄브리아 시대의 대표 화석이에요. 고생대 해양 무척추동물은 삼엽충, 중생대는 암모나이트, 신생대는 화폐석이에요.'},
{id:'sc2',u:'s1',p:'18쪽',d:1,q:'생물 대멸종의 원인을 설명하는 가설로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 운석(소행성) 충돌설','ㄴ. 화산 폭발설','ㄷ. 수륙 분포 변화설'],o:['ㄱ','ㄴ','ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'],a:4,e:'세 가지 모두 교과서에 나온 대멸종 가설이에요. 수륙 분포 변화설은 여러 대륙이 합쳐져 초대륙이 된 것을 원인으로 봐요.'},
{id:'sc3',u:'s1',p:'16–17쪽',d:3,q:'지질 시대의 환경과 생물에 대한 설명으로 옳지 않은 것은?',o:['고생대에는 양서류와 거대 곤충이 번성하였다.','중생대에는 은행나무 같은 겉씨식물이 번성하였다.','신생대에는 대서양이 넓어지고 히말라야산맥이 형성되었다.','선캄브리아 시대 후기에 다세포 생물이 등장하였다.','중생대 말에 삼엽충이 멸종하였다.'],a:4,e:'삼엽충은 고생대 말에 멸종했어요. 중생대 말에는 공룡과 암모나이트가 멸종했어요.'},
{id:'sc4',u:'s2',p:'20쪽',d:2,q:'다음 중 변이에 해당하는 것은?',o:['같은 종인 강아지들의 털색이 조금씩 다르다.','고양이와 개의 몸집이 다르다.','운동을 해서 근육이 커졌다.','핀치와 펭귄의 부리 모양이 다르다.','계절에 따라 기온이 달라진다.'],a:0,e:'변이는 같은 종의 개체 사이에서 유전정보 차이로 나타나는 형질 차이예요. 다른 종 사이의 차이나 살면서 생긴 변화는 변이가 아니에요.'},
{id:'sc5',u:'s2',p:'24쪽',d:3,q:'다윈의 자연선택설에 대한 설명으로 옳은 것은?',o:['주어진 환경에 가장 잘 적응한 개체가 살아남아 더 많은 자손을 남기고, 이것이 오래 반복되면 새로운 종으로 분화할 수 있다.','모든 개체는 같은 수의 자손을 남긴다.','변이는 진화와 관계가 없다.','환경은 생물의 형질에 영향을 주지 않는다.','진화는 한 세대 만에 일어난다.'],a:0,e:'다윈은 1859년에 생물종이 여러 세대 동안 자연선택을 거치며 진화한다는 자연선택설을 주장했어요.'},
{id:'sc6',u:'s2',p:'28쪽',d:2,q:'생물다양성이 높을 때에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 인간이 이용할 수 있는 생물자원의 종류가 많아진다.','ㄴ. 한 종이 사라지면 생태계가 쉽게 무너진다.','ㄷ. 생태계가 안정적으로 유지된다.'],o:['ㄱ','ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'],a:2,e:'생물다양성이 높으면 한 종이 사라져도 다른 종이 그 역할을 대신할 수 있어서 생태계가 안정적이에요.'},

s5a:{e:'태양 중심부(약 1500만 K)에서 수소 원자핵 4개가 헬륨 원자핵 1개로 핵융합하고, 줄어든 질량이 에너지로 바뀌어요. 표면(약 6000 K)에서는 핵융합이 일어나지 않아요.',

sc6:{e:'생물다양성이 높으면 먹이그물이 복잡해져 한 종이 사라져도 다른 종이 역할을 대신하므로 생태계가 안정적이고, 이용할 수 있는 생물자원도 많아요.',
 t:['인간이 이용할 수 있는 생물자원의 종류가 많아진다.','생태계가 안정적으로 유지된다.','한 종이 사라져도 다른 종이 그 역할을 대신할 수 있다.','먹이그물이 복잡하게 형성된다.'],

sc19:{e:'표준 화석은 생존 기간이 짧고, 분포 지역이 넓고, 개체 수가 많았던 생물이에요. 특정 환경·긴 생존 기간·좁은 분포는 시상 화석의 조건이에요.',
 t:['생존 기간이 짧아야 한다.','분포 지역이 넓어야 한다.','개체 수가 많았어야 한다.'],

};

{id:'sq13',u:'s3',p:'40쪽',lab:true,d:2,q:'구리판 실험에서 알코올램프 불꽃의 특징을 바르게 짝지은 것은?',o:['겉불꽃 – 산소가 잘 공급됨 / 속불꽃 – 일산화 탄소가 많고 산소가 부족함','겉불꽃 – 일산화 탄소가 많음 / 속불꽃 – 산소가 잘 공급됨','겉불꽃과 속불꽃 모두 산소가 부족함','겉불꽃과 속불꽃 모두 일산화 탄소가 없음','겉불꽃 – 산소가 부족함 / 속불꽃 – 산소가 부족함'],a:0,e:'겉불꽃은 공기와 맞닿아 산소가 잘 공급되어 구리가 산화되고, 속불꽃은 일산화 탄소가 많아 산화 구리(Ⅱ)가 환원돼요.'},
{id:'sq14',u:'s3',p:'40–41쪽',lab:true,t:'order',d:2,q:'구리판의 변화를 순서대로 눌러 보세요.',items:['붉은색 구리판을 겉불꽃에 넣어 가열한다','구리판이 검은색 산화 구리(Ⅱ)로 변한다','검게 변한 구리판을 속불꽃에 넣어 가열한다','다시 붉은색 구리로 변한다'],e:'겉불꽃: 2Cu + O₂ → 2CuO (산화) / 속불꽃: CuO + CO → Cu + CO₂ (환원)'},
{id:'sq15',u:'s3',p:'43쪽',lab:true,d:2,q:'구리 테이프를 붙인 페트리 접시에 질산 은 수용액을 떨어뜨렸을 때에 대한 설명으로 옳은 것은?',o:['구리 테이프 표면에 은이 생긴다.','구리가 전자를 얻는다.','은이 은 이온으로 변한다.','공기 중의 산소가 반드시 필요하다.','아무 변화도 일어나지 않는다.'],x:['구리 이온이 구리로 석출된다.','은 이온이 전자를 잃는다.'],a:0,e:'구리는 전자를 잃어 구리 이온이 되고(산화), 은 이온은 전자를 얻어 은이 되어 구리 표면에 생겨요(환원).'},

{id:'s3i9',u:'s3',p:'42–43쪽 보충',t:'match',d:1,q:'금속과 수용액의 조합을 결과와 짝지어 보세요.',pairs:[['아연판 + 황산 구리(Ⅱ) 수용액','구리 석출, 푸른색 옅어짐'],['구리판 + 질산 은 수용액','은 석출'],['마그네슘 + 묽은 염산','수소 기체 발생'],['구리판 + 황산 아연 수용액','변화 없음']],e:'이온화 경향이 큰 금속이 작은 금속의 이온을 금속으로 석출시켜요. 수소보다 이온화 경향이 큰 금속은 묽은 염산에서 수소를 발생시켜요.'},
{id:'s3i10',u:'s3',p:'42–43쪽 보충',d:2,q:'금속판을 수용액에 넣었을 때 반응이 일어나는 것만을 〈보기〉에서 있는 대로 고른 것은?',bx:['ㄱ. 아연판 + 황산 구리(Ⅱ) 수용액','ㄴ. 구리판 + 황산 아연 수용액','ㄷ. 구리판 + 질산 은 수용액'],o:['ㄱ','ㄴ','ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ'],a:3,e:'금속판의 이온화 경향이 수용액 속 금속 이온보다 커야 반응해요.\nㄱ Zn > Cu 반응 · ㄴ Cu < Zn 반응 없음 · ㄷ Cu > Ag 반응'},
{id:'s3i11',u:'s3',p:'42–43쪽 보충',d:2,q:'다음 금속을 각각 묽은 염산에 넣었을 때 기체가 발생하지 않는 것은?',o:['마그네슘','아연','철','알루미늄','구리'],a:4,e:'수소보다 이온화 경향이 큰 금속만 묽은 염산과 반응해 수소 기체를 발생시켜요. 구리는 수소보다 이온화 경향이 작아요.'},
{id:'s3i12',u:'s3',p:'43쪽 보충',d:2,q:'다음은 구리판을 질산 은 수용액에 넣었을 때의 반응식이다. 이에 대한 설명으로 옳은 것은?',bl:'반응식',bx:['Cu + 2Ag⁺ → Cu²⁺ + 2Ag'],o:['은 이온은 산화된다.','구리 원자 1개는 전자 2개를 잃는다.','수용액 속 양이온의 수는 증가한다.','은은 구리보다 이온화 경향이 크다.','반응 후 구리판의 질량은 감소한다.'],a:1,e:'Cu → Cu²⁺ 로 전자 2개를 잃고 산화돼요. 은 이온 2개가 전자를 1개씩 얻어 은으로 환원돼요.\n양이온은 Ag⁺ 2개 → Cu²⁺ 1개로 줄어들고, 구리 1개(약 64)가 녹는 동안 은 2개(약 216)가 붙어 금속판 질량은 늘어나요.'},
{id:'s3i13',u:'s3',p:'43쪽 보충',t:'num',d:3,unit:'개',q:'구리판을 질산 은 수용액에 넣었더니 구리 원자 5개가 구리 이온(Cu²⁺)으로 변하였다. 이때 석출된 은 원자는 몇 개인가?',a:10,e:'Cu + 2Ag⁺ → Cu²⁺ + 2Ag\n구리 1개가 전자 2개를 내놓고, 은 이온 1개는 전자 1개를 받아요. 5 × 2 = 10개'},
{id:'s3i14',u:'s3',p:'42–43쪽 보충',d:3,q:'금속 A~C에 대한 실험 결과이다. A~C의 이온화 경향을 옳게 비교한 것은?',bl:'실험 결과',bx:['• A판을 B 이온 수용액에 넣었더니 B가 석출되었다.','• C판을 A 이온 수용액에 넣었더니 아무 변화가 없었다.','• C판을 B 이온 수용액에 넣었더니 B가 석출되었다.'],o:['A > B > C','A > C > B','B > A > C','C > A > B','C > B > A'],a:1,e:'B를 석출시킨 A와 C는 B보다 이온화 경향이 커요(A > B, C > B). C는 A 이온과 반응하지 않았으므로 A > C예요. 따라서 A > C > B.'},
{id:'s3i15',u:'s3',p:'42–43쪽 보충',d:3,q:'금속 X판으로 실험한 결과이다. X로 가장 적절한 것은?',bl:'실험 결과',bx:['• 황산 구리(Ⅱ) 수용액에 넣으면 붉은색 구리가 석출된다.','• 황산 아연 수용액에 넣으면 아무 변화가 없다.','• 묽은 염산에 넣으면 기체가 발생한다.'],o:['마그네슘(Mg)','철(Fe)','구리(Cu)','은(Ag)','알루미늄(Al)'],a:1,e:'X는 구리보다 크고(Cu 석출), 아연보다 작으며(Zn과 반응 안 함), 수소보다 커요(기체 발생). Zn > X > H > Cu 이므로 철이에요. Mg·Al은 아연보다 커서 황산 아연과도 반응해요.'},
{id:'s3iw1',u:'s3',p:'43쪽 보충',t:'essay',d:2,q:'구리판을 질산 은 수용액에 넣으면 반응이 일어나지만, 은판을 황산 구리(Ⅱ) 수용액에 넣으면 반응이 일어나지 않는다. 그 까닭을 이온화 경향과 전자의 이동으로 서술하시오.',m:'구리는 은보다 이온화 경향이 크다. 따라서 구리판을 질산 은 수용액에 넣으면 구리는 전자를 잃고 구리 이온으로 산화되고, 은 이온은 전자를 얻어 은으로 환원되어 석출된다. 반대로 은은 구리보다 이온화 경향이 작아 전자를 잃기 어려우므로 구리 이온에게 전자를 줄 수 없어 반응이 일어나지 않는다.',k:['구리 > 은 (이온화 경향)','구리는 전자를 잃고 산화','은 이온은 전자를 얻어 은으로 석출','은은 전자를 잃기 어려워 반응 없음']},
{id:'s3iw2',u:'s3',p:'보충 · 심화',t:'essay',d:3,q:'철판에 아연을 도금한 함석은 표면이 긁혀 철이 드러나도 철이 잘 녹슬지 않는다. 그 까닭을 이온화 경향을 이용하여 서술하시오.',m:'아연은 철보다 이온화 경향이 커서 전자를 잃고 산화되기 쉽다. 따라서 철이 드러나도 철 대신 아연이 먼저 전자를 잃고 산화되므로 철의 산화(부식)가 방지된다.',k:['아연 > 철 (이온화 경향)','아연이 먼저 전자를 잃고 산화됨','철의 산화(녹스는 것) 방지']}
);

const FINAL_CONTENT = {
  subjects: [], questions: [], notes: {}, easy: {}, memo: {}, cards: {}, timeline: []
};
const FINAL_RANGES = {
  hist: '68–143쪽',
  sci: '46–65 · 76–94 · 102–109 · 130–133쪽',
  math: '46–81 · 104–128쪽',
  zh: '34–41 · 64–71쪽'
};
function addExamSubject(id, content){
  const subject = SUBJ.find(item => item.id === id);
  FINAL_CONTENT.subjects.push({...subject, range: FINAL_RANGES[id], units: content.units});
  FINAL_CONTENT.questions.push(...content.questions);
  Object.assign(FINAL_CONTENT.notes, content.notes);
  Object.assign(FINAL_CONTENT.easy, content.easy);
  Object.assign(FINAL_CONTENT.memo, content.memo);
  FINAL_CONTENT.cards[id] = content.cards;
  if (content.timeline) FINAL_CONTENT.timeline.push(...content.timeline);
}

      {k:'list', h:'혼합 용액의 액성과 중화열', i:['반응 후 <b>H⁺가 남으면 산성</b>, <b>OH⁻가 남으면 염기성</b>이에요. 두 이온이 남지 않으면 교과서의 염산·수산화 나트륨 사례에서는 중성이에요. Na⁺와 Cl⁻는 물을 만드는 반응에 직접 참여하지 않아요.','교과서 탐구에서는 농도와 처음 온도가 같은 염산과 수산화 나트륨 수용액을 총 12 mL씩 섞었어요. <b>6 mL + 6 mL</b>일 때 반응한 이온이 가장 많아 최고 온도가 가장 높아요.','제산제는 위산을, 식초·레몬즙은 생선의 염기성 비린내 성분을 중화하는 데 쓰여요.']},

      {k:'list', h:'탐구와 자료 해석', i:['열화상 자료에서 처음이 둘 다 20 ℃일 때 <b>20 → 16 ℃는 흡열, 20 → 25 ℃는 발열</b>로 해석해요.','냉찜질 팩은 내부 물질이 물에 녹는 과정에서 열을 흡수하고, 철 가루 손난로는 철이 산소와 반응할 때 열을 방출해요.','교과서 탐구의 가열 장치는 산화 칼슘과 물의 발열 반응을 이용해요. 주머니 수에 따른 온도 변화를 비교할 때는 물의 양과 시작 온도 같은 조건을 맞춰요.','수증기 흡착형 발열 섬유는 섬유에 수증기가 흡착될 때 나오는 열을 이용해요. 작은 물방울을 분사하는 쿨링 포그는 물이 증발하며 주변 열을 흡수하는 성질을 이용해요.']},

    ],
    s23: [
      {k:'kv', h:'먹이 관계와 에너지', r:[['먹이 사슬','한 갈래의 먹고 먹히는 연결이에요. 화살표는 보통 먹이가 되는 생물에서 그 생물을 먹는 생물 쪽으로 그려요.'],['먹이 그물','먹이 사슬 여러 개가 서로 얽힌 관계예요.'],['생태 피라미드','영양 단계별 에너지양이나 개체수 등을 나타내요. 에너지 일부가 생명 활동과 열 방출 등에 쓰이므로 상위 영양 단계로 전달되는 양은 줄어요.']]},
      {k:'list', h:'생태계평형과 변화', i:['복잡한 <b>먹이 관계</b>는 개체수와 에너지 흐름이 비교적 안정적으로 유지되는 데 도움이 돼요.','카이바브 고원 사례는 <b>포식자 감소 → 사슴 증가 → 먹이 식물 감소 → 사슴 급감</b>으로 연결해 봐요.','개체군 변동 모의실험에서 메뚜기와 참새를 나타낸 모형의 수를 세대마다 기록하고, 먹이와 포식자의 변화가 서로 어떤 영향을 미치는지 살펴봐요.','서식지 파괴, 환경 오염, 남획, 외래 생물 유입이 평형을 깨뜨릴 수 있어요. 생태 통로 조성, 옥상 정원, 하천 복원 등은 보전에 도움이 돼요.']},
      {k:'trap', h:'개체수가 잠깐 바뀔 수 있어요', t:'평형은 모든 종의 개체수가 항상 똑같다는 뜻이 아니에요. 충격이 생태계의 회복 능력을 넘으면 원래 평형으로 돌아오기 어려워요.'}
    ],
    s24: [
      {k:'list', h:'온실 효과와 지구 열수지', i:['태양 복사 에너지 일부는 반사되고 나머지는 지표와 대기에 흡수돼요. 지표는 적외선 형태의 <b>지구 복사 에너지</b>를 방출해요.','온실 기체는 지구가 방출한 적외선의 일부를 흡수하고 지표 쪽과 우주 쪽으로 다시 방출해요. 지표로 돌아오는 에너지가 커지면 지구의 평균 기온이 높아질 수 있어요.','교과서 84쪽 평형 모형: 입사한 100 중 <b>30은 반사</b>, <b>70은 흡수</b>예요. 장기 평형에서는 우주로 나가는 지구 복사도 70이에요. 지표 유입은 50 + 94 = 144, 지표 방출은 132 + 12 = 144예요.']},
      {k:'kv', h:'적도 태평양의 평상시와 엘니뇨', r:[['평상시','무역풍이 동쪽에서 서쪽으로 불어 따뜻한 표층 해수가 서쪽에 모여요. 동쪽에서는 차가운 물이 올라오는 용승이 활발해요.'],['엘니뇨','무역풍이 약해지면 따뜻한 물이 서쪽에 덜 쌓이고 동쪽의 용승이 약해져 동태평양 적도 해역의 수온이 평상시보다 높아져요. 강수 구역도 이동해요.']]},
      {k:'list', h:'사막화와 기후 변화 대응', i:['사막화는 건조한 지역의 토지가 악화되는 현상으로, 가뭄과 함께 과도한 방목·경작·벌채 같은 활동도 원인이 돼요.','온실 기체 배출 감축과 흡수원 확대는 <b>완화</b>, 홍수·폭염에 대비한 방재 시설과 생활 방식의 변화는 <b>적응</b>에 해당해요.','교과서 시나리오 그래프는 배출이 지속되는 경우와 감축하는 경우의 온도 전망을 비교해요. 해조류 양식은 탄소 흡수에 활용하는 연구 사례예요.']},
      {k:'trap', h:'온실 효과와 온난화 구별', t:'자연적인 온실 효과는 지구의 온도 유지에 기여해요. 온실 기체 증가로 효과가 더 강해지는 것이 최근 지구 온난화의 주요 원인이에요.'}
    ],
    s25: [
      {k:'kv', h:'전자기 유도 실험', r:[['검류계','회로에 흐르는 작은 전류의 유무, 방향, 세기를 바늘의 움직임으로 살펴봐요.'],['자석과 코일','자석이 가까워도 코일을 통과하는 자기장이 일정하면 유도 전류가 흐르지 않아요. 자석 또는 코일을 움직여 자기장이 변하고 회로가 닫혀 있으면 유도 전류가 흘러요.'],['수업 PDF 23–31','자기장의 변화가 유도 기전력을 만들어요. 나머지 조건과 회로 저항을 같게 두고 자석을 더 빠르게 움직이면 유도 전류가 더 커져요. 같은 배치에서 이동 방향이나 자석의 극 중 하나를 바꾸면 유도 전류 방향이 반대가 돼요.']]},
      {k:'f', h:'발전기의 에너지 전환', t:'자석과 코일의 상대 운동 → 코일을 통과하는 자기장 변화 → 전자기 유도\n운동 에너지 → 전기 에너지'},
      {k:'kv', h:'발전 방식', r:[['화력 발전','화석 연료의 화학 에너지 → 열에너지 → 터빈의 운동 에너지 → 전기 에너지. 온실 기체와 대기 오염 물질이 발생할 수 있어요.'],['핵발전','핵에너지 → 열에너지 → 터빈의 운동 에너지 → 전기 에너지. 방사성 폐기물과 사고 위험을 관리해야 해요.'],['풍력·수력','바람이나 물의 운동으로 터빈을 돌려요. 태양 전지와 연료 전지는 이와 같은 전자기 유도 발전기를 쓰는 방식과 달라요.']]},
      {k:'tip', h:'수업 PDF에서 함께 본 사례', t:'렌츠 법칙은 유도 전류의 자기장이 처음 자기장 자체가 아니라 그 변화를 방해하는 방향이라는 뜻이에요. 양수 저장은 전기로 물을 높은 곳에 올려 위치 에너지로 저장했다가 필요할 때 내려보내 발전해요. 체르노빌·후쿠시마 사례는 발전 설비의 안전과 대응의 중요성을 보여줘요.'}
    ],
    s26: [
      {k:'kv', h:'과학의 유용성과 사회적 필요', r:[['감염병 진단','감염 여부를 판단하는 정보를 얻어 치료와 예방 조치를 돕는 과학 활용 사례예요.'],['감염병 추적','검사 결과와 조사 자료를 해석해 감염이 퍼진 경로를 파악하고 대응에 활용해요.'],['사회 문제 해결','관찰과 자료에서 문제의 원인을 찾고, 해결 방법의 효과와 한계를 근거로 판단해요.']]},
      {k:'list', h:'교과서의 두 진단 원리', i:['<b>단백질을 이용한 진단</b>은 항원과 항체의 특이적 결합에 따른 결과 신호를 통해 표적을 찾아요.','<b>핵산을 이용한 진단</b>은 표적 유전 물질의 존재 여부를 확인해요. 교과서 133쪽의 PCR은 표적 핵산 신호를 확인하는 진단 사례예요.','결과를 읽을 때는 어떤 표적을 확인하는 검사인지와 제시된 자료의 기준을 먼저 봐요.']},
      {k:'trap', h:'진단 결과와 해석', t:'검사 결과가 의미하는 바는 검사 종류와 관찰 자료에 따라 판단해요. 단백질을 찾는 검사와 핵산을 찾는 검사의 표적을 바꾸어 쓰지 않아요.'}
    ],
    s27: [
      {k:'list', h:'과학기술이 바꾼 생활', i:['수업 PDF의 증기 기관 사례: 목재 부족과 석탄 사용 증가 → 광산의 물을 퍼내야 할 필요 → 증기 기관 활용 → 생산과 교통 등으로 확산.','하버·보슈 질소 고정 사례는 암모니아를 대량으로 생산할 수 있게 해 비료와 식량 생산에 기여했어요. 기술의 영향은 활용 방식에 따라 달라져요.']},
      {k:'kv', h:'인공지능 로봇과 사물 인터넷', r:[['인공지능 로봇','센서 등으로 얻은 정보를 바탕으로 환경을 파악하고 판단하여 작업해요. 생산을 돕거나 재난 현장에서 위험한 작업을 대신할 수 있어요.'],['사물 인터넷(IoT)','센서·통신 기능을 갖춘 사물이 네트워크를 통해 정보를 주고받는 기술이에요. 스마트 농장에서 온도·습도 정보를 받아 환경 관리에 활용하는 것이 예예요.']]},
      {k:'list', h:'유용성, 한계, 책임', i:['정보 통신은 정보 접근과 소통을 넓히지만, 접근 여건의 차이로 <b>정보 격차</b>가 커지거나 <b>허위 정보·사이버 언어폭력</b>이 확산될 수 있어요.','자동화는 일의 효율을 높이는 동시에 직업에 요구되는 역량과 사회 구조를 바꾸어요. 자율주행 판단과 개인정보 수집 등에는 안전 기준과 책임이 필요해요.','기술 사용 전 목적과 영향을 살피고, 동의와 개인정보 보호, 안전, 환경의 <b>지속가능성</b>을 고려해요.']},
      {k:'tip', h:'자료형 문제에 대비하기', t:'같은 기술의 장점과 문제점을 한 쌍으로 쓰고, 문제를 줄이기 위한 책임 있는 사용 방법 한 가지를 붙여 답해 봐요.'}
    ]
  },
  easy: {
    s21: {
      sum:'산은 H⁺, 염기는 OH⁻를 내놓고, 서로 만나면 물을 만들어요.',
      body:['지시약은 색으로 용액의 액성을 알려줘요. BTB라면 산성 노랑·중성 초록·염기성 파랑이에요.', '중화는 H⁺와 OH⁻를 한 개씩 짝지어 물로 바꾸는 반응이에요. 짝을 다 만들고도 어느 쪽이 남는지만 보면 혼합 용액의 액성을 알 수 있어요.'],
      steps:[{q:'농도·처음 온도가 같은 염산 8 mL와 NaOH 수용액 4 mL를 섞었어요. BTB 색은?',s:['두 용액은 같은 부피만큼 섞일 때 H⁺와 OH⁻가 같은 수예요.','염산 4 mL 몫의 H⁺가 OH⁻와 반응하고 H⁺가 남아요.','혼합 용액은 산성이므로 BTB는 노란색이에요.']}]

    s22: {
      sum:'반응이나 변화가 주변에서 열을 받으면 흡열, 주변에 열을 주면 발열이에요.',
      body:['냉찜질 팩이 차가워지는 까닭은 안의 물질이 물에 녹으면서 열을 흡수하기 때문이에요. 손난로는 철이 산소와 반응하면서 주변에 열을 내놓아요.', '상태 변화도 에너지를 주고받아요. 물이 증발할 때 흡수한 열은 땀이나 분무한 물이 주변을 식히는 이유가 돼요. 반대로 수증기가 물로 응결할 때는 열을 내놓아요.'],
      grid:[{h:'흡열',i:'증발·융해·승화·냉찜질'}, {h:'발열',i:'응결·연소·철 가루 손난로'}]
    },
    s23: {
      sum:'생물은 먹이 관계로 연결되어 있어 한 종류가 변하면 다른 종류도 영향을 받아요.',
      body:['풀을 메뚜기가 먹고, 메뚜기를 참새가 먹는다면 에너지는 풀 → 메뚜기 → 참새 방향으로 이동해요.', '참새가 줄면 메뚜기가 일시적으로 늘 수 있어요. 풀을 먹는 메뚜기가 지나치게 늘면 풀도 줄고, 먹이가 부족해지면 다시 메뚜기가 줄 수 있어요. 실제 생태계는 이런 관계가 여러 갈래로 연결된 먹이 그물이에요.'],
      flow:[{h:'생산자',i:'빛에너지로 유기물을 만들어요.'},{h:'1차 소비자',i:'생산자를 먹어요.'},{h:'상위 소비자',i:'다른 소비자를 먹어요.'}]
    },
    s24: {
      sum:'온실 기체는 지구가 내보내는 적외선의 일부를 흡수하고, 바람의 변화는 바다 표면의 온도와 비가 내리는 곳을 바꿔요.',
      body:['온실 효과를 이해하려면 들어오는 태양 복사와 지표가 내보내는 지구 복사를 구분해요. 온실 기체가 많아지면 지구 복사 에너지가 빠져나가는 방식이 바뀌고, 에너지 출입이 다시 균형에 가까워지는 과정에서 기온이 높아져요.','평소 무역풍은 태평양의 따뜻한 물을 서쪽으로 밀어요. 무역풍이 약해지면 서쪽에 덜 쌓이고 동쪽의 차가운 물이 덜 올라와 동태평양이 따뜻해져요.'],
      steps:[{q:'평형 상태에서 태양 복사 100 중 30이 반사돼요. 지구가 우주로 방출하는 복사는 얼마일까요?',s:['지구가 실제 흡수한 에너지는 100 − 30 = 70이에요.','평형이므로 흡수한 70만큼 우주로 지구 복사를 방출해요.','우주로 나가는 총량을 묻는다면 반사 30과 지구 복사 70을 합친 100이에요.']}]
    },
    s25: {
      sum:'자석이 있다는 사실보다 코일을 통과하는 자기장이 변하는지가 중요해요.',
      body:['코일 바로 앞에 자석을 놓고 멈추면 자기장이 있어도 시간이 지나며 바뀌지 않아요. 자석과 코일이 서로 가까워지거나 멀어지면 코일을 통과하는 자기장이 달라져요.','발전소는 터빈을 계속 돌려 이런 변화를 반복시켜요. 화력과 핵발전은 물을 데우는 에너지원이 다르지만, 증기로 터빈을 돌리고 발전기에서 전기를 얻는 흐름은 같아요.'],
      flow:[{h:'터빈이 회전',i:'바람·물·증기 등이 터빈의 운동을 만들어요.'},{h:'코일을 통과하는 자기장이 변함',i:'터빈에 연결된 발전기의 자석이 회전해요.'},{h:'유도 전류',i:'운동 에너지가 전기 에너지로 전환돼요.'}]
    },
    s26: {
      sum:'과학은 감염 여부와 전파 양상을 판단할 근거를 제공해 사회 문제 해결을 도와요.',
      body:['교과서는 감염병을 확인할 때 단백질을 이용하는 경우와 핵산을 이용하는 경우를 비교해요. 두 경우의 차이는 진단 과정에서 무엇을 찾아내느냐예요.', '진단은 감염 여부를 확인하는 데 쓰이고, 추적은 자료를 바탕으로 감염이 어떻게 퍼졌는지 살펴보는 데 쓰여요. 같은 과학도 질문에 따라 다른 자료가 필요해요.'],

      body:['증기 기관이 사람과 가축이 하던 일을 기계가 맡는 데 쓰였듯이, 오늘날에도 인공지능 로봇이나 사물 인터넷이 생산과 생활의 방식을 바꾸고 있어요.', '스마트 농장은 환경을 효율적으로 관리할 수 있지만, 연결된 기기에는 데이터 보안이 중요해요. 기술을 평가할 때는 얻는 이점, 예상되는 문제, 그 문제를 줄이는 방법을 함께 생각해요.'],

  memo: {
    s21:['BTB는 산성 노랑 → 중성 초록 → 염기성 파랑으로 기억해요.','H⁺와 OH⁻는 하나씩 짝지어 물이 돼요. 반응 후 남는 H⁺·OH⁻를 보고 액성을 판단해요.','H⁺는 음극(−), OH⁻는 양극(+)으로 이동해요.'],
    s22:['흡열은 주변의 열을 흡수해서 주변 온도 하강. 발열은 주변에 열을 방출해서 주변 온도 상승.','증발·융해·승화 vs. 응결·연소·손난로를 구분해요.'],
    s23:['화살표는 먹이 → 먹는 생물, 에너지의 이동 방향이에요.','카이바브: 포식자↓ → 사슴↑ → 먹이 식물↓ → 사슴↓.'],
    s24:['지표 복사 일부를 온실 기체가 흡수하고, 일부를 지표로 다시 방출해요.','엘니뇨: 무역풍↓ → 동태평양 용승↓ → 동태평양 수온↑.','완화는 원인 줄이기, 적응은 피해 줄이기.'],
    s25:['정지한 자석 주위에 자기장은 있지만, 코일을 통과하는 자기장이 달라져야 유도돼요.','화력과 핵발전은 열을 얻는 출발점이 다르고, 열 → 운동 → 전기 과정이 공통이에요.'],
    s26:['단백질 진단은 항원과 항체, 핵산 진단은 표적 유전 물질.','진단은 감염 여부, 추적은 전파 경로.'],

    {id:'t2s2111',u:'s21',p:'53쪽',t:'essay',d:3,q:'제산제로 위산이 중화되는 사례에서 어떤 성질의 물질끼리 반응하는지, 알짜 이온 반응과 함께 설명하세요.',m:'산성인 위산과 제산제의 염기성 성분이 반응해 산성이 약해진다. 중화 반응은 수소 이온과 수산화 이온이 개수비 1:1로 결합해 물을 만드는 반응으로 나타낼 수 있다.',k:['위산은 산성','제산제의 염기성 성분','수소 이온과 수산화 이온','1:1로 결합해 물 생성']},
