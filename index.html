    {id:'t2s2207',u:'s22',p:'60쪽',d:2,q:'교과서의 발열 섬유 가운데 수증기 흡착을 이용하는 섬유의 원리는 무엇인가요?',o:['섬유가 물을 증발시켜 주위 온도를 높여요.','섬유가 수증기를 흡착할 때 열을 방출해요.','표면의 얼음이 융해하면서 열을 방출해요.','바람이 불면 섬유가 주변 열을 흡수하지 못해 열을 만들어요.','섬유 밖의 공기가 기화하며 열을 방출해요.'],a:1,e:'이 유형의 발열 섬유는 수증기를 흡착할 때 방출되는 열을 이용해요. 증발과 융해는 열이 흡수되는 과정이에요.'},
    {id:'t2s2208',u:'s22',p:'65쪽',t:'order',d:2,q:'쿨링 포그가 주변을 식히는 과정을 순서대로 배열하세요.',items:['공기 중으로 작은 물방울을 내보내요.','물방울이 증발하며 주변의 열을 흡수해요.','주변의 온도가 낮아져요.'],e:'미세한 물방울의 증발이 흡열을 일으켜 주변 온도를 낮춰요.'},
    {id:'t2s2209',u:'s22',p:'56쪽, 65쪽',t:'essay',d:3,q:'쿨링 포그와 철 가루 손난로에서 열의 이동 방향이 어떻게 다른지 설명하세요.',m:'쿨링 포그에서 물방울이 증발할 때 주변의 열을 흡수하므로 주변이 식는다. 손난로에서는 철이 산소와 반응하면서 주변으로 열이 방출되어 주변을 데운다.',k:['물방울 증발','주변 열 흡수','철과 산소의 반응','주변으로 열 방출']},

    {id:'t2s2301',u:'s23',p:'76쪽',t:'fill',d:1,q:'여러 먹이 사슬이 서로 복잡하게 연결된 관계를 무엇이라고 하나요?',a:['먹이 그물','먹이그물'],e:'먹이 그물은 여러 먹이 사슬이 얽혀 이루어져요.'},
    {id:'t2s2302',u:'s23',p:'76–77쪽',d:1,q:'풀을 메뚜기가 먹고, 메뚜기를 참새가 먹어요. 에너지가 이동하는 방향은?',o:['풀 → 참새 → 메뚜기','메뚜기 → 풀 → 참새','참새 → 풀 → 메뚜기','풀 → 메뚜기 → 참새','참새 → 메뚜기 → 풀'],a:3,e:'에너지 흐름은 먹이에서 그 먹이를 먹는 생물 쪽이에요.'},
    {id:'t2s2303',u:'s23',p:'77쪽',t:'match',d:1,q:'먹이 사슬 풀 → 메뚜기 → 참새에서 생물의 영양 단계를 연결하세요.',pairs:[['풀','생산자'],['메뚜기','1차 소비자'],['참새','2차 소비자']],e:'식물은 생산자이고 생산자를 먹는 동물은 1차 소비자, 그 동물을 먹는 동물은 이 먹이 사슬에서는 2차 소비자예요.'},
    {id:'t2s2304',u:'s23',p:'77쪽, 94쪽',d:2,q:'생태 피라미드에서 상위 영양 단계로 갈수록 전달되는 에너지가 줄어드는 주된 까닭은?',o:['각 단계에서 에너지가 별다른 변화 없이 모두 다음 단계로 이동해서','생산자가 소비자보다 에너지를 만들지 못해서','각 단계에서 생명 활동과 열 방출 등에 에너지 일부가 쓰여서','최상위 소비자가 하위 영양 단계에 에너지를 공급해서','모든 영양 단계의 개체 크기가 같아서'],a:2,e:'각 단계가 이용하는 에너지 중 일부만 다음 단계에 전달돼요. 특히 호흡 등으로 열이 방출돼요.'},
    {id:'t2s2305',u:'s23',p:'77쪽',d:2,q:'풀 → 메뚜기 → 참새 관계에서 참새가 줄면, 다른 조건이 같을 때 메뚜기와 풀에 나타날 수 있는 초기 변화는?',o:['메뚜기 증가, 풀 감소','메뚜기 감소, 풀 증가','메뚜기 감소, 풀 감소','메뚜기 증가, 풀 증가','메뚜기와 풀 모두 변화 없음'],a:0,e:'참새에게 먹히는 메뚜기가 줄어드는 정도가 작아져 메뚜기 수가 늘 수 있어요. 늘어난 메뚜기가 풀을 더 많이 먹으면 풀이 감소할 수 있어요.'},
    {id:'t2s2306',u:'s23',p:'78쪽',t:'order',d:2,lab:true,q:'카이바브 고원 사례에서 관찰한 관계를 시간 순서대로 배열하세요.',items:['늑대 등 사슴의 포식자가 감소해요.','사슴이 증가해요.','사슴이 먹는 식물이 크게 줄어요.','먹이 부족 등으로 사슴이 감소해요.'],e:'포식자가 줄면 단기적으로 피식자가 늘 수 있지만, 먹이 공급이 부족해지면 그 개체군도 감소할 수 있어요.'},
    {id:'t2s2307',u:'s23',p:'79쪽',d:2,lab:true,q:'개체군 변동 모의실험에서 세대가 지날 때마다 메뚜기 모형과 참새 모형의 수를 기록하는 목적은?',o:['모형의 색을 알아내려고','실제 사슴의 몸무게를 측정하려고','항상 일정한 개체수가 유지됨을 증명하려고','참새의 비행 속도를 알아내려고','먹이와 포식자 사이의 개체수 변화를 비교하려고'],a:4,e:'세대별 기록에서 두 개체군의 변화와 먹이 관계가 서로 어떻게 연결되는지 살펴봐요.'},
    {id:'t2s2308',u:'s23',p:'80–81쪽',t:'ox',d:1,q:'생태계에 큰 교란이 생겨도 원래 상태로 항상 회복돼요.',a:1,e:'회복 능력을 넘어설 정도로 환경이 바뀌면 이전 상태로 돌아오지 못할 수 있어요.'},
    {id:'t2s2309',u:'s23',p:'81쪽',d:2,q:'도로 때문에 동물의 서식지가 둘로 갈렸어요. 단절을 완화하려는 조치는?',o:['도로 가장자리의 침입 외래종 늘리기','갈린 서식지 사이에 생태 통로 놓기','주변 하천의 오염원 추가하기','서식지를 더 잘게 나누기','주변 동물을 대량으로 포획하기'],a:1,e:'생태 통로를 통해 동물이 단절된 서식지 사이를 이동할 수 있어요.'},
    {id:'t2s2310',u:'s23',p:'77–78쪽',t:'essay',d:3,q:'생태계평형을 ‘개체수가 항상 일정함’이라고 설명할 수 없는 까닭을 먹이 관계의 예로 서술하세요.',m:'포식자가 줄면 피식자가 일시적으로 늘고 피식자의 먹이가 감소할 수 있다. 이러한 먹이 관계에 따른 변화로 일부 개체수가 늘거나 줄더라도 교란이 회복 범위 안이면 생태계는 평형을 회복할 수 있다.',k:['포식자 감소','피식자의 일시적 증가','먹이 관계의 변화','회복 범위에서 평형 회복']},

    {id:'t2s2311',u:'s23',p:'94쪽',d:2,q:'두 영양 단계의 에너지양이 표와 같이 나타났어요. 단계의 위치와 에너지 전달 방향을 올바르게 읽은 것은?',bx:['(가) 에너지양 30','(나) 에너지양 300','두 단계는 각각 생산자와 1차 소비자 중 하나예요.'],bl:'자료',o:['(가)가 생산자이고 (가) → (나)로 전달돼요.','(나)가 생산자이고 (나) → (가)로 전달돼요.','(나)가 생산자이고 (가) → (나)로 전달돼요.','(가)가 생산자이고 (나) → (가)로 전달돼요.','(가)와 (나) 사이에는 에너지 전달이 없어요.'],a:1,e:'생산자 단계의 에너지 일부가 1차 소비자에 전달되므로 에너지양이 더 큰 (나)가 생산자예요.'},

    {id:'t2s2401',u:'s24',p:'82–83쪽',d:1,q:'온실 기체가 주로 흡수하는 에너지로 가장 알맞은 것은?',o:['달빛이 바다에서 반사된 빛','지표가 내보내는 적외선','태양에서 오는 모든 가시광선','지구 자전의 운동 에너지','맨틀의 대류 에너지'],a:1,e:'온실 기체는 지표가 방출하는 적외선의 일부를 흡수한 뒤 여러 방향으로 다시 방출해요.'},
    {id:'t2s2402',u:'s24',p:'82–83쪽',t:'ox',d:1,q:'자연적인 온실 효과는 지구의 평균 온도 유지에 기여해요.',a:0,e:'지표가 내보낸 복사 에너지 일부가 대기를 거쳐 지표로 다시 공급돼요. 온실 기체 증가에 따른 온실 효과 강화와 구분해요.'},
    {id:'t2s2403',u:'s24',p:'84쪽',t:'num',d:2,lab:true,q:'교과서 평형 모형에서 태양 복사 100 중 30이 반사돼요. 지구 전체가 흡수하는 에너지양은 얼마인가요?',a:70,e:'입사한 100에서 반사되는 30을 빼면 흡수되는 양은 70이에요.'},
    {id:'t2s2404',u:'s24',p:'84쪽',t:'num',d:2,lab:true,q:'교과서 평형 모형에서 지표가 흡수하는 태양 복사는 50이고, 지표가 흡수하는 대기 복사는 94예요. 지표가 받는 두 복사 에너지의 합은?',a:144,e:'지표는 태양에서 직접 오는 에너지와 대기가 지표 쪽으로 내보내는 에너지를 모두 흡수하므로 50 + 94 = 144예요.'},
    {id:'t2s2405',u:'s24',p:'85쪽',d:2,q:'사막화를 일으킬 수 있는 요인으로 묶인 것은?',o:['생태 통로 확대와 하천 복원','과도한 방목과 산림 조성','과잉 관개 방지와 방풍림 조성','지표 식생 회복과 지속 가능한 경작','오랜 가뭄과 과도한 방목'],a:4,e:'가뭄은 자연적 요인, 과도한 방목은 식생을 훼손하는 인위적 요인이에요.'},
    {id:'t2s2406',u:'s24',p:'86–87쪽',t:'order',d:2,q:'엘니뇨 때 동태평양 적도 해역이 따뜻해지는 과정을 순서대로 배열하세요.',items:['무역풍이 약해져요.','따뜻한 표층수가 서쪽에 덜 쌓이고 동태평양의 용승이 약해져요.','동태평양 표층의 수온이 평상시보다 높아져요.'],e:'무역풍이 약해지면 동쪽에서 차가운 물이 표층으로 공급되는 양이 줄어요.'},
    {id:'t2s2407',u:'s24',p:'86–87쪽, 94쪽',d:2,q:'엘니뇨 때 평상시보다 강수가 늘어나는 경향이 나타나는 곳은?',o:['서태평양 적도 부근','적도 태평양 전역에서 같은 양만큼 증가','동태평양 적도 부근','온대와 극지에만 국한됨','어느 곳에서도 변하지 않음'],a:2,e:'동쪽 해역의 표층 수온이 높아지며 강수 구역이 동쪽으로 이동해요. 서쪽에서는 강수가 감소할 수 있어요.'},
    {id:'t2s2408',u:'s24',p:'88–89쪽',t:'match',d:2,q:'기후 변화에 대응하는 내용과 목적을 연결하세요.',pairs:[['화석 연료 대신 저탄소 에너지원 사용','온실 기체 배출 감축'],['폭염 쉼터 마련','폭염 피해에 적응'],['홍수 위험 지역의 방재 시설 강화','집중호우 피해에 적응']],e:'완화는 기후 변화의 원인을 줄이는 대응이고 적응은 이미 일어나거나 예상되는 변화의 피해를 줄이는 대응이에요.'},
    {id:'t2s2409',u:'s24',p:'90–91쪽',d:2,lab:true,q:'교과서의 온실 기체 배출 시나리오 그래프를 읽는 방법으로 알맞은 것은?',o:['시나리오 하나가 기온을 정확하게 확정한다고 봐요.','배출이 다른 경우의 온도 전망을 비교해 감축의 영향을 살펴봐요.','가장 높은 온도 곡선만 보고 모든 가정을 같다고 봐요.','배출량이 달라도 온도 전망은 항상 같다고 봐요.','가로축의 시간이 서로 달라도 같은 지점으로 간주해요.'],a:1,e:'시나리오는 서로 다른 배출 가정에 따른 결과예요. 동일한 시점에서 전망의 차이를 비교해요.'},
    {id:'t2s2410',u:'s24',p:'92쪽',t:'fill',d:2,q:'교과서는 바다에서 자라며 탄소를 흡수하는 생물을 기르는 연구로 어떤 양식 사례를 소개하나요?',a:['해조류 양식','해조류양식','해조류','해조류를 기르는 것'],e:'김이나 미역 같은 해조류는 성장 과정에서 탄소를 흡수해요. 그 효과를 활용하는 연구 사례예요.'},
    {id:'t2s2411',u:'s24',p:'82–84쪽, 88–89쪽',t:'essay',d:3,q:'온실 기체가 늘면 지표 기온에 어떤 영향을 줄 수 있는지 설명하고, 완화와 적응의 사례를 하나씩 쓰세요.',m:'온실 기체가 늘면 대기가 흡수하는 지구 복사 에너지와 지표로 되돌아오는 복사 에너지가 증가해 지표 기온이 올라갈 수 있다. 화석 연료 사용을 줄여 배출을 감축하는 것은 완화이고, 폭염에 대비해 쉼터를 마련하는 것은 적응이다.',k:['지구 복사 흡수','지표 쪽 재방출 증가','기온 상승','완화 사례','적응 사례']},

    {id:'t2s2501',u:'s25',p:'102–103쪽',d:1,lab:true,q:'자석과 코일 실험에서 검류계가 직접 확인하는 것은 무엇인가요?',o:['자석과 코일의 거리','회로를 흐르는 작은 전류의 유무·방향·세기','자석 자체의 극 이름','터빈의 회전수','코일 내부의 온도'],a:1,e:'검류계 바늘이 움직이는지, 어느 방향으로 얼마나 움직이는지를 보고 미세한 전류를 확인해요.'},
    {id:'t2s2502',u:'s25',p:'103–105쪽',t:'ox',d:1,lab:true,q:'교과서 실험에서 자석을 코일 앞에 가까이 놓고 두 물체를 모두 멈추면, 멈춘 뒤에도 계속 유도 전류가 흘러요.',a:1,e:'자기장이 존재해도 코일을 통과하는 자기장이 변하지 않으면 유도 전류가 흐르지 않아요.'},
    {id:'t2s2503',u:'s25',p:'104–105쪽',d:2,lab:true,q:'교과서처럼 코일과 검류계를 연결했어요. 다른 자기장 변화가 없을 때 유도 전류가 흐르는 상황은?',o:['자석을 코일 가까이 가져가는 중','자석과 코일을 조금 떨어뜨려 모두 멈춘 상태','자석을 코일 안쪽에 넣은 채 멈춘 상태','그 밖의 자기장 변화 없이 코일만 정지한 상태','자석과 코일 사이의 위치와 방향을 그대로 유지한 채 둘을 함께 옮기는 중'],a:0,e:'이 실험에서는 자석과 코일의 상대적인 배치가 달라져 코일을 통과하는 자기장이 변해야 해요.'},
    {id:'t2s2504',u:'s25',p:'104–105쪽',t:'fill',d:1,q:'코일을 통과하는 자기장이 변할 때 회로에 전류가 유도되는 현상은 무엇인가요?',a:['전자기 유도','전자기유도'],e:'이 현상을 전자기 유도라 하고, 이때 흐르는 전류를 유도 전류라고 해요.'},
    {id:'t2s2505',u:'s25',p:'수업 PDF · 전기 23–24쪽',d:2,lab:true,q:'같은 코일·자석·회로에서 자석을 코일 쪽으로 움직이는 속도만 빠르게 하면 유도 전류의 세기는?',o:['작아져요.','항상 0이에요.','같고 방향만 반대예요.','커져요.','자석의 극을 바꿀 때만 세기가 달라져요.'],a:3,e:'더 빠른 움직임은 단위 시간에 코일을 지나는 자기장을 더 크게 바꿔요. 회로 저항을 같게 두면 유도 기전력이 클수록 유도 전류가 커져요.'},
    {id:'t2s2506',u:'s25',p:'수업 PDF · 전기 13, 25쪽',d:2,lab:true,q:'같은 코일의 같은 쪽에서 자석의 N극을 코일에 가까이 할 때와 멀리 할 때, 유도 전류의 방향은?',o:['항상 같아요.','가까이 할 때만 전류가 생겨요.','서로 반대예요.','멀리 할 때만 전류가 생겨요.','두 경우 모두 전류가 흐르지 않아요.'],a:2,e:'같은 극이 가까워질 때와 멀어질 때는 코일을 통과하는 자기장의 변화 방향이 반대이므로 유도 전류 방향도 반대예요.'},
    {id:'t2s2507',u:'s25',p:'수업 PDF · 전기 25쪽',d:3,q:'렌츠 법칙으로 유도 전류가 만드는 자기장의 방향을 판단해요. 핵심 설명은?',o:['항상 처음부터 있던 자기장과 같은 방향이에요.','항상 지구 자기장과 같은 방향이에요.','코일의 전기 저항이 없어지는 쪽이에요.','항상 처음부터 있던 자기장과 반대 방향이에요.','코일을 통과하는 자기장의 변화를 방해하는 방향이에요.'],a:4,e:'가까워지면서 기존 자기장이 강해질 때는 그 증가를 방해하고, 멀어지면서 약해질 때는 감소를 방해해요.'},
    {id:'t2s2508',u:'s25',p:'106–107쪽',t:'order',d:2,q:'터빈을 돌리는 발전소에서 전기 에너지를 얻는 과정을 순서대로 배열하세요.',items:['바람·물·증기 등으로 터빈을 돌려요.','터빈과 연결된 발전기 내부에서 자석이 회전해요.','고정된 코일을 통과하는 자기장이 달라져요.','코일에 전류가 유도돼요.'],e:'터빈의 운동이 발전기의 자석 회전으로 이어지고, 자기장 변화로 전기가 생산돼요.'},
    {id:'t2s2509',u:'s25',p:'108쪽 · 수업 PDF 전기 54쪽',t:'match',d:2,q:'발전 방식과 열에너지를 얻기 전의 에너지 형태를 연결하세요.',pairs:[['화력 발전','화석 연료의 화학 에너지'],['핵발전','원자핵의 에너지']],e:'두 방식 모두 열로 만든 증기를 이용해 터빈을 돌리고, 발전기가 그 운동 에너지를 전기 에너지로 바꿔요.'},
    {id:'t2s2510',u:'s25',p:'수업 PDF · 전기 35, 40쪽',d:2,q:'자료에서 전자기 유도 발전기와 달리 빛을 직접 전기 에너지로 전환하는 장치는?',o:['화력 발전기의 회전 자석','수력 발전기의 터빈','풍력 발전기','태양 전지','핵발전기의 코일'],a:3,e:'태양 전지는 빛을 받아 전기 에너지로 직접 전환해요. 풍력이나 수력 발전기는 회전 운동과 전자기 유도를 이용해요.'},
    {id:'t2s2511',u:'s25',p:'109쪽 · 수업 PDF 전기 48–51쪽',d:2,q:'화력 발전과 핵발전에 관한 설명 가운데 옳은 것은?',o:['화력은 화석 연료를 태워도 온실 기체가 나오지 않아요.','핵발전의 방사성 폐기물은 일반 생활 쓰레기와 같은 방식으로 처리해요.','두 발전 방식 모두 모든 환경 영향이 없어요.','핵발전은 증기와 터빈을 사용하지 않아요.','화력은 배출 물질, 핵발전은 방사성 폐기물과 사고 안전 관리가 중요한 과제예요.'],a:4,e:'열에너지를 얻는 방식과 그에 따른 관리 과제가 달라요. 두 발전 모두 증기로 터빈을 돌리는 과정을 이용해요.'},
    {id:'t2s2512',u:'s25',p:'수업 PDF · 전기 52쪽',d:3,q:'양수 저장 발전에서 전력이 남을 때 물을 높은 곳으로 올리는 목적은?',o:['물을 완전히 증발시키려고','전기 에너지를 물의 위치 에너지로 저장하려고','낙차를 없애려고','터빈에 전기를 저장하려고','물을 화석 연료로 바꾸려고'],a:1,e:'남는 전기로 물을 높은 저수지로 올려 위치 에너지로 저장해요. 전기가 필요할 때 물을 아래로 보내 터빈과 발전기를 돌려요.'},
    {id:'t2s2513',u:'s25',p:'103–108쪽',t:'essay',d:3,q:'자석을 코일 앞에 정지해 둘 때와 발전기의 자석을 회전시킬 때 전류가 달라지는 까닭을 서술하세요.',m:'정지한 자석은 코일을 통과하는 자기장을 일정하게 하므로 유도 전류가 흐르지 않는다. 발전기에서는 자석이 회전하면서 코일을 통과하는 자기장이 변하여 닫힌 회로에 유도 전류가 흐르고, 운동 에너지가 전기 에너지로 전환된다.',k:['정지 시 자기장 일정','회전 시 자기장 변화','유도 전류','운동 에너지 → 전기 에너지']},

    {id:'t2s2601',u:'s26',p:'130–131쪽',d:1,q:'학교 보건 자료에서 감염병 진단의 목적으로 가장 알맞은 것은?',o:['모든 감염병이 언제 사라질지 정하는 것','감염 여부를 판단할 근거를 얻는 것','사람들의 키와 몸무게를 확인하는 것','기온의 장기 변화를 추정하는 것','검사 결과를 자료 없이 추측하는 것'],a:1,e:'진단은 관찰과 검사 결과를 바탕으로 감염 여부를 판단하는 데 활용돼요.'},
    {id:'t2s2602',u:'s26',p:'130–131쪽',t:'match',d:1,q:'과학을 활용한 활동과 목적을 연결하세요.',pairs:[['감염병 진단','감염 여부를 판단'],['감염병 추적','전파 경로를 파악'],['사회 문제 해결 연구','자료를 통해 대책의 효과를 평가']],e:'과학은 궁금한 문제에 맞는 자료를 수집하고 근거에 따라 해석하는 데 쓰여요.'},
    {id:'t2s2603',u:'s26',p:'132쪽',d:2,lab:true,q:'교과서에서 단백질을 이용한 진단을 설명하는 핵심 원리는?',o:['모든 종류의 단백질이 서로 똑같이 반응함','유전 물질의 양을 관찰함','항원과 그에 맞는 항체의 특이적 결합','용액의 끓는점을 비교함','양성 여부를 시료의 이름으로 판단함'],a:2,e:'특정 항원에 맞는 항체가 결합하는 성질을 활용해 표적을 확인해요.'},
    {id:'t2s2604',u:'s26',p:'132–133쪽',t:'match',d:2,lab:true,q:'진단 방법과 확인하는 대상을 연결하세요.',pairs:[['항원·항체 결합에 따른 신호를 이용한 검사','표적 단백질'],['교과서가 예로 든 PCR 검사','표적 핵산']],e:'두 방법은 감염 여부에 대한 근거를 얻지만, 무엇을 탐지하는지가 달라요.'},
    {id:'t2s2605',u:'s26',p:'133쪽',t:'fill',d:1,q:'교과서에서 표적 핵산의 존재를 확인하는 데 이용된 검사 이름은 무엇인가요?',a:['PCR','PCR 검사','피씨알'],e:'PCR은 교과서의 핵산 기반 진단 사례예요. 단백질을 찾는 검사와 구분해요.'},
    {id:'t2s2606',u:'s26',p:'130–133쪽',t:'ox',d:2,q:'진단을 통해 감염 여부를 판단하는 것과 전파 경로를 추적하는 것은 같은 질문에 답하는 일이에요.',a:1,e:'진단은 감염 여부를, 추적은 자료를 종합해 감염이 어떻게 퍼졌는지를 살펴봐요.'},
    {id:'t2s2607',u:'s26',p:'132–133쪽',t:'essay',d:3,q:'교과서에 제시된 단백질 기반 진단과 핵산 기반 진단을 구분하고, 감염병 대응에 과학이 왜 유용한지 설명하세요.',m:'단백질 기반 진단은 항원과 항체가 특이적으로 결합하는 성질을 이용해 표적 단백질을 확인한다. 핵산 기반 진단은 표적 유전 물질의 존재를 확인한다. 두 진단 방법은 감염 여부에 대한 근거를 주어 치료와 예방 등 대응에 쓰인다.',k:['항원과 항체의 특이적 결합','표적 유전 물질','감염 여부 판단 근거','감염병 대응에 활용']},

    {id:'t2s2608',u:'s26',p:'133쪽',d:2,lab:true,q:'교과서의 핵산 진단 그림에서 진단 신호를 읽어요. 제시된 결과에서 표적을 확인한 경우는?',bx:['사람 3: 표적 핵산의 검출을 보여 주는 신호가 나타났어요.','사람 4: 표적 핵산의 검출을 보여 주는 신호가 나타나지 않았어요.'],bl:'자료',o:['두 사람 모두','사람 4만','사람 3만','두 사람 모두 검출 결과 없음','단백질 검사가 아니어서 어느 경우도 표적 판독이 불가능함'],a:2,e:'교과서에서는 표적 핵산 신호가 나타난 사람 3을 표적이 검출된 사례로 제시해요.'},

    {id:'t2s2701',u:'s27',p:'수업 PDF · 과학기술 3–11쪽',t:'order',d:2,q:'수업 자료에 나온 증기 기관 활용의 역사적 배경을 순서대로 배열하세요.',items:['목재가 부족해져 석탄 사용이 늘어요.','석탄 광산에서 물을 퍼내야 할 필요가 생겨요.','광산 배수에 증기 기관을 활용해요.','생산과 교통에 증기 기관 활용이 확대돼요.'],e:'하나의 기술이 처음 해결하려던 과제와, 그 기술의 활용이 확대된 뒤의 효과를 구분해 봐요.'},
    {id:'t2s2702',u:'s27',p:'수업 PDF · 과학기술 14쪽',d:2,q:'수업 자료의 하버·보슈 질소 고정 사례가 식량 생산에 기여한 경로는?',o:['물만으로 작물의 양분을 모두 공급했어요.','암모니아 대량 생산을 통해 질소 비료 공급이 늘었어요.','비료 없이도 어디서나 작물을 기를 수 있게 됐어요.','햇빛을 모두 전기로 바꿔 작물을 만들었어요.','토양의 모든 양분을 제거했어요.'],a:1,e:'암모니아를 대량으로 생산해 만든 질소 비료는 작물에 필요한 질소 공급에 쓰여요.'},
    {id:'t2s2703',u:'s27',p:'수업 PDF · 과학기술 15–16쪽',d:1,q:'인공지능 로봇의 특성과 활용을 설명한 것으로 알맞은 것은?',o:['정보를 수집하지 않고 언제나 같은 동작만 반복해요.','네트워크에 연결되면 주변 상황을 판단할 필요가 없어져요.','센서는 환경 정보를 얻는 데 쓸 수 없어요.','센서 등에서 얻은 정보로 환경을 파악하고 작업이나 위험한 일을 도와요.','어떤 상황에서도 별도의 안전 관리가 필요 없어요.'],a:3,e:'인공지능 로봇은 정보를 바탕으로 상황을 인식·판단하고 행동할 수 있어요. 작업 지원과 안전 관리가 모두 중요해요.'},
    {id:'t2s2704',u:'s27',p:'수업 PDF · 과학기술 16–20, 33쪽',t:'fill',d:1,q:'가전이나 센서 같은 사물이 네트워크를 통해 데이터를 주고받는 기술을 무엇이라고 하나요?',a:['사물 인터넷','사물인터넷','IoT','Internet of Things'],e:'사물 인터넷은 사물의 센서와 통신 기능을 연결해 정보를 주고받게 해요.'},
    {id:'t2s2705',u:'s27',p:'수업 PDF · 과학기술 16–19쪽',d:2,q:'사물 인터넷을 스마트 농장에 활용한 사례로 가장 알맞은 것은?',o:['온도 센서가 측정한 값을 장치로 전송해 환경을 관리해요.','차단된 센서에서 데이터를 출력하지 않아요.','온실의 크기를 자로 재고 결과를 종이에만 보관해요.','매일 같은 시간에 같은 양의 물을 손으로 줘요.','농장 표지의 번호를 바닥에 그려요.'],a:0,e:'센서값이 네트워크로 전달되어 상황에 맞는 환경 관리에 쓰인다는 점이 핵심이에요.'},
    {id:'t2s2706',u:'s27',p:'수업 PDF · 과학기술 21–26쪽',t:'ox',d:1,q:'과학기술이 발전하면 어떤 사람도 정보 접근에서 소외되지 않고 새로운 사회 문제도 생기지 않아요.',a:1,e:'기술은 유용하지만 기기 접근과 활용 능력의 차이로 정보 격차가 생기거나 개인정보 등의 문제가 발생할 수 있어요.'},
    {id:'t2s2707',u:'s27',p:'수업 PDF · 과학기술 22–26쪽',t:'match',d:2,q:'기술의 활용과 함께 고려할 과제를 알맞게 연결하세요.',pairs:[['자율주행 보조','위험 판단과 사고에 대한 책임 기준'],['개인 맞춤형 서비스','데이터 수집 동의와 개인정보 보호'],['온라인 소통','허위 정보와 사이버 언어폭력 예방']],e:'각 기술의 장점을 활용하면서 관련된 위험과 책임도 함께 살펴요.'},
    {id:'t2s2708',u:'s27',p:'수업 PDF · 과학기술 34쪽',d:2,q:'정보 통신 기술의 발전이 생활에 미치는 영향을 균형 있게 설명한 것은?',o:['정보를 찾기 쉬워지면 접근 여건의 차이도 자동으로 사라져요.','소통이 편리해질수록 개인정보 보호가 필요 없어요.','사이버 언어폭력을 예방하려면 자료를 확인할 필요가 없어요.','정보 접근은 쉬워지지만 허위 정보 확산이나 정보 격차가 나타날 수 있어요.','사람들이 빠르게 소통하면 모든 갈등이 없어져요.'],a:3,e:'빠른 소통과 정보 접근은 장점이지만 기술을 이용하면서 정보의 신뢰도와 접근 격차를 살펴야 해요.'},
    {id:'t2s2709',u:'s27',p:'수업 PDF · 과학기술 35쪽',d:2,q:'과학기술의 책임 있는 활용에 가장 가까운 행동은?',o:['효율만 높다면 안전 기준을 마련하지 않아요.','개인정보는 용도를 알리지 않고 최대한 많이 모아요.','환경에 미치는 영향은 제품을 다 쓴 뒤에만 생각해요.','모든 정보는 사실인지 확인하지 않고 공유해요.','수집 목적을 알리고 필요한 정보만 동의를 받아 사용해요.'],a:4,e:'개인정보는 목적과 범위를 설명하고 동의를 받아 필요한 만큼만 사용하는 것이 책임 있는 태도예요.'},
    {id:'t2s2710',u:'s27',p:'수업 PDF · 과학기술 12–13, 21–26쪽',t:'essay',d:3,q:'한 가지 과학기술의 유용성과 한계를 각각 쓰고, 한계를 줄이기 위한 방안을 제안하세요.',m:'예를 들어 사물 인터넷을 이용한 농장은 온도와 습도 데이터를 모아 관리 효율을 높일 수 있다. 그러나 기기의 보안이 부족하면 데이터가 노출될 수 있다. 필요한 데이터만 수집하고 접근 권한을 관리해 이 위험을 줄일 수 있다.',k:['기술 사례 제시','구체적 이점','해당 기술의 한계','한계를 줄이는 방안']}
  ]
});

/* 한국사2 2차고사 · 교과서 68~143쪽 */
{

  const trap = (h, t) => ({k:'trap', h, t});
  const notes = {
    h21:[
      list('광복 직후', '1945년 8월 15일 광복 직후 <b>여운형·안재홍</b> 등이 조선 건국 준비 위원회를 조직해 치안 유지와 새 국가 건설을 준비했어요.', '38도선 이남에서 <b>미군정</b>은 직접 통치하고 대한민국 임시 정부 등을 정부로 인정하지 않았어요. 이북의 <b>소군정</b>은 인민 위원회를 통한 간접 통치를 펴고 김일성 등 좌익 세력을 지원했어요.'),
      list('통일 정부 수립 노력', '1945년 12월 <b>모스크바 3국 외상 회의</b>에서 임시 민주 정부 수립, 미소 공동 위원회 설치, 최대 5년 신탁 통치가 합의됐어요.', '제1차 미소 공동 위원회가 휴회된 뒤 이승만은 <b>정읍 발언</b>으로 남한만이라도 임시 정부를 세우자고 주장했어요.', '여운형·김규식은 <b>좌우 합작 7원칙</b>을 발표했어요. 유엔 소총회가 접근 가능한 지역에서의 선거를 결정하자 김구·김규식은 <b>남북 협상</b>을 추진했어요.', '단독 선거를 둘러싼 갈등 속에 <b>제주 4·3 사건</b>과 <b>여수·순천 10·19 사건</b>이 일어났으며 진압 과정에서 많은 민간인이 희생됐어요.'),
      kv('정부 수립과 개혁', ['1948년 5·10 총선거', '유엔 한국 임시 위원단이 감시했으며 <b>제헌 국회</b>를 구성했어요.'], ['1948년 제헌 헌법', '7월 17일 공포. 민주 공화국, 국민 주권, 삼권 분립, 대통령 중심제 등을 담았어요.'], ['1948년 정부 수립', '제헌 국회가 이승만과 이시영을 대통령·부통령으로 선출했고 8월 15일 정부 수립을 선포했어요. 9월 9일에는 북쪽에 별도의 정권이 수립됐어요.'], ['반민 특위', '반민족 행위 처벌법을 바탕으로 조사했어요. 정부 방해와 경찰의 습격, 공소 시효 단축 등으로 활동이 좌절됐어요.'], ['농지 개혁과 귀속 재산', '남한은 <b>유상 매수·유상 분배</b>로 지주·소작제를 줄였고, 북한은 <b>무상 몰수·무상 분배</b>를 시행했어요. 귀속 재산은 농지를 제외하고 민간에 불하했어요.']),
      trap('인물 헷갈리지 않기', '여운형·안재홍은 건국 준비 위원회, 여운형·김규식은 좌우 합작, 김구·김규식은 남북 협상에 연결해요.')
    ],
    h22:[
      list('전쟁의 배경과 전개', '남북에 별도 정권이 들어선 뒤 38도선 부근에서 군사 충돌이 잦았어요. 북한은 소련과 중국의 지원을 받아 전쟁을 준비했어요. 애치슨 선언의 미국 태평양 방위선에 한국은 포함되지 않았어요.', '<b>1950년 6월 25일 북한의 남침</b> → 유엔군 참전·낙동강 방어 → 인천 상륙 작전·서울 수복 → 중국군 참전·1·4 후퇴 → 전선 교착의 흐름으로 정리해요.', '<b>1953년 7월 27일 정전 협정</b>이 체결됐어요. 군사 분계선을 기준으로 양쪽에 각 2 km씩 비무장 지대가 설치됐어요. 같은 해 10월에는 한미 상호 방위 조약이 체결됐어요.'),
      kv('이승만 정부의 장기 집권', ['1952년 발췌 개헌', '부산에서 대통령을 <b>직접 선거</b>로 뽑는 방식으로 바꾸었어요.'], ['1954년 사사오입 개헌', '<b>초대 대통령</b>은 중임 제한을 적용받지 않도록 했어요. 찬성 135표가 정족수 136표에 미치지 못했지만 사사오입을 내세워 가결을 선언했어요.'], ['반공 체제 강화', '조봉암의 진보당을 탄압하고 국가 보안법을 개정했으며, 정부에 비판적인 『경향신문』을 폐간했어요.']),
      list('전후 남북의 변화', '남과 북은 인명과 산업 시설에 큰 피해를 입었고 이산가족이 생겼어요. 정전 이후에도 분단과 대립은 이어졌어요.', '남한은 미국 잉여 농산물을 원료로 <b>삼백 산업</b>(제분·제당·면방직)이 발달했어요. 값싼 수입 농산물은 농가에도 부담을 주었어요.', '북한은 소련·중국의 지원으로 복구하고 농업과 상공업의 협동조합화를 추진했어요. 김일성은 경쟁 세력을 숙청하며 1인 지배 체제를 강화했어요.'),
      trap('정전과 조약', '정전 협정에 대한민국 정부는 서명하지 않았어요. 정전 협정과 한미 상호 방위 조약은 체결 시기와 성격이 서로 달라요.')
    ],
    h23:[
      list('4·19 혁명과 장면 내각', '<b>3·15 부정 선거</b>에 항의하는 시위가 열렸고, 김주열 학생의 시신 발견 뒤 시위가 확산됐어요. 학생과 시민이 참여했고 이승만은 4월 26일 하야를 발표했어요.', '허정 과도 정부를 거쳐 <b>내각 책임제·양원제</b>로 개헌했어요. 윤보선이 대통령, 장면이 국무총리가 됐어요. 장면 내각은 경제 개발 계획과 지방 자치를 추진했지만 5·16 군사 정변으로 무너졌어요.'),
      kv('박정희 정부의 성립과 장기 집권', ['1961년 5·16 군사 정변', '군부가 국가 재건 최고 회의를 설치하고 입법·사법·행정권을 장악했어요.'], ['1965년 한일 협정', '국교 정상화로 경제 개발 자금을 일부 확보했어요. 식민 지배 사죄와 배상 등을 둘러싸고 반대 시위가 일어났어요.'], ['베트남 파병', '미국의 요청과 지원 약속을 계기로 이루어졌어요. 해외 진출과 수출의 기회가 생긴 한편 희생과 피해도 남았어요.'], ['1969년 3선 개헌', '대통령의 세 번째 임기까지 허용했어요.'], ['1972년 유신 헌법', '통일 주체 국민 회의가 대통령을 간접 선출하고, 임기 6년과 중임 제한 폐지, 긴급 조치권 등으로 대통령 권력이 커졌어요.']),
      list('유신 체제에 맞선 민주화 운동', '개헌 청원 100만인 서명 운동과 3·1 민주 구국 선언 등의 반유신 활동이 전개됐어요. 정부는 긴급 조치로 저항을 억압했어요.', '1979년 <b>YH 무역 사건</b>과 김영삼 국회 의원 제명에 이어 <b>부마 민주 항쟁</b>이 일어났어요. 뒤이어 일어난 <b>10·26 사태</b>로 유신 체제가 사실상 무너졌어요.'),
      trap('개헌 조항을 비교해요', '3선 개헌은 세 번째 임기 허용, 유신 헌법은 간접 선거·6년 임기·중임 제한 폐지로 구별해요.')
    ],
    h24:[
      list('5·18 민주화 운동', '1979년 <b>12·12 사태</b>로 신군부가 군사권을 장악했어요. 서울의 봄에 민주화 요구가 커졌지만 신군부는 1980년 5월 17일 비상계엄을 전국으로 확대했어요.', '5월 18일 광주에서 계엄 철폐와 신군부 퇴진을 요구하는 시위가 일어났어요. 계엄군의 폭력적인 진압에 시민들이 저항했고, 외부와 단절된 상황에서도 스스로 질서를 지켰어요. 5월 27일 계엄군이 무력으로 진압했어요.', '국가 폭력과 신군부의 권력 장악에 맞선 민주화 운동이었고, 이후 민주화 운동에 영향을 주었어요. 관련 기록물은 2011년 유네스코 세계 기록 유산에 등재됐어요.'),
      list('전두환 정부와 6월 민주 항쟁', '전두환 정부는 <b>대통령 7년 단임·간선제</b>를 채택하고 언론과 민주화 운동을 통제했어요.', '1987년 <b>박종철 고문치사 사건</b>과 은폐 사실이 알려졌어요. 정부의 <b>4·13 호헌 조치</b>가 직선제 개헌 요구를 막으려 하자 저항이 커졌어요.', '이한열 학생의 최루탄 피격에 이어 <b>6·10 국민 대회</b>가 열렸어요. 전국적으로 항쟁이 확산되어 노태우가 <b>6·29 선언</b>으로 대통령 직선제 개헌 등을 수용했어요.'),
      trap('민주화 운동의 결과를 구별해요', '4·19는 이승만 하야와 내각 책임제, 5·18은 이후 항쟁의 토대, 6월 민주 항쟁은 대통령 직선제 개헌으로 연결해요.')
    ],
    h25:[
      kv('시기별 경제 성장', ['1960년대', '제1·2차 <b>경제 개발 5개년 계획</b>에 따라 섬유·신발 등 노동 집약적 경공업과 수출을 육성했어요. 베트남 특수와 경부 고속 국도 건설 등도 성장에 보탬이 됐어요.'], ['1970년대', '제3·4차 계획 시기 철강·화학·기계·조선 등 <b>중화학 공업</b>을 육성했어요. 1차 석유 파동 뒤 중동 건설에 진출했고, 1977년 수출 100억 달러를 달성했어요.'], ['1980년대 후반', '<b>저달러·저유가·저금리</b>의 3저 호황 속에 자동차·반도체 등 기술 집약적 산업이 성장했어요.']),
      list('성장의 이면과 대응', '빈부·도농·지역 격차, 재벌 중심 경제, 외채와 대외 의존이 커졌어요. 도시화로 주택난, 판자촌, 교통·환경 문제가 늘었어요.', '농촌에서는 <b>새마을 운동</b>으로 생활 환경을 개선했지만 소득 격차 해소에는 한계가 있었어요. 함평 고구마 사건처럼 농민이 피해 보상을 요구한 사례가 있었어요.', '1970년 전태일이 근로 기준법 준수를 요구하며 분신했고 노동 운동이 본격화됐어요. <b>온산병 사례</b>는 공해 피해를 알리고 환경 운동이 확대되는 계기가 됐어요.'),
      list('일상과 문화의 변화', '아파트·가전제품 보급, 혼분식 장려, 가공식품과 외식 확대 등으로 일상이 바뀌었어요. 라디오·텔레비전 보급이 대중문화의 성장을 이끌었어요.', '학교와 학생이 늘고 중학교 무시험 추첨제 및 고교 평준화가 시행됐어요. 국기 하강식, 야간 통행금지, 영화 검열, 금지곡 지정 등 일상과 표현에 대한 통제도 있었어요.'),
      tip('경제 자료 읽기', '먼저 연도와 지표를 확인해요. 수출 총액이 늘어도 무역 수지가 같은 폭으로 좋아지는 것은 아니에요.')
    ],
    h26:[
      list('냉전 해체와 탈냉전', '고르바초프의 개혁·개방, 1989년 베를린 장벽 붕괴와 몰타 회담, 1990년 독일 통일, 1991년 소련 해체로 냉전 체제가 끝났어요.', '탈냉전기에는 미국이 국제 질서를 주도하고 유럽 연합이 출범했어요. WTO 출범과 함께 세계화가 진전된 한편 민족·종교 갈등과 난민 문제도 이어졌어요.'),
      kv('정부별 변화', ['노태우 정부', '1987년 직선제 선거 뒤 출범했어요. 1988년 총선 결과 여소야대가 형성됐고, 이후 3당 합당으로 민주 자유당이 만들어졌어요. 소련·중국 등과 수교했어요.'], ['김영삼 정부', '금융 실명제, 지방 자치제 전면 실시, 역사 바로 세우기를 추진했어요. 임기 말 외환 위기가 발생했어요.'], ['김대중 정부', '선거를 통한 최초의 여야 간 평화적 정권 교체였어요. 외환 위기 극복을 추진하고 국가 인권 위원회를 설치했으며 제1차 남북 정상 회담을 열었어요.'], ['노무현 정부', '과거사 정리와 지방 분권을 추진하고 제2차 남북 정상 회담을 열었어요. 2005년 부산 APEC 회의를 개최했어요.'], ['이명박 정부', '실용주의를 내세우고 4대강 정비 사업을 추진했어요. 2010년 서울 G20 정상 회의를 개최했어요.'], ['이후 정부', '박근혜 대통령은 국정 농단 사태와 촛불 시위 이후 헌법 절차에 따라 2017년 파면됐어요. 이후 열린 선거를 통해 정권 교체가 이루어졌어요.']),
      list('시민 사회의 성장', '민주화 이후 경실련·참여 연대 등 시민 단체의 활동이 활발해지고 낙천·낙선 운동 등으로 참여가 확대됐어요.', '여성 단체의 호주제 폐지 요구, 낙동강 페놀 오염 사건을 계기로 한 환경 운동, 금융 실명제 요구, 복지·최저 생계비 개선 활동 등 다양한 분야로 넓어졌어요.'),
      trap('직선제와 정권 교체 구별', '1987년 직선제 선거 이후 노태우 정부가 출범했어요. 선거를 통한 최초의 여야 간 평화적 정권 교체는 김대중 정부 출범과 연결해요.')
    ],
    h27:[
      list('외환 위기의 배경', '1995년 <b>WTO</b> 출범과 세계화 속에 시장 개방이 확대됐고 우리나라는 1996년 <b>OECD</b>에 가입했어요.', '금융 기관의 단기 외채와 기업의 높은 부채가 위험을 키웠어요. 기업의 연쇄 부도, 동남아시아 외환 위기, 외국 자본의 회수로 외환 보유액이 줄어 1997년 <b>IMF</b>에 긴급 구제 금융을 요청했어요.'),
      list('위기 극복과 변화', '김대중 정부는 금융·기업 구조 조정, 공기업 민영화, 노동 시장 유연화 등을 추진했어요. 시민들은 <b>금 모으기 운동</b>에 참여했고 2001년에 IMF 지원금을 조기 상환했어요.', '구조 조정 과정에서 대량 해고와 비정규직 고용이 늘어났어요. 계층·기업·지역 사이의 격차가 확대되는 <b>사회 양극화</b>가 문제가 됐어요.', '2004년 칠레를 시작으로 FTA를 확대했고, 반도체·자동차·정보 기술 등이 수출과 성장을 뒷받침했어요.'),
      kv('사회·문화 변화', ['저출산·고령화', '가족 가치관과 양육 부담의 변화 속에 출산율이 낮아지고 평균 수명은 늘어 고령 인구 비중이 커졌어요.'], ['다문화 사회', '외국인 노동자와 국제결혼 가정 등의 증가로 언어·문화적 배경이 다양해졌어요.'], ['21세기의 한국', '드라마·음악·영화 등 한류, 국제 스포츠와 첨단 기술 등이 세계에서 주목받았어요.']),
      tip('극복과 후유증을 모두 살펴봐요', '구제 금융 조기 상환과 수출 회복은 경제 성과예요. 대량 해고·고용 불안·소득 격차는 극복 과정에서 남은 문제예요.')
    ],
    h28:[
      list('북한의 정치·경제 변화', '김일성은 유일 지배 체제를 굳혔고, 1972년 사회주의 헌법에서 <b>주체사상</b>을 국가 통치 이념으로 공식화했어요. 이후 김정일·김정은으로 권력이 세습됐어요.', '북한은 1984년 합영법과 1991년 나진·선봉 자유 경제 무역 지대로 외국 자본을 유치하려 했어요. 2000년대에는 7·1 경제 관리 개선 조치 등으로 시장 경제 요소를 부분 도입했어요.'),
      kv('남북 합의 비교', ['1972년 7·4 남북 공동 성명', '<b>자주·평화·민족적 대단결</b>의 통일 3대 원칙에 합의했어요.'], ['1991년 남북 기본 합의서', '남북이 서로 체제를 인정·존중하고 <b>불가침</b>에 합의했어요. 같은 해 남북한은 유엔에 동시에 가입했어요.'], ['2000년 6·15 남북 공동 선언', '김대중 정부 시기 <b>제1차 남북 정상 회담</b>에서 발표했어요. 통일 방안의 공통점, 이산가족 문제, 경제 협력 등을 다뤘어요.'], ['2007년 10·4 선언', '노무현 정부 시기 제2차 정상 회담에서 평화·번영과 경제 협력을 추진했어요.'], ['2018년 판문점 선언', '문재인 정부 시기 남북 정상이 한반도 평화와 번영, 통일을 위한 의지를 밝혔어요.']),
      list('교류와 동아시아 평화', '금강산 관광·개성 공단은 경제 교류, 이산가족 상봉은 인도적 교류, 시드니 올림픽 공동 입장은 스포츠 교류의 사례예요.', '중국의 <b>동북공정</b>, 일본의 식민 지배·침략 역사 왜곡과 영토 갈등이 나타났어요. 공동 역사 교재 편찬과 청소년 교류로 상호 이해를 넓히려 했어요.', '독도 관련 근거로 『삼국사기』의 우산국 기록, 『신증동국여지승람』 팔도총도, 안용복 활동 기록, 일본 <b>태정관 지령</b>(1877), 대한 제국 <b>칙령 제41호</b>(1900), 연합국 최고 사령관 각서 제677호(1946), 평화선(1952) 등을 살펴봐요.'),
      trap('독도 사료의 주체', '태정관 지령은 일본 메이지 정부의 문서예요. 칙령 제41호는 대한 제국이 울도군 관할에 석도를 명시한 문서예요.')
    ]
  };
  const easy = {
    h21:{sum:'광복 직후 통일 정부를 세우려는 여러 시도가 있었지만, 결국 남과 북에 별도의 정권이 수립됐어요.',body:['광복 직후 가장 급한 일은 치안 유지와 정부 수립이었어요. 여운형과 안재홍의 건국 준비 위원회, 미·소의 분할 점령을 먼저 연결해 보세요.', '정치 세력은 임시 민주 정부를 만들자는 국제 합의에 서로 다르게 대응했어요. 좌우 합작과 남북 협상이 어떤 갈등을 해결하려 했는지 비교하면 사건의 순서가 보여요.', '총선거를 실시하여 의회를 구성하고, 의회가 헌법을 만들고 대통령을 선출했어요. 그 뒤 새 정부는 친일 청산·농지 개혁 등의 과제를 풀려 했어요.'],flow:[{h:'1945 광복',i:'건국 준비 위원회·미소 분할 점령'},{h:'1945~1947 합의와 갈등',i:'모스크바 회의 → 미소 공동 위원회·좌우 합작'},{h:'1948 정부 수립',i:'남북 협상 → 5·10 총선거 → 제헌 헌법 → 정부 수립'}]},
    h22:{sum:'전쟁의 전개는 전선의 변화로, 전후의 남북은 정치·경제의 차이로 정리해요.',body:['6·25 전쟁 중 전선은 낙동강 일대에서 북쪽으로 움직였다가 중국군 참전으로 다시 남쪽으로 내려왔어요. 이후 교착 상태에서 회담이 진행되었어요.', '협정으로 전투가 멈췄지만 분단은 지속됐어요. 많은 민간인과 군인이 희생됐고, 이산가족이 생기고 산업 시설도 파괴됐어요.', '남한은 미국의 경제 원조를 받아 삼백 산업이 발달했어요. 북한은 소련·중국의 지원을 받고 산업 복구와 협동조합화를 추진했어요.'],grid:[{h:'남한',i:'미국 원조 → 삼백 산업·민간 기업 중심'},{h:'북한',i:'소련·중국 지원 → 국가 주도 계획·협동조합화'}]},
    h23:{sum:'4·19 혁명은 독재를 무너뜨렸고, 군사 정변 이후에는 장기 집권에 맞서는 민주화 운동이 이어졌어요.',body:['3·15 부정 선거에 대한 항의가 학생과 시민에게 확산됐어요. 이승만 하야 뒤에는 대통령 중심제 대신 내각 책임제가 도입됐어요.', '5·16 군사 정변으로 군부가 권력을 장악했어요. 박정희 정부는 3선 개헌을 거쳐 유신 헌법으로 대통령 권력을 더욱 강화했어요.', '유신 체제에 반대하는 시민·언론·종교계의 저항이 이어졌어요. 1979년에는 부마 민주 항쟁과 10·26 사태를 거치며 유신 체제가 무너졌어요.']},
    h24:{sum:'5·18은 국가 폭력에 맞선 민주화 운동이고, 6월 민주 항쟁은 대통령 직선제 개헌으로 이어졌어요.',body:['신군부가 12·12 사태로 군사권을 장악했지만 학생과 시민의 민주화 요구는 계속됐어요. 비상계엄 전국 확대 직후 광주에서 5·18 민주화 운동이 시작됐어요.', '전두환 정부는 간선제를 유지하려 했어요. 박종철 사건과 이를 은폐한 사실, 4·13 호헌 조치, 이한열의 최루탄 피격이 시민의 저항을 키웠어요.', '6월 민주 항쟁에 시민이 폭넓게 참여하자 6·29 선언을 통해 직선제 개헌 요구가 받아들여졌어요.'],flow:[{h:'1980 광주',i:'5·18 민주화 운동'},{h:'1987 시민 항쟁',i:'박종철 사건·호헌 조치·이한열 피격 → 6·10 국민 대회'},{h:'1987 제도 변화',i:'6·29 선언 → 대통령 직선제 개헌'}]},
    h25:{sum:'산업화는 생산·수출과 생활 수준을 끌어올렸지만 노동·농촌·도시·환경 문제도 키웠어요.',body:['1960년대에는 섬유·신발처럼 노동력이 많이 필요한 제품을, 1970년대에는 철강·조선처럼 큰 설비가 필요한 산업을 주로 육성했어요. 1980년대 후반에는 3저 호황이 성장을 도왔어요.', '도시로 인구가 몰리면서 주택·교통 문제가 생겼고, 농촌은 성장에서 소외되기도 했어요. 노동자와 농민, 공해 피해 주민은 각자의 문제를 해결하기 위해 행동했어요.', '가전과 대중 매체의 보급은 일상을 편리하고 다양하게 바꾸었어요. 영화 검열과 금지곡처럼 국가가 문화를 통제한 사례도 있어요.']},
    h26:{sum:'직선제 개헌 후 선거를 통한 정권 교체가 이루어지면서 정부와 시민 사회의 역할도 달라졌어요.',body:['세계적으로 냉전이 해체되자 국제 질서가 재편됐어요. 한국도 소련·중국 등과 외교 관계를 맺었어요.', '노태우 정부의 북방 외교, 김영삼 정부의 금융 실명제, 김대중 정부의 제1차 남북 정상 회담을 구별해 보세요. 노무현 정부 시기에는 제2차 정상 회담과 부산 APEC이 열렸어요.', '시민들은 여성, 노동, 복지, 환경 등 다양한 문제를 해결하기 위해 단체를 만들고 정책 변화에도 영향을 주었어요.']},
    h27:{sum:'1997년 외환 위기는 외화 조달이 어려워진 위기였고, 극복 과정은 고용과 사회 구조에도 영향을 주었어요.',body:['단기 외채를 갚을 시기가 왔는데 외국 자본이 빠져나가고 새로 외화를 빌리기 어려워지면 외화가 부족해져요. 1997년 정부는 IMF에 긴급 자금 지원을 요청했어요.', '구조 조정과 시민의 금 모으기 운동 등으로 위기를 극복했어요. 하지만 대량 해고와 비정규직 증가가 이어졌고 소득 격차도 확대됐어요.', '교과서 그래프는 조사 시점과 단위를 기준으로 읽어요. 경제 성장과 사회 양극화는 동시에 나타날 수 있어요. 외환 위기 이후 한국 사회에는 저출산·고령화와 다문화 사회로의 변화도 나타났어요.']},
    h28:{sum:'남북 관계는 대화와 긴장을 반복했고, 동아시아에서도 갈등을 해결하기 위한 여러 협력 활동이 이어졌어요.',body:['남북 합의는 먼저 연도와 핵심 내용을 짝지어요. 1972년에는 통일 원칙, 1991년에는 상호 체제 인정과 불가침, 2000년에는 첫 정상 회담을 떠올리면 구별하기 쉬워요.', '개성 공단과 금강산 관광은 경제 교류의 사례예요. 이산가족 상봉과 문화·스포츠 교류도 남북 주민의 만남에 기여했어요.', '동아시아 역사·영토 갈등을 공부할 때는 주장과 사료를 구별해요. 독도 사료를 볼 때는 누가 언제 어떤 내용으로 작성했는지 먼저 확인해요.']}

    choice('b','124~125',3,'대기업의 연쇄 부도가 외환 위기로 이어진 과정을 바르게 설명한 것은?', ['기업 부실이 금융 기관으로 번지자 외국 자본이 자금을 회수했고 외환 보유액이 줄었다.','정부가 국제 통화 기금 지원금을 조기 상환한 직후 기업 부채가 늘고 연쇄 부도가 시작됐다.','동남아시아 금융 위기로 외국 자금이 한국에 몰리면서 기업이 단기 외채를 상환하지 못했다.','구조 조정에 따른 정리 해고가 먼저 늘어나 금융 기관의 단기 외채가 처음 발생했다.','한국이 세계 금융 위기 때 수출이 줄자 1997년 구제 금융을 요청했다.'],0,'기업 부실과 단기 외채가 쌓인 상태에서 금융 기관에 대한 신뢰가 떨어져 외국 자본이 빠져나갔어요. 정리 해고와 지원금 조기 상환은 위기 뒤의 일이고 세계 금융 위기는 2008년이에요.'),
    fill('c','125',1,'1997년 외환이 부족해지자 한국 정부는 (　　)에 긴급 구제 금융을 요청했다.', ['국제통화기금','국제 통화 기금','IMF','국제통화기금(IMF)'], '외환 위기 당시 김영삼 정부가 IMF에 구제 금융을 요청했고, 김대중 정부가 위기 극복 정책을 추진했어요.'),
    choice('d','125~126',2,'외환 위기 대응과 그 과정의 사회적 영향을 올바르게 묶은 것은?', ['금융 실명제 도입 — 비정규직 고용 확대','공기업 민영화 — 외환 위기 발생 전부터 모든 업종의 고용 안정','노사정 위원회 발족 — 노동 시장에서 정리 해고 전면 금지','금융·기업 구조 조정 — 고용 불안과 소득 격차 확대','금 모으기 운동 — 산업 구조 조정의 필요성이 곧바로 사라짐'],3,'위기 극복 과정에서 금융·기업 구조 조정과 노동 시장 유연화가 추진됐고 대량 해고와 비정규직 증가가 나타났어요. 금융 실명제는 외환 위기보다 앞서 시행됐어요.'),
    match('e','124~129',2,'경제·사회 용어와 설명을 짝지어 보세요.', [['신자유주의','시장 개방과 민간 중심의 자유 경제를 강조'],['금 모으기 운동','외환 위기 극복을 위한 시민들의 참여'],['사회 양극화','계층·지역·기업 등 여러 영역에서 격차가 심화'],['다문화 사회','다양한 언어·문화적 배경을 가진 구성원이 함께 살아감']], '교과서에서 각 용어가 가리키는 시대 배경이나 사회 문제를 구별해요.'),
    choice('f','126',3,'표와 같이 소득 계층 비율이 변했다. 자료를 올바르게 해석한 것은?', ['중산층 비율이 높아지고 빈곤층 비율은 낮아졌다.','비율 변화만으로 모든 가구의 실질 소득이 줄었음을 알 수 있다.','중산층 비율이 낮아지고 빈곤층과 상류층 비율이 모두 높아졌다.','외환 위기 뒤 상류층 인구가 감소했다는 뜻이다.','모든 계층의 비율이 같아졌다.'],2,'이 그래프에서는 중산층의 비율이 줄고 빈곤층과 상류층의 비율이 모두 늘었어요. 계층 비율만으로 개별 가구의 소득 변화는 알 수 없어요.',['1996년: 빈곤층 11.25%, 중산층 68.45%, 상류층 20.30%','2006년: 빈곤층 17.94%, 중산층 58.47%, 상류층 23.59%']),
    ox('g','127',1,'우리나라는 칠레를 시작으로 여러 나라와 자유 무역 협정을 맺어 수출 시장을 넓혔다.',0,'2004년 칠레와의 FTA를 시작으로 여러 나라와 FTA를 맺었어요. 동시에 대외 무역 의존도가 높은 경제는 세계 경기 변동의 영향도 받았어요.'),
    choice('h','128~129',2,'교과서가 설명하는 외환 위기 이후 한국 사회의 변화로 옳은 것은?', ['출산율이 높아지고 고령 인구 비중이 크게 줄었다.','수도권과 농촌의 의료·교육 격차가 완전히 해소됐다.','외국인 노동자와 국제결혼 가정이 줄어 문화적 배경이 더욱 단일해졌다.','정규직과 비정규직의 임금 차이는 교과서 그래프의 모든 기간에서 감소했다.','양육 부담과 가치관의 변화 속에 저출산이 이어지고 평균 수명 증가로 고령화가 진행됐다.'],4,'출산율 저하와 고령 인구 비중 증가는 함께 나타날 수 있어요. 외국인 노동자와 다문화 가정이 증가하는 변화도 있었어요.'),
    choice('i','130~131',1,'교과서에서 소개한 21세기 대한민국의 국제적 변화로 적절한 것은?', ['대중문화 수출이 1990년대 이후 완전히 중단됐다.','드라마·음악·영화 등 한류가 확산되고 첨단 기술과 스포츠 분야에서도 역량을 보였다.','국제 스포츠 대회를 개최한 사례가 없었다.','첨단 제조 기술은 정보 사회의 변화와 관련이 없었다.','한국 드라마와 음악은 국내에서만 유통됐다.'],1,'교과서는 한류와 국제 스포츠, 반도체·배터리·우주 항공 등의 발전을 21세기 국제적 위상의 사례로 들어요.'),
    essay('j','124~126',3,'외환 위기의 원인과 극복 과정에서 나타난 사회 문제를 연결해 설명해 보세요.', '단기 외채와 기업 부실이 쌓인 가운데 외국 자본이 빠져나가 외화가 부족했다. 정부가 위기를 극복하려 기업·금융 구조 조정과 노동 시장 유연화를 추진하는 과정에서 대량 해고와 비정규직 증가가 나타나 고용 불안과 소득 격차가 커졌다.', ['단기 외채 또는 기업 부실','외국 자본 회수·외환 부족','구조 조정 또는 노동 시장 유연화','대량 해고·비정규직·양극화 중 하나'])
  ]);

    choice('i','142~143',1,'울도군의 관할 구역에 석도를 포함한 대한 제국의 문서는?', ['태정관 지령','연합국 최고 사령관 각서 제677호','인접 해양에 대한 주권에 관한 선언','포츠담 선언','칙령 제41호'],4,'1900년 대한 제국 칙령 제41호는 울도군의 관할에 석도를 명시했어요. 태정관 지령은 일본, 각서 제677호는 연합국 최고 사령관이 발표한 문서예요.'),
    match('j','142~143',3,'독도 관련 자료와 그 내용을 연결해 보세요.', [['『삼국사기』 지증왕 기사','이사부가 우산국을 복속했다는 기록'],['태정관 지령','울릉도와 독도가 일본과 관계없다고 명시한 문서'],['대한 제국 칙령 제41호','울도군 관할에 석도를 명시'],['인접 해양에 대한 주권에 관한 선언','평화선을 설정해 독도를 그 안에 포함']], '독도 관련 근거는 기록의 시기와 작성 주체를 같이 확인해요. 태정관 지령은 1877년, 칙령 제41호는 1900년, 평화선 설정은 1952년이에요.'),
    essay('k','134~135',3,'7·4 남북 공동 성명과 남북 기본 합의서에서 각각 무엇을 합의했는지 구별해서 설명해 보세요.', '1972년 7·4 남북 공동 성명은 통일의 원칙으로 자주·평화·민족적 대단결에 합의했다. 1991년 남북 기본 합의서는 남북이 서로의 체제를 인정·존중하고 상대방을 무력으로 침해하지 않는다는 데 합의했다.', ['1972년의 자주·평화·민족적 대단결','1991년의 상호 체제 인정·존중','불가침'])

  add('h21', [
    fill('01','70',1,'제1차 미소 공동 위원회가 휴회한 뒤 이승만이 남한에 먼저 임시 정부를 세우자고 주장한 발언은 (　　)이다.', ['정읍 발언'], '이승만은 1946년 전북 정읍에서 남한에 먼저 임시 정부를 세우자고 주장했어요. 통일 정부를 추구한 좌우 합작 운동과 구분해요.'),
    choice('02','73~74',1,'제헌 국회가 선출한 대한민국 초대 대통령과 부통령은?', ['윤보선·장면','이승만·이시영','이승만·이기붕','김구·김규식','이승만·장면'],1,'제헌 국회는 초대 대통령 이승만과 부통령 이시영을 선출했어요. 장면은 1956년에 부통령으로 당선됐고, 이후 장면 내각에서는 국무총리였어요.'),
    choice('03','70',2,'제1차 미소 공동 위원회가 휴회하게 된 직접적 쟁점은?', ['임시 민주 정부 수립을 협의할 단체의 범위','유엔 한국 임시 위원단의 북한 방문 허용 여부','국회에서 대통령을 뽑을지 국민이 직접 뽑을지 여부','북한 토지 개혁에서 무상 분배를 할지 여부','좌우 합작 위원회가 발표한 토지 개혁안의 시행 여부'],0,'미국은 신탁 통치 반대 단체도 협의에 포함하려 했고, 소련은 모스크바 3국 외상 회의 결정을 지지하는 단체로 한정하려 했어요. 유엔 위원단의 입북 거부는 그 뒤의 문제예요.'),
    match('04','68~71',2,'각 주장과 관련된 움직임을 연결해 보세요.', [['최대 5년의 신탁 통치 협의','모스크바 3국 외상 회의'],['미소 공동 위원회 속개와 유상 매입·무상 분배','좌우 합작 7원칙'],['외국 군대 철수와 남한 단독 선거 반대','남북 협상'],['남한에 먼저 임시 정부 수립','이승만의 정읍 발언']], '좌우 합작 7원칙은 좌우 세력 사이의 합의를 모색했고, 남북 협상은 단독 선거에 반대하며 평양에서 열렸어요.'),
    choice('05','73~74',2,'1948년 5·10 총선거에서 유권자가 직접 뽑은 사람은?', ['초대 대통령','초대 부통령','제헌 국회 의원','제헌 국회 의장','초대 국무총리'],2,'5·10 총선거에서는 헌법을 만들 국회의원을 뽑았어요. 첫 정·부통령은 그 뒤 제헌 국회에서 간접 선거로 선출했어요.'),
    choice('06','70~77',3,'자료 A, B, C의 설명에 각각 해당하는 토지 개혁을 바르게 연결한 것은?', ['좌우 합작 7원칙 → 북한의 토지 개혁 → 대한민국의 농지 개혁','좌우 합작 7원칙 → 대한민국의 농지 개혁 → 북한의 토지 개혁','대한민국의 농지 개혁 → 북한의 토지 개혁 → 좌우 합작 7원칙','북한의 토지 개혁 → 좌우 합작 7원칙 → 대한민국의 농지 개혁','대한민국의 농지 개혁 → 좌우 합작 7원칙 → 북한의 토지 개혁'],0,'좌우 합작 7원칙은 유상 매입·무상 분배 방안을 제시했어요. 북한은 무상 몰수·무상 분배, 대한민국은 경자유전 원칙에 따른 유상 매수·유상 분배를 시행했어요.',['A: 땅을 값을 주고 사들여 농민에게 무상으로 나눌 것을 제안했다.','B: 토지를 무상으로 몰수하여 농민에게 무상으로 분배했다.','C: 지주에게 지가 증권을 지급하고 농민에게 유상으로 분배했다.']),
    order('07','69~73',3,'통일 정부 논의에서 남한 총선거로 이어진 사건을 이른 것부터 배열해 보세요.', ['모스크바 3국 외상 회의','제1차 미소 공동 위원회 휴회','좌우 합작 7원칙 발표','유엔 소총회가 접근 가능한 지역의 총선거 결의','김구·김규식의 남북 협상 참여','5·10 총선거'], '1945년 모스크바 회의 뒤 1946년의 미소 공동 위원회와 좌우 합작이 이어졌어요. 1948년 2월 유엔 소총회의 결정 뒤, 4월 남북 협상과 5월 총선거가 이어졌어요.'),
    essay('08','75~77',3,'친일 반민족 행위 청산을 위해 만든 기구를 쓰고, 이 기구의 활동을 제약한 사건 한 가지와 제도 변화 한 가지를 설명해 보세요.', '제헌 국회는 반민족 행위 특별 조사 위원회(반민 특위)를 구성했다. 경찰의 반민 특위 사무실 습격으로 조사 활동이 방해됐고, 반민법 개정으로 공소 시효가 단축되어 처벌을 추진하기 어려워졌다.', ['반민족 행위 특별 조사 위원회 또는 반민 특위','경찰의 습격 또는 국회 프락치 사건','반민법 공소 시효 단축']),
    statements('09','73~77','제헌 국회와 정부 수립 이후의 정책에 대해 옳은 설명을 모두 고르세요.', [
      '5·10 총선거에서 유권자는 제헌 국회 의원을 선출했다.',
      '제헌 국회는 정·부통령을 간접 선거로 선출했다.',
      '제헌 국회가 제정한 반민족 행위 처벌법을 근거로 반민 특위가 구성됐다.',
      '대한민국 농지 개혁은 유상 매수·유상 분배로 이루어졌다.'
    ], [
      '5·10 총선거와 같은 날 유권자는 대통령도 직접 선출했다.',
      '제헌 국회는 대한민국 정부가 수립된 뒤에 처음 구성됐다.',
      '대한민국 농지 개혁은 북조선 임시 인민 위원회의 무상 몰수·무상 분배 방식을 따랐다.',
      '경찰이 반민 특위를 습격한 사건 뒤 반민법의 공소 시효가 늘어났다.'
    ], '총선으로 제헌 국회를 구성한 뒤 헌법을 제정하고 정·부통령을 선출했어요. 반민 특위는 정부와 경찰의 방해로 활동이 제약됐고, 공소 시효는 오히려 줄었어요. 남북의 토지 개혁 방식은 매수·분배의 유상 여부를 비교해요.')
  ], '판서 2~5쪽');

  add('h22', [
    fill('01','79',1,'중국군의 참전 이후 국군과 유엔군이 1951년 1월에 서울에서 물러난 일을 (　　)라고 한다.', ['1·4 후퇴','1월 4일 후퇴','일사 후퇴'], '중국군 참전으로 전세가 바뀌며 국군과 유엔군이 서울에서 물러났어요. 1950년 인천 상륙 작전 직후에는 서울을 수복했어요.'),
    fill('02','83',1,'평화 통일을 주장하고 진보당을 이끌다가 이승만 정부 시기에 처형된 정치인은 (　　)이다.', ['조봉암'], '조봉암은 1956년 대선에 출마했으며 진보당을 이끌었어요. 같은 선거에서 부통령에 당선된 야당 인물은 장면이에요.'),
    choice('03','79~80',2,'정전 회담이 길어지는 데 영향을 준 주요 논쟁은?', ['군사 분계선 설정과 포로 송환 방식','38도선 설치 제안과 미·소 군정의 기간','당선인 결정 방식과 국회 의원 임기','한미 상호 방위 조약의 비준과 일본의 참전','제헌 헌법 공포와 한반도 유엔 가입'],0,'정전 회담의 쟁점은 전투를 멈출 군사 분계선과 포로를 돌려보낼 방식이었어요. 한미 상호 방위 조약은 정전 협정 뒤에 맺었어요.'),
    match('04','80~85',2,'전쟁 이후 나타난 변화와 나라를 짝지어 보세요.', [['대한민국','한미 상호 방위 조약 체결'],['북한','농업·상공업의 협동조합화'],['일본','전쟁에 필요한 물자 수요로 경제 회복'],['중국','참전 이후 북한에 대한 영향력 확대']], '전쟁이 끝난 뒤 미군은 한국에 계속 주둔했고, 중국의 대북 영향력도 커졌어요. 일본 경제는 전쟁 특수의 영향을 받았어요.'),
    choice('05','82~83',2,'1952년 발췌 개헌 때 이승만 정부가 개헌안을 통과시키는 데 사용한 방법은?', ['초대 대통령의 중임 제한을 없애고 표결 수를 사사오입했다.','부산에 계엄령을 선포하고 국회에서 기립 투표로 통과시켰다.','국회를 해산하고 비상 국무 회의에서 개헌안을 의결했다.','직선제 개헌 논의를 금지하는 호헌 조치를 발표했다.','통일 주체 국민 회의가 새 헌법안을 작성했다.'],1,'발췌 개헌은 전쟁 중 임시 수도 부산에서 계엄과 국회 압박 속에 기립 투표로 통과됐어요. 사사오입 논리는 1954년 개헌 때 사용됐어요.'),
    choice('06','78~80',3,'자료 A가 벌어진 뒤, 자료 B가 벌어지기 전에 나타난 사건은?', ['인천 상륙 작전이 성공했다.','낙동강 방어선을 구축했다.','이승만 정부가 반공 포로를 석방했다.','한미 상호 방위 조약을 체결했다.','북한군이 38도선을 넘어 남침했다.'],2,'A는 중국군 참전 후의 1·4 후퇴, B는 1953년 7월의 정전 협정이에요. 이승만 정부의 반공 포로 석방은 정전 회담이 진행되던 1953년 6월에 있었어요.',['A: 중국군의 공세로 국군과 유엔군은 서울을 내주었다.','B: 유엔군·북한군·중국군 대표가 정전 협정에 서명했다.']),
    choice('07','82~84',3,'자료의 개헌과 이후의 정치 전개를 바르게 연결한 것은?', ['발췌 개헌 → 이승만이 간접 선거로 초대 대통령 당선','사사오입 개헌 → 이승만이 1956년 대선에 출마해 3대 대통령 당선','발췌 개헌 → 모든 대통령의 중임 제한 폐지','유신 헌법 → 조봉암이 제3대 대통령 선거에 출마','사사오입 개헌 → 국회가 대통령을 다시 간접 선출'],1,'자료는 1954년 사사오입 개헌이에요. 초대 대통령인 이승만만 중임 제한을 적용받지 않아 1956년 대선에 다시 출마할 수 있었어요.',['초대 대통령에게는 대통령 중임 제한 규정을 적용하지 않는다.']),
    essay('08','82~83',3,'발췌 개헌을 이승만이 추진한 이유와 사사오입 개헌이 장기 집권에 유리했던 이유를 각각 설명해 보세요.', '자신을 지지하지 않는 국회 의원이 많아 국회에서 재선되기 어렵자 이승만은 발췌 개헌으로 대통령 직선제를 도입했다. 사사오입 개헌은 초대 대통령의 중임 제한을 없애 이승만이 다시 출마할 수 있게 했다.', ['국회에서의 재선 어려움','발췌 개헌의 대통령 직선제','사사오입 개헌의 초대 대통령 중임 제한 제외'])
  ], '판서 6~7쪽');

  add('h23', [
    fill('01','90',1,'1964년 학생과 시민이 굴욕적인 한일 회담에 반대해 벌인 대규모 시위를 (　　)라고 한다.', ['6·3 시위','6·3 항쟁','육삼 시위','육삼 항쟁'], '1964년 6·3 시위는 한일 회담에 반대했어요. 한일 협정은 그 다음 해인 1965년에 체결됐어요.'),
    fill('02','92',1,'유신 헌법 아래에서 대통령을 간접 선출한 기구는 (　　)이다.', ['통일 주체 국민 회의'], '통일 주체 국민 회의가 임기 6년의 대통령을 뽑았어요. 국가 재건 최고 회의는 5·16 군사 정변 세력이 만든 기구예요.'),
    choice('03','86~88',2,'자료의 시점과 이승만 하야 사이에 있었던 일은?', ['허정 과도 정부가 출범했다.','민주당이 총선거에서 압승했다.','대학교수들이 시위를 벌여 대통령의 퇴진을 요구했다.','내각 책임제 개헌으로 양원제 국회가 도입됐다.','윤보선이 대통령으로 선출됐다.'],2,'4월 19일 대규모 시위와 발포 뒤 25일 대학교수들의 시위가 이어졌고 이승만은 26일 하야 성명을 발표했어요. 허정 과도 정부와 내각 책임제 개헌은 그 뒤예요.',['1960년 4월 19일, 경무대 방향으로 향한 시위대에 경찰이 발포했고 정부는 비상계엄을 선포했다.']),
    match('04','88~92',2,'정치 체제의 변화와 그 내용을 연결해 보세요.', [['4·19 혁명 이후 개헌','내각 책임제와 양원제 국회'],['5·16 군사 정변 직후','국가 재건 최고 회의가 입법·사법·행정권 장악'],['1969년 3선 개헌','대통령의 세 번째 임기를 허용'],['1972년 유신 헌법','6년 임기와 중임 제한 폐지']], '3선 개헌은 대통령의 세 번째 임기를 허용했어요. 유신 헌법은 간접 선거로 바꾸고 중임 제한 자체를 없앴어요.'),
    choice('05','92~93',2,'다음 사건이 일어난 뒤 부산과 마산에서 이어진 일은?', ['긴급 조치 1호가 처음 발표됐다.','개헌 청원 100만 인 서명 운동이 시작됐다.','6·3 시위가 일어났다.','유신 체제에 반대하는 부마 민주 항쟁이 일어났다.','3·1 민주 구국 선언이 발표됐다.'],3,'YH 무역 사건 뒤 신민당 총재 김영삼이 국회에서 제명됐고, 1979년 부산과 마산에서 부마 민주 항쟁이 일어났어요. 3·1 민주 구국 선언은 1976년이에요.',['YH 무역 노동자 농성에 대한 강제 진압을 비판한 신민당 총재 김영삼이 국회 의원직에서 제명되었다.']),
    choice('06','92',3,'자료의 조항이 각각 약화한 민주 정치 원리를 올바르게 연결한 것은?', ['A — 권력 분립, B — 국민의 기본권 보장','A — 국민의 기본권 보장, B — 지방 자치','A — 정당 간 경쟁, B — 권력 분립','A — 양원제, B — 대통령 직선제','A — 보통 선거, B — 국가 간 불가침'],0,'국회 의원 추천과 국회 해산 권한은 국민 대표 기관을 대통령의 영향 아래 두어 권력 분립을 약화했어요. 긴급 조치권은 국민의 자유와 권리를 제한하는 데 사용됐어요.',['A: 대통령에게 국회 의원 3분의 1 추천권과 국회 해산권을 부여한다.','B: 대통령에게 국민의 자유와 권리를 잠정 제한할 수 있는 긴급 조치권을 부여한다.']),
    order('07','92~93',3,'유신 체제 전후의 사건을 이른 것부터 배열해 보세요.', ['7·4 남북 공동 성명 발표','10월 유신 단행','김대중 납치 사건','3·1 민주 구국 선언','부마 민주 항쟁','10·26 사태'], '남북 공동 성명은 1972년 7월, 유신은 같은 해 10월이에요. 1973년 김대중 납치와 1976년 3·1 선언 이후, 1979년 10월에 부마 민주 항쟁과 10·26 사태가 이어졌어요.'),
    essay('08','90~91',3,'한일 협정과 베트남 파병이 각각 박정희 정부의 경제 개발과 어떻게 연결됐는지 한 가지씩 설명해 보세요.', '한일 협정 체결로 국교를 정상화하며 일본으로부터 자금을 확보해 경제 개발에 사용했다. 베트남 파병은 미국의 경제·군사 지원과 한국 기업의 해외 진출 및 수출 확대의 계기가 되었다.', ['한일 협정과 경제 개발 자금 확보','베트남 파병과 미국의 지원 또는 기업 진출·수출 확대']),
    statements('09','90~93','박정희 정부의 장기 집권과 유신 반대 운동에 대해 옳은 설명을 모두 고르세요.', [
      '1969년 3선 개헌은 대통령이 세 번째 임기를 맡을 수 있게 했다.',
      '유신 헌법은 대통령의 임기를 6년으로 정하고 중임 제한을 두지 않았다.',
      '개헌 청원 100만 인 서명 운동은 유신 체제에 대한 저항이었다.',
      'YH 무역 사건 이후 김영삼이 국회 의원직에서 제명됐고, 이어 부마 민주 항쟁이 일어났다.'
    ], [
      '3선 개헌으로 대통령을 통일 주체 국민 회의에서 선출하게 됐다.',
      '유신 헌법은 국회 의원 3분의 1을 추천할 수 있는 대통령의 권한을 없앴다.',
      '3·1 민주 구국 선언은 10월 유신 직전에 유신 헌법 제정을 지지하며 발표됐다.',
      '부마 민주 항쟁 뒤 박정희 정부가 유신 헌법을 처음 제정했다.'
    ], '3선 개헌과 유신 헌법의 선출 방식과 중임 규정은 구별해야 해요. 1972년 유신 이후 서명 운동과 1976년 3·1 민주 구국 선언이 있었고, 1979년 부마 민주 항쟁과 10·26 사태가 이어졌어요.')
  ], '판서 8~10쪽');

  add('h24', [
    fill('01','94',1,'12·12 사태 이후 대학생과 시민이 계엄 철폐와 민주화를 요구한 1980년 봄을 (　　)이라고 한다.', ['서울의 봄'], '학생들은 서울역 등에서 비상계엄 해제와 신군부 퇴진을 요구했어요. 신군부는 5월 17일 비상계엄을 전국으로 확대했어요.'),
    fill('02','97',1,'신군부가 사회 정화를 내세워 많은 민간인을 강제로 끌고 가 군사 훈련과 강제 노역을 시킨 곳은 (　　)이다.', ['삼청 교육대'], '삼청 교육대 운영 과정에서 인권이 침해됐어요. 보도 지침은 같은 시기 언론을 통제하는 데 사용됐어요.'),
    choice('03','97',2,'전두환 정부의 정책을 성격에 맞게 짝지은 것은?', ['유화책 — 보도 지침 / 억압 정책 — 교복 자율화','유화책 — 삼청 교육대 / 억압 정책 — 과외 금지','유화책 — 4·13 호헌 조치 / 억압 정책 — 프로 야구 출범','유화책 — 야간 통행금지 폐지 / 억압 정책 — 보도 지침','유화책 — 언론 통폐합 / 억압 정책 — 두발 자율화'],3,'야간 통행금지 폐지, 두발·교복 자율화, 프로 야구 출범은 유화책이었어요. 언론 통폐합과 보도 지침은 언론을 통제했어요.'),
    choice('04','97~98',2,'4·13 호헌 조치에 맞서 6월 민주 항쟁에 참여한 시민이 요구한 것은?', ['유신 헌법 아래의 대통령 선출 방식 유지','대통령 직선제 개헌과 호헌 조치 철회','제헌 국회에서 대통령을 직접 뽑을 것','국가 보위 비상 대책 위원회의 설치','대통령 임기 7년으로 연장'],1,'4·13 호헌 조치는 당시의 간선제 헌법을 유지하겠다는 발표였어요. 시위에서 시민은 호헌 철폐와 대통령 직선제 개헌을 요구했어요.'),
    match('05','94~98',2,'신군부 집권과 민주화 과정의 사건을 그 내용과 연결해 보세요.', [['12·12 사태','신군부가 군사권 장악'],['5·17 비상계엄 전국 확대','정치 활동 금지와 대학 휴교'],['4·13 호헌 조치','기존 대통령 선출 방식 유지 방침'],['6·29 선언','대통령 직선제 개헌 요구 수용']], '신군부가 군사권을 장악한 것은 1979년이고, 비상계엄의 전국 확대는 1980년이에요. 1987년의 호헌 조치와 6·29 선언은 직선제 수용 여부가 달라요.'),
    choice('06','94~98',3,'A와 B의 민주화 운동 이후 결과를 올바르게 비교한 것은?', ['A에서는 직선제 개헌이 되고, B에서는 7년 단임 간선제가 정착됐다.','A는 계엄군에 의해 진압됐고, B는 직선제 개헌 요구 수용으로 이어졌다.','A에서는 내각 책임제 개헌이 되고, B 직후 신군부가 군사권을 장악했다.','A와 B 모두 시위 직후 대통령 직선제 개헌을 이뤄 냈다.','A는 6·29 선언으로 마무리됐고, B는 국가 보위 비상 대책 위원회 설치로 이어졌다.'],1,'A는 1980년 5·18 민주화 운동, B는 1987년 6월 민주 항쟁이에요. 5·18은 진압됐지만 이후 민주화 운동의 토대가 됐고, 6월 항쟁은 6·29 선언으로 이어졌어요.',['A: 계엄군의 폭력적 진압에 맞서 광주 시민들이 시위를 이어 갔다.','B: 고문 치사 은폐와 호헌 조치에 항의하는 전국적 시위가 벌어졌다.']),
    order('07','97~98',3,'1987년 민주화 과정의 주요 사건을 이른 것부터 배열해 보세요.', ['박종철 고문 치사 사건 발생','4·13 호헌 조치 발표','민주 헌법 쟁취 국민운동 본부 결성','이한열 최루탄 피격','6·10 국민 대회 개최','6·29 선언 발표'], '사건 발생은 1월, 호헌 조치는 4월, 국민운동 본부 결성은 5월이에요. 6월 9일 이한열이 최루탄에 맞았고, 10일 국민 대회와 29일 선언으로 이어졌어요.'),
    essay('08','97~98',3,'1980년 개헌과 6월 민주 항쟁 이후 개헌을 대통령 선출 방식과 임기로 비교해 보세요.', '1980년 개헌에서는 대통령을 간접 선거로 선출하고 임기를 7년 단임으로 정했다. 6월 민주 항쟁 이후 1987년 개헌에서는 국민이 대통령을 직접 선출하고 임기를 5년 단임으로 정했다.', ['1980년 7년 단임','대통령 간선제','1987년 5년 단임','대통령 직선제']),
    statements('09','94~98','5·18 민주화 운동과 6월 민주 항쟁에 대해 옳은 설명을 모두 고르세요.', [
      '신군부는 12·12 사태 이후 군사권을 장악하고 1980년 5월 비상계엄을 전국으로 확대했다.',
      '광주 시민은 봉쇄 속에서 시민 수습 대책 위원회를 꾸려 평화적 해결을 모색했다.',
      '4·13 호헌 조치는 대통령 간선제 헌법을 유지하겠다는 발표였다.',
      '6·29 선언 이후 대통령 직선제와 5년 단임을 규정한 개헌이 이루어졌다.'
    ], [
      '국가 보위 비상 대책 위원회는 1987년 6월 민주 항쟁 뒤 설치됐다.',
      '광주의 5·18 민주화 운동은 대통령 직선제 수용을 담은 6·29 선언으로 마무리됐다.',
      '민주 헌법 쟁취 국민운동 본부는 6·10 국민 대회가 끝난 뒤 결성됐다.',
      '6월 민주 항쟁 뒤 개헌은 임기 7년의 대통령 간선제를 처음 도입했다.'
    ], '1980년에는 5·18 민주화 운동이 무력으로 진압됐고 신군부의 집권이 이어졌어요. 1987년에는 호헌 조치에 대한 반발, 국민운동 본부 결성, 6·10 국민 대회와 6·29 선언이 차례로 이어졌어요.')
  ], '판서 11~12쪽');

  add('h25', [
    fill('01','100',1,'저임금 노동력을 활용하여 신발·의류·가발 등의 수출을 늘린 1960년대 산업을 (　　) 산업이라고 한다.', ['노동 집약적','노동 집약형','노동 집약'], '제1·2차 경제 개발 5개년 계획 시기에는 노동 집약적인 경공업이 수출을 주도했어요. 철강·조선은 1970년대 중화학 공업 육성의 대표 분야예요.'),
    fill('02','107',1,'일류 중학교 진학 경쟁을 줄이기 위해 1969년부터 시행한 제도는 중학교 (　　)이다.', ['무시험 추첨제','무시험 진학 제도','무시험 추첨','무시험제'], '중학교 무시험 추첨제는 입학시험 없이 추첨으로 중학교에 배정하는 제도였어요. 고교 평준화는 뒤에 추진됐어요.'),
    choice('03','101',2,'두 차례 석유 파동의 영향을 바르게 비교한 것은?', ['1차 때 중동 건설 진출로 대응했고, 2차 때 중화학 공업 과잉 투자 문제가 겹쳤다.','1차 때 과잉 투자로 성장률이 떨어졌고, 2차 때 베트남 파병으로 대응했다.','1차 때 3저 호황이 시작됐고, 2차 때 경부 고속 국도를 건설했다.','1차와 2차 모두 정부가 경공업 지원을 처음 시작하는 계기가 됐다.','1차와 2차 모두 저유가에 힘입어 원유 수입 부담이 줄었다.'],0,'1차 석유 파동 때는 중동 건설 시장에 진출해 외화를 벌었어요. 2차 때는 중화학 공업의 과잉·중복 투자까지 겹치며 위기가 커졌어요.'),
    choice('04','103~104',2,'두 사건에서 주민이 문제 삼은 정책을 바르게 비교한 것은?', ['A는 대규모 공단의 공해, B는 무시험 추첨제 도입','A는 저곡가 정책, B는 산업 단지의 공해','A는 근로 기준법 미준수, B는 야간 통행금지','A는 철거민 이주 이후의 열악한 정착 여건, B는 농산물 수매 약속 불이행','A는 농산물 수매 약속 불이행, B는 철거민 강제 이주'],3,'광주 대단지 사건은 서울에서 집단 이주한 철거민의 주거와 생계 문제였어요. 함평 고구마 사건에서는 약속한 수매가 이루어지지 않아 농민들이 피해 보상을 요구했어요.',['A: 광주 대단지 사건','B: 함평 고구마 사건']),
    match('05','104~108',2,'산업화 시기의 사회 변화와 관련 개념을 연결해 보세요.', [['농촌 생활 환경 개선','새마을 운동'],['노동자의 근로 기준법 준수 요구','전태일 분신 사건'],['공업 단지 주변의 주민 건강 피해','온산병 사태'],['쌀 부족에 대한 정부의 대응','혼식·분식 장려']], '새마을 운동과 혼분식 장려는 정부 정책이에요. 전태일 사건은 열악한 노동 환경을, 온산병은 산업 공해 피해를 드러냈어요.'),
    choice('06','100~102',3,'자료 A와 B의 산업화 조건에 대한 설명으로 옳은 것은?', ['A 시기에 제1·2차 계획을 시작했으며 B 시기에 석유 파동이 처음 발생했다.','A 시기는 중화학 공업 육성 정책과 관련되고 B 시기는 3저 호황과 관련된다.','A 시기는 3저 호황의 결과이고 B 시기는 삼백 산업이 성장한 시기다.','A 시기의 수출 확대는 혼분식 장려의 결과였고 B 시기의 경제는 저곡가가 주도했다.','A와 B 모두 1960년대 경공업 중심 전략만으로 설명할 수 있다.'],1,'1970년대에는 정부가 철강·화학·기계·조선을 집중 육성했어요. 1980년대 후반에는 저달러·저유가·저금리로 수출과 성장에 유리한 환경이 조성됐어요.',['A: 포항·울산 등지에 철강과 조선 같은 산업의 대규모 공업 단지가 조성됐다.','B: 달러 가치, 원유 가격, 국제 금리가 낮아 수출과 투자에 유리한 조건이 만들어졌다.']),
    order('07','100~105',3,'산업화 시기의 정책과 사건을 이른 것부터 배열해 보세요.', ['제1차 경제 개발 5개년 계획 시작','광주 대단지 사건','수출 100억 달러 달성','한국 공해 문제 연구소 설립','온산병 사태 공론화'], '제1차 계획은 1962년, 광주 대단지 사건은 1971년, 수출 100억 달러는 1977년이에요. 한국 공해 문제 연구소는 1982년에 설립됐고 온산병은 1985년에 공론화됐어요.'),
    essay('08','103~105',3,'산업화 때 도시나 농촌에서 나타난 문제 한 가지를 원인과 함께 설명하고, 노동이나 환경 분야에서 그 문제와 구별되는 대응 사례를 쓰세요.', '일자리를 찾아 농촌 인구가 도시로 빠르게 이동하면서 주거가 부족해 도시 빈민이 늘어났다. 환경 분야에서는 한국 공해 문제 연구소가 공해 피해를 조사하고 반공해 운동을 전개했다.', ['도시 주거난 또는 농촌의 소외','도시 인구 유입 또는 저곡가 정책 등 원인','전태일의 근로 기준법 준수 요구 또는 한국 공해 문제 연구소 등의 대응'])
  ], '판서 13쪽 · 학습지 13~15쪽');

  add('h26', [
    fill('01','116',1,'노태우 정부가 여소야대 정국에서 두 야당과 3당 합당을 하여 만든 정당은 (　　)이다.', ['민주 자유당','민자당'], '민주정의당·통일민주당·신민주공화당이 합당하여 민주 자유당이 됐어요. 1987년 대선에서 노태우의 소속 정당은 민주정의당이었어요.'),
    fill('02','117',1,'김대중 정부가 인권 보호와 차별 문제에 대응하기 위해 설치한 기구는 (　　)이다.', ['국가 인권 위원회','인권위'], '국가 인권 위원회와 의문사 진상 규명 위원회는 김대중 정부 시기에 설치됐어요. 금융 실명제는 김영삼 정부의 정책이에요.'),
    match('03','116~119',2,'정부와 주요 정책을 연결해 보세요.', [['노태우 정부','북방 외교와 공산권 국가와의 수교'],['김영삼 정부','역사 바로 세우기'],['김대중 정부','외환 위기 극복과 인권 기구 설치'],['노무현 정부','지방 분권과 세종시 건설 추진'],['이명박 정부','4대강 정비 사업']], '공산권 수교는 노태우 정부, 역사 바로 세우기는 김영삼 정부의 대표 정책이에요. 세종시 건설 추진과 4대강 사업의 정부를 구별해요.'),
    choice('04','114~115',2,'몰타 회담에서 선언한 내용으로 옳은 것은?', ['동·서독 정부가 즉시 통일 조약에 서명했다.','미국과 소련 정상이 냉전의 종식과 새로운 국제 질서를 선언했다.','유럽 국가들이 유럽 연합을 공식 출범시켰다.','미국과 중국 정상이 한·중 수교를 선언했다.','세계 무역 기구가 시장 개방을 합의했다.'],1,'1989년 몰타 회담에서 미국과 소련 정상이 냉전 종식을 선언했어요. 독일 통일과 소련 해체는 각각 1990년과 1991년이에요.'),
    choice('05','117~119',2,'다음 정부와 사건의 연결 중 옳은 것은?', ['김영삼 정부 — 제1차 남북 정상 회담','김대중 정부 — 금융 실명제를 처음 시행','노무현 정부 — 지방 자치제 전면 실시를 처음 추진','이명박 정부 — 4대강 정비 사업 추진','박근혜 정부 — 검찰·언론 개혁과 K-방역 추진'],3,'4대강 정비 사업은 이명박 정부가 추진했어요. 지방 자치제 전면 실시와 금융 실명제는 김영삼 정부, 제1차 남북 정상 회담은 김대중 정부 때예요.'),
    choice('06','116~117',3,'자료 A의 사건 이후, 자료 B의 사건 이전에 일어난 변화는?', ['3당 합당으로 민주 자유당이 창당되고 금융 실명제가 시행됐다.','4대강 정비 사업이 시작되고 세월호 참사가 발생했다.','제2차 남북 정상 회담이 열리고 한미 FTA가 발효됐다.','박근혜 대통령이 파면되고 문재인이 당선됐다.','국가 인권 위원회가 설치되고 제1차 남북 정상 회담이 열렸다.'],0,'A는 1988년 총선 뒤 상황, B는 1997년 대선이에요. 1990년 노태우 정부 때 3당 합당이 있었고, 1993년 김영삼 정부 때 금융 실명제가 시행됐어요.',['A: 총선에서 야당이 다수 의석을 얻어 여소야대 정국이 형성됐다.','B: 대통령 선거를 통해 야당 후보가 당선되어 최초의 평화적 여야 정권 교체가 이루어졌다.']),
    order('07','116~119',3,'각 정부에서 일어난 사건을 이른 것부터 배열해 보세요.', ['3당 합당과 민주 자유당 창당','금융 실명제 시행','제1차 남북 정상 회담','2005년 부산 APEC 정상 회의','2010년 서울 G20 정상 회의','헌법 재판소의 박근혜 대통령 파면 결정'], '노태우 → 김영삼 → 김대중 → 노무현 → 이명박 → 박근혜 정부 순이에요. APEC 부산 정상 회의는 2005년, G20 서울 정상 회의는 2010년이에요.'),
    essay('08','116~117',3,'1987년 대선과 1997년 대선의 결과를 당선인과 여야 정권 교체 여부로 비교해 보세요.', '1987년 대선은 직선제 개헌 후 실시됐으며 여당 후보 노태우가 당선됐다. 1997년 대선에서는 야당 후보 김대중이 당선되어 정부 수립 이후 처음으로 선거를 통한 평화적 여야 정권 교체가 이루어졌다.', ['1987년 직선제 선거와 여당 노태우 당선','1997년 야당 김대중 당선','최초의 선거를 통한 평화적 여야 정권 교체']),
    statements('09','116~119','6월 민주 항쟁 이후 정부와 정책에 대해 옳은 설명을 모두 고르세요.', [
      '노태우 정부 시기 여소야대 정국에서 3당 합당으로 민주 자유당이 만들어졌다.',
      '김영삼 정부는 지방 자치제를 전면 실시하고 역사 바로 세우기를 추진했다.',
      '김대중 정부에서 외환 위기 극복을 추진했고 국가 인권 위원회가 설치됐다.',
      '노무현 정부는 지방 분권을 강조하고 행정 중심 복합 도시 건설을 추진했다.'
    ], [
      '노태우 정부가 금융 실명제를 처음 실시하고 지방 자치제를 전면 시행했다.',
      '김영삼 정부 출범으로 선거를 통한 최초의 여야 정권 교체가 이루어졌다.',
      '김대중 정부가 4대강 정비 사업을 추진하고 2010년 G20 서울 정상 회의를 열었다.',
      '노무현 정부가 제1차 남북 정상 회담을 열고 김대중 정부가 제2차 회담을 열었다.'
    ], '3당 합당은 노태우 정부, 금융 실명제와 지방 자치는 김영삼 정부예요. 첫 평화적 여야 정권 교체와 제1차 남북 정상 회담은 김대중 정부, 제2차 정상 회담과 세종시 추진은 노무현 정부에 해당해요.')
  ], '판서 14~15쪽');

  add('h27', [
    fill('01','124',1,'한국이 김영삼 정부 때인 1996년에 가입한 국제 경제 기구는 경제 협력 개발 기구, 약칭 (　　)이다.', ['OECD'], '한국은 1996년 OECD에 가입했어요. WTO는 1995년에 출범했고 IMF에는 1997년 구제 금융을 요청했어요.'),
    fill('02','125',1,'김대중 정부가 외환 위기를 극복하던 시기에 국민들이 외화 확보에 힘을 보태려고 금붙이를 내놓은 활동은 (　　) 운동이다.', ['금 모으기','금 모으기 운동'], '금 모으기 운동은 시민이 외환 위기 극복에 참여한 사례예요. 기업·금융 구조 조정과 노사정 위원회 출범은 정부가 추진한 대응이에요.'),
    match('03','124~127',2,'국제 경제 기구, 협정과 사건을 연결해 보세요.', [['세계 무역 기구(WTO)','1995년 출범한 국제 무역 질서 기구'],['경제 협력 개발 기구(OECD)','1996년 한국이 가입'],['국제 통화 기금(IMF)','1997년 한국이 긴급 금융 지원 요청'],['자유 무역 협정(FTA)','무역 장벽을 낮추기 위해 체결하는 협정']], 'WTO와 OECD는 각각 출범 연도와 한국 가입 연도를, IMF는 구제 금융 요청과 연결해요. FTA는 나라 또는 경제권 사이의 협정이에요.'),
    choice('04','125',2,'외환 위기 극복 과정에서 노동 시장에 직접 관련된 정책을 묶은 것은?', ['금융 실명제와 금융 규제 완화','지방 자치제 전면 실시와 공기업 민영화','정리 해고제 시행과 노사정 위원회 발족','금 모으기 운동과 칠레와의 FTA','세계 무역 기구 출범과 OECD 가입'],2,'정리 해고제와 노사정 위원회는 고용과 노동 조건에 관련돼요. 공기업 민영화도 위기 대응이지만, 금융 규제 완화와 OECD 가입은 이보다 앞선 김영삼 정부 시기의 흐름이에요.'),
    choice('05','127',2,'한국의 자유 무역 협정에 대한 설명으로 옳은 것은?', ['김영삼 정부 때 한·칠레 FTA가 발효됐다.','한미 FTA가 한·칠레 FTA보다 먼저 발효됐다.','자유 무역 협정을 맺은 목적은 수출을 막고 무역 장벽을 높이려는 것이었다.','2004년 한·칠레 FTA 발효를 시작으로 여러 국가와의 교역 기회를 넓혔다.','한·칠레 FTA는 IMF의 구제 금융 지원 협약이었다.'],3,'한·칠레 FTA는 노무현 정부 시기인 2004년에 발효됐어요. FTA는 무역 장벽을 낮추는 협정이고, IMF 지원 협약은 위기에 대응한 금융 조치예요.'),
    choice('06','124~125',3,'자료 A에서 B로 이어지는 과정의 인과 관계를 바르게 설명한 것은?', ['B가 기업의 차입을 처음 허용해 A가 나타났다.','A의 기업 부실과 해외 자금 회수가 외환 보유액 감소로 이어져 B가 이루어졌다.','A로 외국 자본이 늘어 외환 보유액이 증가했고 B는 수출 호황을 유지하려는 조치였다.','B의 지원금 조기 상환이 A의 외화 부족을 심화했다.','A로 저금리·저유가 호황이 찾아와 B에서 시장을 개방했다.'],1,'부실 기업과 금융 기관에 대한 신뢰가 떨어지며 외국 자금이 빠져나갔어요. 단기 외채를 갚기에 외화가 부족해지자 김영삼 정부가 IMF에 지원을 요청했어요.',['A: 단기 외채 증가와 기업 부실, 동남아시아의 금융 불안이 겹쳤다.','B: 한국이 국제 통화 기금에 긴급 구제 금융을 요청했다.']),
    order('07','124~127',3,'외환 위기 안팎의 경제 사건을 이른 것부터 배열해 보세요.', ['한국의 OECD 가입','김영삼 정부가 IMF에 긴급 지원 요청','금 모으기 운동 전개','IMF 자금 조기 상환','한·칠레 FTA 발효','미국에서 시작된 세계 금융 위기'], 'OECD 가입 1996년, IMF 지원 요청 1997년, 금 모으기 1998년, 조기 상환 2001년, 한·칠레 FTA 2004년, 세계 금융 위기 2008년 순이에요.'),
    essay('08','124~126',3,'외환 위기에서 김영삼 정부와 김대중 정부가 각각 한 조치를 설명하고, 위기 극복 과정에서 생긴 고용 문제를 하나 쓰세요.', '김영삼 정부는 외환 부족으로 IMF에 긴급 구제 금융을 요청했다. 김대중 정부는 금융 기관과 기업의 구조 조정 등을 추진했고, 그 과정에서 대량 해고와 비정규직 증가로 고용 안정성이 떨어졌다.', ['김영삼 정부의 IMF 구제 금융 요청','김대중 정부의 구조 조정 등 위기 대응','대량 해고 또는 비정규직 증가'])
  ], '판서 16쪽');

  add('h28', [
    fill('01','134',1,'1985년 북한의 수재 구호 물자 제공을 계기로 남북은 예술 공연단 교환과 함께 (　　)의 고향 방문을 실시했다.', ['이산가족','남북 이산가족'], '전두환 정부 때 이산가족 고향 방문과 예술 공연단 교환이 이루어졌어요. 제1차 남북 정상 회담 뒤에는 이산가족 상봉이 다시 이루어졌어요.'),
    choice('02','135',1,'2000년 제1차 남북 정상 회담에서 만난 남북 정상은?', ['김영삼·김일성','김대중·김정일','노태우·김정일','노무현·김정은','문재인·김정일'],1,'제1차 회담은 김대중과 김정일이, 제2차 회담은 노무현과 김정일이 만났어요. 2018년 판문점에서는 문재인과 김정은이 만났어요.'),
    choice('03','134~135',2,'남북 기본 합의서 채택과 같은 정부에서 이루어진 일은?', ['제1차 남북 정상 회담 개최','7·4 남북 공동 성명 발표','남북한 유엔 동시 가입','판문점 선언 발표','개성 공단 조성'],2,'남북한은 노태우 정부 시기인 1991년 9월에 유엔에 동시 가입했고, 같은 해 12월 남북 기본 합의서를 채택했어요. 개성 공단 조성은 노무현 정부 시기예요.'),
    match('04','134~136',2,'남북 교류나 합의의 사례와 정부를 연결해 보세요.', [['박정희 정부','7·4 남북 공동 성명'],['전두환 정부','이산가족 고향 방문·예술 공연단 교환'],['노태우 정부','남북 고위급 회담과 남북 기본 합의서'],['김대중 정부','금강산 관광 시작과 제1차 남북 정상 회담'],['노무현 정부','개성 공단 조성과 제2차 남북 정상 회담']], '박정희 정부 때 통일 3대 원칙에 합의했고, 노태우 정부 때 남북 정부 간 기본 합의서를 채택했어요. 두 차례 정상 회담은 김대중·노무현 정부 순이에요.'),
    choice('05','134~135',2,'자료를 발표할 때의 국제 정세와 남북 대화가 올바르게 연결된 것은?', ['냉전 완화 — 남북 적십자 회담 추진','냉전 해체 — 남북한 유엔 동시 가입','외환 위기 극복 — 금강산 관광 시작','평창 동계 올림픽 — 최초 북미 정상 회담','제2차 석유 파동 — 제2차 남북 정상 회담'],0,'자료는 1972년 7·4 남북 공동 성명이에요. 닉슨 독트린 이후 냉전이 완화됐고 남북 적십자 회담이 추진됐어요. 남북한 유엔 동시 가입은 냉전 해체 무렵인 1991년이에요.',['통일은 외세에 의존하지 않고 자주적으로, 무력 행사 없이 평화적으로 이루며 사상과 제도의 차이를 넘어 민족적 대단결을 도모한다.']),
    choice('06','134~136',3,'자료 A와 B를 발표한 회담 및 정부의 연결로 옳은 것은?', ['A — 제1차 정상 회담·김대중 정부 / B — 제2차 정상 회담·노무현 정부','A — 제1차 정상 회담·노태우 정부 / B — 제2차 정상 회담·김대중 정부','A — 제2차 정상 회담·노무현 정부 / B — 제1차 정상 회담·김대중 정부','A — 남북 적십자 회담·박정희 정부 / B — 제1차 정상 회담·김대중 정부','A — 남북 고위급 회담·노태우 정부 / B — 판문점 회담·문재인 정부'],0,'A는 김대중 정부의 6·15 공동 선언, B는 노무현 정부의 10·4 선언이에요. 10·4 선언에서는 앞선 합의를 바탕으로 남북 관계 발전을 위한 구체적 방안을 제시했어요.',['A: 남측 연합제 안과 북측 낮은 단계 연방제 안의 공통성을 인정했다.','B: 6·15 공동 선언을 구현하고 경제 협력 등을 추진하기로 했다.']),
    essay('07','134~135',3,'7·4 남북 공동 성명과 남북 기본 합의서가 각각 어떤 국제 정세 속에서 나왔고 무엇을 합의했는지 설명해 보세요.', '7·4 남북 공동 성명은 닉슨 독트린 이후 냉전이 완화되는 가운데 발표되었으며 자주·평화·민족적 대단결의 통일 원칙을 담았다. 남북 기본 합의서는 냉전 해체를 배경으로 이루어졌고 상대방의 체제를 인정·존중하며 침략하지 않기로 합의했다.', ['1970년대 냉전 완화','자주·평화·민족적 대단결','1990년대 냉전 해체','상호 체제 인정과 불가침'])
  ], '판서 17쪽 · 학습지 18쪽');

      {k:'trap',h:'단위를 써서 검산',t:'지름 = 2 × 반지름. 겉넓이는 cm², 부피는 cm³예요. 뚜껑이 없으면 실제로 남은 면만 계산하세요.'}

      {k:'f',h:'서로 다른 n개에서 r개 선택',t:'n! = n × (n − 1) × … × 1\n순열 nPr = n × (n − 1) × … × (n − r + 1)\n조합 nCr = nPr ÷ r!'},
      {k:'list',h:'자리와 역할',i:['<b>순서나 역할이 중요</b>하면 순열이에요. 같은 사람들을 골라도 역할을 바꾸면 다른 결과예요.','<b>누가 포함되는지만</b> 중요하면 조합이에요.','두 사람이 반드시 이웃하면 <b>한 묶음</b>으로 배열하고 묶음 안의 두 순서도 계산해요.']},

      {k:'list',h:'조건을 분모로',i:['‘<b>A임을 알았을 때</b> B’는 P(B | A). 먼저 A에 해당하는 결과만 남겨요.','표에서 현재 상태가 주어졌다면 <b>그 상태의 행</b>을 읽고 다음 상태에 맞는 칸들을 더해요.','뽑은 것을 되돌리지 않으면 다음 추출에서는 <b>전체와 해당 종류의 개수</b>가 바뀌어요.']},

  easy: {
    m21:{sum:'직무 표는 해당 구간을 먼저 고르고, 그래프는 축과 단위를 확인한 뒤 계산해요.',body:['숫자에 바로 요율을 곱하기 전에 거래 종류와 금액 구간이 맞는지 확인해요. 같은 금액도 문제의 기준일이나 부담 주체가 다르면 적용 값이 달라질 수 있어요.','그래프의 가장 높은 값과 가장 많이 증가한 구간은 다를 수 있어요. 변화를 비교하려면 양 끝의 실제 수치를 빼 보세요.'],steps:[
      {q:'기본 2 km가 5,000원이고, 초과 거리는 시작한 130 m 구간마다 150원이라면 3.04 km의 운임은?',s:['3.04 − 2 = 1.04 km가 초과 거리예요.','1.04 km = 1,040 m이고 1,040 ÷ 130 = 8구간이에요.','5,000 + 8 × 150 = 6,200원이에요.']},
      {q:'수수료율이 1천분의 5이고 한도액이 50만 원인 거래에서 1억 2천만 원에 대한 보수는?',s:['1천분의 5를 0.005로 바꿔요.','120,000,000 × 0.005 = 600,000원이에요.','한도액 500,000원을 적용해요.']}
    ]},
    m22:{sum:'미지수를 정하고, 조건마다 식을 세워, 마지막에 원래 상황으로 검산해요.',body:['한 가지 수를 구한다면 x로 두고 총액이나 차이를 식으로 나타내요. 두 종류의 값이 모두 필요하면 x, y에 다른 뜻을 부여하고 독립적인 조건을 두 식으로 나타내요.','연립식은 한 미지수를 지우는 과정이 핵심이에요. 계수가 단순하면 대입법, 계수를 쉽게 맞출 수 있으면 가감법이 편해요.'],steps:[
      {q:'한 자루 900원인 펜과 1,300원인 수첩을 총 12개 사서 12,800원을 냈어요. 수첩은 몇 개일까요?',s:['펜을 x개, 수첩을 y개라 두면 x + y = 12, 900x + 1,300y = 12,800이에요.','두 번째 식에서 첫 식의 900배를 빼면 400y = 2,000이에요.','y = 5이고 x = 7이에요. 6,300 + 6,500 = 12,800원으로 검산해요.']}
    ]},
    m23:{sum:'부등식은 경계 표시, 부호 반전, 정수 조건까지 확인해야 해요.',body:['“적어도”는 경계 이상, “넘지 않는다”는 경계 이하예요. 사건의 문장을 수학 기호로 바꾼 뒤 풀어요.','최대 생산량을 묻더라도 연속적인 길이인지, 셀 수 있는 수량인지 판단해요. 여러 조건은 동시에 만족해야 해요.'],steps:[
      {q:'비용이 6,000원 + 950x원이에요. 예산 12,000원으로 최소 4개를 산다면 가능한 개수는?',s:['x ≥ 4, 6,000 + 950x ≤ 12,000을 함께 세워요.','950x ≤ 6,000이므로 x ≤ 120/19, 즉 약 6.32예요.','정수 조건으로 x = 4, 5, 6이에요.']}
    ]},
    m24:{sum:'바깥 면을 펼쳐 겉넓이를 구하고, 공간의 크기는 부피 공식으로 구해요.',body:['원기둥의 옆면을 펼치면 가로가 밑면 둘레 2πr, 세로가 높이 h인 직사각형이에요. 밑면 두 개를 더하면 겉넓이가 돼요.','원뿔의 모선은 바깥으로 비스듬한 길이예요. 반지름과 모선만 주어지면 직각삼각형으로 높이를 찾아 부피를 계산해요.'],steps:[
      {q:'지름 12 cm, 모선 10 cm인 직각 원뿔의 겉넓이와 부피는?',s:['반지름 r = 6 cm, 수직 높이 h = √(10² − 6²) = 8 cm예요.','겉넓이 = π × 6² + π × 6 × 10 = 96π cm²예요.','부피 = π × 6² × 8 ÷ 3 = 96π cm³예요. 값은 같아도 단위가 달라요.']},
      {q:'가로 16 cm, 세로 12 cm인 종이 네 모서리에서 2 cm 정사각형을 잘라 상자를 접어요. 부피는?',s:['높이는 2 cm, 바닥 가로는 16 − 4 = 12 cm예요.','바닥 세로는 12 − 4 = 8 cm예요.','12 × 8 × 2 = 192 cm³예요.']}
    ]},
    m25:{sum:'둘 중 하나는 더하기, 한 단계씩 함께 고르면 곱하기, 순서 없는 선발은 조합이에요.',body:['겹치지 않는 장소 후보 중 하나를 택할 때는 각 종류의 후보 수를 더해요. 상의와 하의를 한 벌로 고를 때는 첫 선택 하나마다 두 번째 선택이 가능하므로 곱해요.','같은 세 명이라도 팀장·발표자·기록자의 역할이 바뀌면 다른 결과예요. 대표 세 명만 뽑으면 역할 구분이 없으므로 조합을 써요.'],steps:[
      {q:'6명 중 대표 3명을 뽑는 경우와 3개의 서로 다른 직책을 맡기는 경우는?',s:['역할이 다르면 6P3 = 6 × 5 × 4 = 120가지예요.','같은 3명을 나열하는 순서는 3! = 6가지예요.','대표만 뽑는 경우는 6C3 = 120 ÷ 6 = 20가지예요.']}
    ]},
    m26:{sum:'조건부확률은 먼저 조건에 맞는 결과만 남겨서 분모를 정해요.',body:['표본공간은 가능한 결과 전체예요. 주사위가 공정한 상황처럼 결과가 등가능하면, 관심 사건의 개수를 전체 가능한 개수로 나누어요.','같은 표도 질문의 방향에 따라 분모가 달라져요. “A 공장 제품 중 불량품”과 “불량품 중 A 공장 제품”은 각각 공장 제품 수와 전체 불량품 수를 분모로 써요.'],steps:[
      {q:'A 공장 제품 80개 중 4개, B 공장 제품 120개 중 6개가 불량이에요. 불량품 하나를 고를 때 A 공장 제품일 확률은?',s:['조건은 “불량품”이므로 전체 제품 200개를 분모로 하지 않아요.','전체 불량품은 4 + 6 = 10개예요.','A 공장 불량품 4개가 해당돼서 4/10 = 2/5예요.']}
    ]}
  },

  questions: [
    {id:'t2m101',u:'m21',p:'47쪽',t:'num',d:1,unit:'원',q:'택시 기본 거리 2 km까지는 5,000원이다. 초과 거리는 시작한 130 m 구간마다 150원이라면 2.5 km의 요금은?',a:5600,e:'500 m를 130 m로 나누면 약 3.85구간이에요. 시작한 구간마다 과금하므로 4구간, 5,000 + 4 × 150 = 5,600원이에요.'},
    {id:'t2m102',u:'m21',p:'48쪽',t:'num',d:2,unit:'원',q:'화물 운임표에서 20 km 이하는 2.5톤 65,000원·5톤 80,000원이고, 20 km 초과 30 km 이하는 2.5톤 77,000원·5톤 95,000원이다. 5톤 차량이 27 km를 운반할 때의 운임은?',a:95000,e:'27 km는 20 km 초과 30 km 이하이고, 차량은 5톤이에요. 두 조건이 만나는 칸은 95,000원이에요.'},
    {id:'t2m103',u:'m21',p:'49–50쪽',t:'num',d:1,unit:'원',q:'만료 전 해지 위약금이 3개월 이상 6개월 미만은 50,000원, 6개월 이상 9개월 미만은 30,000원이다. 사용 기간이 정확히 6개월일 때 위약금은?',a:30000,e:'‘6개월 이상’은 6개월을 포함하고 ‘6개월 미만’은 포함하지 않으므로 30,000원이에요.'},
    {id:'t2m104',u:'m21',p:'50–51쪽',t:'num',d:1,unit:'원',q:'판매금액 20,000원 이하는 수수료율 7%, 20,000원 초과는 4%인 쇼핑몰에서 24,000원짜리 물건을 팔았다. 수수료는?',a:960,e:'24,000원은 20,000원 초과예요. 24,000 × 0.04 = 960원이에요.'},
    {id:'t2m105',u:'m21',p:'52–54쪽',t:'num',d:2,unit:'원',q:'이 문제에서 월급은 260만 원이고, 국민연금 보험료율은 전체 9%이며 근로자와 사업주가 반씩 부담한다. 근로자 부담액은?',a:117000,e:'근로자 요율은 9%의 절반인 4.5%예요. 2,600,000 × 0.045 = 117,000원이에요.'},
    {id:'t2m106',u:'m21',p:'55쪽',t:'num',d:2,unit:'원',q:'주택 중개 보수 상한 요율이 거래금액의 1천분의 6이고 한도액이 250,000원이다. 해당 구간에서 45,000,000원에 거래하면 최대 보수는?',a:250000,e:'45,000,000 × 6/1,000 = 270,000원이지만, 한도액이 250,000원이므로 그 금액까지 받을 수 있어요.'},
    {id:'t2m107',u:'m21',p:'56쪽',t:'num',d:2,unit:'달러',q:'은행에서 1유로를 팔 때 1,400원을 받고 1달러를 살 때 1,250원을 낸다. 별도 수수료 없이 125유로를 원화로 바꾼 뒤 달러로 바꾸면 몇 달러인가?',a:140,e:'125 × 1,400 = 175,000원이에요. 원화로 달러를 살 때는 175,000 ÷ 1,250 = 140달러예요.'},
    {id:'t2m108',u:'m21',p:'57–58쪽',t:'num',d:2,unit:'',q:'13자리 바코드 앞 12자리의 홀수 자리 합은 21, 짝수 자리 합은 17이다. 홀수 자리 합 + 짝수 자리 합의 3배 + 체크 숫자가 10의 배수가 되게 할 때 체크 숫자는?',a:8,e:'21 + 3 × 17 = 72예요. 80 − 72 = 8이므로 마지막 자리는 8이에요.'},
    {id:'t2m109',u:'m21',p:'59–61쪽',d:2,q:'분기별 판매량이 차례대로 240대, 220대, 340대, 410대이다. 직전 분기와 비교해 가장 많이 증가한 구간은?',o:['1→2분기','2→3분기','3→4분기','모두 같은 증가량','증가한 구간이 없다'],a:1,e:'연속한 분기 차이는 −20, +120, +70대예요. 가장 큰 증가는 2→3분기의 120대예요.'},
    {id:'t2m110',u:'m21',p:'59–61쪽',t:'ox',d:1,q:'세로축의 단위가 ‘백만 달러’일 때 눈금 34는 3,400만 달러이다.',a:0,e:'34 × 1,000,000 = 34,000,000달러이므로 3,400만 달러예요.'},
    {id:'t2m111',u:'m21',p:'63쪽',t:'num',d:3,unit:'개',q:'초기에 연간 판매량이 720개이고 해마다 직전 해보다 50%씩 늘어난다. 두 해 뒤 연간 판매량은?',a:1620,e:'720 × 1.5 = 1,080개, 다음 해 1,080 × 1.5 = 1,620개예요. 두 번째 50%의 기준은 1,080개예요.'},
    {id:'t2m112',u:'m21',p:'80쪽',t:'essay',d:2,q:'가솔린 차량은 15 km/L와 1,650원/L, 경유 차량은 18 km/L와 1,440원/L이다. 두 차량이 각각 90 km를 달릴 때 연료비를 비교해 더 저렴한 차량과 차액을 쓰시오.',m:'가솔린 차량은 90 ÷ 15 = 6 L를 쓰므로 9,900원이다. 경유 차량은 90 ÷ 18 = 5 L를 쓰므로 7,200원이다. 경유 차량이 2,700원 더 저렴하다.',k:['거리 ÷ 연비','9,900원','7,200원','경유 차량이 2,700원 저렴']},

    {id:'t2m201',u:'m22',p:'64–65쪽',t:'num',d:1,unit:'',q:'4x − 7 = 2x + 13을 만족시키는 x는?',a:10,e:'4x − 2x = 13 + 7에서 2x = 20, x = 10이에요. 양변 모두 33이 돼요.'},
    {id:'t2m202',u:'m22',p:'65쪽',d:1,q:'다음 중 x에 대한 일차방정식인 것은?',o:['2x + 3 = 11','x² − 4 = 0','x + y = 7','x + 1 = x + 1','2x > 10'],a:0,e:'2x + 3 = 11은 정리하면 2x − 8 = 0이고 좌변이 x의 일차식이에요. 항등식에서는 x항이 사라져요.'},
    {id:'t2m203',u:'m22',p:'65–66쪽',t:'num',d:1,unit:'개',q:'한 개 800원인 펜 몇 개와 한 개 500원인 지우개 4개를 사서 6,800원을 냈다. 펜의 개수는?',a:6,e:'펜이 x개면 800x + 500 × 4 = 6,800이에요. 800x = 4,800이므로 6개예요.'},
    {id:'t2m204',u:'m22',p:'66쪽',t:'num',d:2,unit:'원',q:'한 개 x원인 부품 80개를 팔 예정이다. 개당 200원을 할인해 같은 80개를 팔았더니 총매출이 144,000원이었다. 할인 전 단가는?',a:2000,e:'80(x − 200) = 144,000이에요. 할인한 단가는 1,800원이므로 할인 전에는 2,000원이에요.'},
    {id:'t2m205',u:'m22',p:'67쪽',t:'num',d:1,unit:'',q:'y = 2x + 1과 x + y = 13의 공통 해에서 y는?',a:9,e:'x + (2x + 1) = 13이므로 3x = 12, x = 4예요. y = 2 × 4 + 1 = 9예요.'},
    {id:'t2m206',u:'m22',p:'67쪽',t:'num',d:2,unit:'',q:'3x + 2y = 29와 x − 2y = −1의 공통 해에서 x는?',a:7,e:'두 식을 더하면 y항이 사라져 4x = 28이므로 x = 7이에요.'},
    {id:'t2m207',u:'m22',p:'67쪽',t:'match',d:1,q:'연립방정식 풀이 용어와 방법을 연결해 보세요.',pairs:[['대입법','한 식에서 구한 미지수 식을 다른 식에 넣음'],['가감법','두 식을 더하거나 빼 미지수 하나를 없앰'],['검산','구한 값이 두 원래 식을 모두 만족하는지 확인']],e:'대입법과 가감법 모두 식 하나를 한 미지수로 정리하는 방법이에요. 마지막에 두 식으로 검산해요.'},
    {id:'t2m208',u:'m22',p:'68쪽',t:'num',d:2,unit:'개',q:'A와 B를 작년에 합쳐서 200개 생산했다. 올해는 A가 20% 늘고 B는 10% 줄어 합계가 210개였다. 작년 B의 생산량은?',a:100,e:'작년 A와 B가 x, y개라면 x + y = 200, 1.2x + 0.9y = 210이에요. 두 번째 식에서 첫 식의 0.9배를 빼면 0.3x = 30, x = 100이라 y = 100이에요.'},
    {id:'t2m209',u:'m22',p:'69쪽',t:'num',d:3,unit:'원',q:'작업자 A와 B의 시간당 급여는 각각 일정하다. 월요일 A가 4시간, B가 2시간 일해 총 80,000원, 화요일 A가 2시간, B가 4시간 일해 총 100,000원이었다. B의 시간당 급여는?',a:20000,e:'A와 B의 시급을 x, y원이라 하면 4x + 2y = 80,000, 2x + 4y = 100,000이에요. 둘째 식의 두 배에서 첫째 식을 빼면 6y = 120,000, y = 20,000원이에요.'},
    {id:'t2m210',u:'m22',p:'65쪽',t:'order',d:1,q:'일차방정식 활용 문제의 풀이를 알맞은 순서로 배열해 보세요.',items:['구하려는 양을 미지수로 놓는다.','문장의 조건을 등식으로 나타낸다.','식을 정리하여 미지수를 구한다.','구한 값이 원래 조건에 맞는지 확인한다.'],e:'미지수 설정 → 식 세우기 → 풀기 → 검산 순서예요.'},
    {id:'t2m211',u:'m22',p:'69쪽',t:'essay',d:3,q:'1시간당 급여가 서로 다른 두 직원이 있다. A 3시간과 B 2시간의 급여 합은 70,000원이고, A 2시간과 B 3시간의 합은 80,000원이다. 두 사람의 시급을 구하는 식과 답을 쓰시오.',m:'A와 B의 시급을 x와 y원으로 놓으면 3x + 2y = 70,000, 2x + 3y = 80,000이다. 두 식을 더하면 x + y = 30,000이다. 첫 식에서 2(x + y)를 빼면 x = 10,000이고, 따라서 y = 20,000이다.',k:['3x + 2y = 70,000','2x + 3y = 80,000','A 10,000원','B 20,000원']},

    {id:'t2m301',u:'m23',p:'70–71쪽',d:1,q:'−3x ≥ 12의 해는?',o:['x ≥ −4','x ≤ −4','x > −4','x ≤ 4','x ≥ 4'],a:1,e:'양변을 음수 −3으로 나누므로 부등호 방향이 바뀌어 x ≤ −4예요. 등호는 남아요.'},
    {id:'t2m302',u:'m23',p:'70쪽',t:'match',d:1,q:'조건을 부등호와 연결해 보세요.',pairs:[['x는 7 이상','x ≥ 7'],['x는 7 이하','x ≤ 7'],['x는 7 초과','x > 7'],['x는 7 미만','x < 7']],e:'이상과 이하는 경계를 포함하고, 초과와 미만은 경계를 제외해요.'},
    {id:'t2m303',u:'m23',p:'71쪽',d:2,q:'5 − 2x < 3x + 15의 해는?',o:['x < −2','x ≤ −2','x ≥ −2','x > −2','x > 2'],a:3,e:'−5x < 10이고, 양변을 −5로 나누면 x > −2예요.'},
    {id:'t2m304',u:'m23',p:'72–73쪽',t:'num',d:2,unit:'개',q:'길이 4 m인 벽에 길이 65 cm인 상자를 한 줄로 놓는다. 상자 사이마다 5 cm를 띄우고 벽 양 끝에는 여유 공간이 필요 없을 때, 최대 몇 개인가?',a:5,e:'x개라면 사이 간격은 x − 1개예요. 65x + 5(x − 1) ≤ 400이므로 70x ≤ 405, 최대 5개예요.'},
    {id:'t2m305',u:'m23',p:'73쪽',t:'num',d:2,unit:'개',q:'종이컵 하나의 높이가 9 cm이고, 포개면 추가한 컵마다 높이가 1.5 cm씩 늘어난다. 높이 30 cm 이하로 컵을 쌓을 때 최대 몇 개인가?',a:15,e:'9 + 1.5(x − 1) ≤ 30에서 x − 1 ≤ 14, x ≤ 15예요. 첫 컵 높이는 따로 세어요.'},
    {id:'t2m306',u:'m23',p:'74쪽',d:2,q:'2x + 3 ≥ 9와 x − 1 < 6을 동시에 만족하는 해는?',o:['x ≥ 3','x < 7','3 < x ≤ 7','3 ≤ x ≤ 7','3 ≤ x < 7'],a:4,e:'첫 번째 해는 x ≥ 3, 두 번째 해는 x < 7이에요. 겹치는 범위는 3 ≤ x < 7이에요.'},
    {id:'t2m307',u:'m23',p:'74–75쪽',t:'num',d:2,unit:'개',q:'상품을 6개 이상 10개 미만으로 생산한다. 가능한 서로 다른 정수 생산량은 모두 몇 가지인가?',a:4,e:'6, 7, 8, 9 총 4가지예요. 6은 포함되고 10은 제외돼요.'},
    {id:'t2m308',u:'m23',p:'75쪽',t:'num',d:3,unit:'개',q:'책상 1개에는 재료가 4개, 의자 1개에는 2개 든다. 책상은 7개를 만들고, 총 재료 45개 이내에서 의자는 책상보다 적게 만들려 한다. 의자를 최대 몇 개 만들 수 있는가?',a:6,e:'4 × 7 + 2x ≤ 45에서 x ≤ 8.5이고, x < 7이므로 두 조건을 만족하는 최대 정수는 6이에요.'},
    {id:'t2m309',u:'m23',p:'76쪽',t:'num',d:2,unit:'시간',q:'두 작업자에게 합계 10시간의 일을 맡긴다. A는 시간당 15,000원, B는 10,000원이다. 예산이 125,000원 이하라면 A에게 최대 몇 시간 맡길 수 있는가?',a:5,e:'A가 x시간이면 B는 10 − x시간이에요. 15,000x + 10,000(10 − x) ≤ 125,000에서 5,000x ≤ 25,000, x ≤ 5예요.'},
    {id:'t2m310',u:'m23',p:'78쪽',t:'num',d:3,unit:'자루',q:'매장에서는 볼펜 한 자루를 1,800원에 판다. 온라인은 1,300원에 배송비 3,000원을 한 번 낸다. 온라인 구매가 매장보다 저렴해지는 최소 구입량은?',a:7,e:'1,300x + 3,000 < 1,800x에서 x > 6이에요. 6자루는 비용이 같으므로 최소 7자루예요.'},
    {id:'t2m311',u:'m23',p:'77–78쪽',t:'essay',d:3,q:'상품은 한 개당 1,250원이고 배송비는 2,000원이다. 15,000원으로 8개 이상 구입할 때 가능한 정수 개수를 식과 함께 쓰시오.',m:'상품을 x개 산다면 x ≥ 8이고 1,250x + 2,000 ≤ 15,000이다. 정리하면 x ≤ 10.4이다. 따라서 가능한 정수는 8, 9, 10이다.',k:['x ≥ 8','1,250x + 2,000 ≤ 15,000','x ≤ 10.4','8, 9, 10']},

    {id:'t2m401',u:'m24',p:'104–105쪽',t:'num',d:1,unit:'cm²',q:'가로 4 cm, 세로 6 cm, 높이 9 cm인 직육면체의 겉넓이는?',a:228,e:'2(4 × 6 + 6 × 9 + 9 × 4) = 2(24 + 54 + 36) = 228 cm²예요.'},
    {id:'t2m402',u:'m24',p:'105쪽',t:'num',d:1,unit:'개',q:'내부가 가로 15 cm, 세로 21 cm, 높이 9 cm인 직육면체 상자에 한 변 3 cm인 정육면체를 빈틈없이 채운다. 몇 개 들어가는가?',a:105,e:'각 방향에 5, 7, 3개씩 들어가므로 5 × 7 × 3 = 105개예요.'},
    {id:'t2m403',u:'m24',p:'105–106쪽',t:'num',d:2,unit:'',q:'지름 8 cm, 높이 11 cm인 닫힌 원기둥의 겉넓이를 Aπ cm²라 할 때 A를 구하시오.',a:120,e:'r = 4이고 밑넓이의 두 배는 32π, 옆넓이는 2π × 4 × 11 = 88π예요. 합은 120π예요.'},
    {id:'t2m404',u:'m24',p:'105–106쪽',t:'num',d:2,unit:'',q:'밑면 지름이 18 cm, 모선이 15 cm인 직각 원뿔의 부피가 Aπ cm³일 때 A를 구하시오.',a:324,e:'r = 9, 수직 높이는 √(15² − 9²) = 12예요. 9² × 12 ÷ 3 = 324예요.'},
    {id:'t2m405',u:'m24',p:'105쪽',t:'num',d:2,unit:'',q:'반지름 6 cm인 구의 부피를 Aπ cm³라 할 때 A를 구하시오.',a:288,e:'4/3 × 6³ = 4/3 × 216 = 288이에요.'},
    {id:'t2m406',u:'m24',p:'105쪽',t:'match',d:1,q:'도형과 부피 공식을 연결해 보세요. 직육면체의 세 변은 a,b,c이고, r은 반지름, h는 높이예요.',pairs:[['직육면체','abc'],['원기둥','πr²h'],['원뿔','πr²h/3'],['구','4πr³/3']],e:'원뿔은 밑넓이와 높이가 같은 원기둥 부피의 1/3이에요.'},
    {id:'t2m407',u:'m24',p:'106쪽',t:'num',d:3,unit:'cm',q:'가로 x cm, 세로 16 cm인 종이의 네 모서리에서 한 변 3 cm인 정사각형을 잘라 뚜껑 없는 상자를 만든다. 부피가 270 cm³일 때 x는?',a:15,e:'높이 3, 바닥 세로 16 − 6 = 10, 가로 x − 6이므로 3 × 10 × (x − 6) = 270이에요. x − 6 = 9, x = 15예요.'},
    {id:'t2m408',u:'m24',p:'107–108쪽',d:3,q:'반지름 3 cm, 길이 10 cm인 원기둥을 축을 지나도록 길게 반으로 자른다. 반쪽의 겉넓이는?',o:['39π cm²','69π cm²','(30π + 60) cm²','(39π + 60) cm²','(39π + 30) cm²'],a:3,e:'두 끝 반원의 합은 9π, 곡면은 30π, 절단면은 6 × 10 = 60이므로 (39π + 60) cm²예요.'},
    {id:'t2m409',u:'m24',p:'105쪽',t:'num',d:2,unit:'cm²',q:'밑면이 두 직각변 6 cm, 8 cm인 직각삼각형이고 기둥의 길이가 5 cm인 삼각기둥의 전체 겉넓이는?',a:168,e:'빗변은 10 cm예요. 옆넓이 (6 + 8 + 10) × 5 = 120, 두 밑면의 합 2 × 6 × 8 ÷ 2 = 48이므로 168 cm²예요.'},
    {id:'t2m410',u:'m24',p:'111쪽',t:'num',d:3,unit:'cm²',q:'한 변 4 cm인 정육면체 두 개를 면 전체가 포개지게 나란히 붙였다. 새 입체의 겉넓이는?',a:160,e:'각각 겉넓이가 6 × 4² = 96 cm²이고 접한 두 면이 사라져요. 2 × 96 − 2 × 16 = 160 cm²예요.'},
    {id:'t2m411',u:'m24',p:'105–107쪽',t:'essay',d:3,q:'반지름 5 cm, 수직 높이 12 cm인 직각 원뿔에서 모선, 겉넓이, 부피를 순서대로 구하시오.',m:'모선은 √(5² + 12²) = 13 cm이다. 겉넓이는 π × 5² + π × 5 × 13 = 90π cm²이다. 부피는 π × 5² × 12 ÷ 3 = 100π cm³이다.',k:['모선 13 cm','밑넓이 + 옆넓이','겉넓이 90π cm²','부피 100π cm³']},

    {id:'t2m501',u:'m25',p:'114–116쪽',t:'num',d:1,unit:'가지',q:'연수 장소 후보가 독립된 호텔 7곳, 콘도 4곳, 연수원 3곳이다. 이 중 한 곳을 고르는 방법은 몇 가지인가?',a:14,e:'겹치지 않는 후보 중 한 곳만 선택하므로 합의 법칙으로 7 + 4 + 3 = 14가지예요.'},
    {id:'t2m502',u:'m25',p:'117–118쪽',t:'num',d:1,unit:'가지',q:'조립 키트에 나사 색 4종, 케이스 색 3종, 스티커 2종에서 각각 하나씩 고른다. 선택에 제한이 없을 때 구성은 몇 가지인가?',a:24,e:'첫 선택마다 다음 선택이 모두 가능하므로 4 × 3 × 2 = 24가지예요.'},
    {id:'t2m503',u:'m25',p:'115–118쪽',t:'match',d:1,q:'조건과 알맞은 셈을 연결해 보세요.',pairs:[['겹치지 않는 후보 3곳과 4곳 중 한 곳 선택','3 + 4'],['상의 3종과 하의 4종에서 각각 하나 선택','3 × 4'],['서로 다른 7명을 모두 한 줄로 배치','7!']],e:'‘둘 중 하나’, ‘각각 하나’, ‘모두 순서대로 배치’를 구별해요.'},
    {id:'t2m504',u:'m25',p:'114–116쪽',t:'num',d:2,unit:'가지',q:'구별되는 두 주사위를 던질 때 눈의 합이 7이 되는 순서쌍은 몇 가지인가?',a:6,e:'(1,6), (2,5), (3,4), (4,3), (5,2), (6,1)로 6가지예요. 두 주사위를 구별해요.'},
    {id:'t2m505',u:'m25',p:'119쪽',t:'num',d:2,unit:'가지',q:'직원 8명 중 서로 다른 세 사람을 팀장, 기록자, 발표자로 한 명씩 배정한다. 몇 가지인가?',a:336,e:'역할을 바꾸면 다른 경우예요. 8P3 = 8 × 7 × 6 = 336가지예요.'},
    {id:'t2m506',u:'m25',p:'119–120쪽',t:'num',d:2,unit:'가지',q:'A, B, C, D, E 다섯 글자 중 중복 없이 4개를 골라 왼쪽부터 나열할 때 첫 글자를 A로 고정하면 몇 가지인가?',a:24,e:'첫 글자를 고정하고 남은 네 글자 중 세 개를 순서대로 놓아요. 4P3 = 4 × 3 × 2 = 24가지예요.'},
    {id:'t2m507',u:'m25',p:'120쪽',t:'num',d:3,unit:'가지',q:'6명이 한 줄로 설 때 특정한 두 사람 A와 B가 반드시 이웃하는 배열은 몇 가지인가?',a:240,e:'A와 B를 한 묶음으로 보면 서로 다른 다섯 대상을 배열해서 5!예요. 묶음 내부가 AB 또는 BA라서 5! × 2 = 240가지예요.'},
    {id:'t2m508',u:'m25',p:'120쪽',t:'num',d:2,unit:'가지',q:'서로 다른 부품 여섯 개를 일렬로 모두 배열하는 방법은 몇 가지인가?',a:720,e:'첫 자리 6가지, 다음이 5가지로 하나씩 줄어요. 6! = 720가지예요.'},
    {id:'t2m509',u:'m25',p:'121쪽',t:'num',d:2,unit:'가지',q:'직원 8명 중 같은 역할의 대표 3명을 뽑는다. 순서를 고려하지 않을 때 몇 가지인가?',a:56,e:'8C3 = (8 × 7 × 6)/(3 × 2 × 1) = 56가지예요.'},
    {id:'t2m510',u:'m25',p:'121쪽',t:'num',d:3,unit:'가지',q:'서로 다른 센서 5종 중 2종과 케이블 4종 중 2종을 고른다. 각 종류의 순서를 고려하지 않을 때 몇 가지인가?',a:60,e:'센서는 5C2 = 10가지, 케이블은 4C2 = 6가지예요. 둘 다 고르므로 10 × 6 = 60가지예요.'},
    {id:'t2m511',u:'m25',p:'119–121쪽',d:2,q:'조합으로 계산하는 선택은?',o:['직원 7명 중 3명이 서로 다른 직책을 맡기','차량 6대를 출발 순서대로 세우기','부품 9종 중 순서 없이 4종을 고르기','알파벳 5개 중 3개로 순서가 있는 코드 만들기','연주곡 4곡의 공연 순서를 정하기'],a:2,e:'부품 4종에서 어떤 부품이 들어가는지만 보면 돼요. 다른 보기에는 자리, 역할 또는 순서가 있어요.'},
    {id:'t2m512',u:'m25',p:'119–121쪽',t:'essay',d:3,q:'같은 9명 중 세 명을 대표로 뽑는 방법과 팀장·부팀장·기록자를 겸직 없이 배정하는 방법의 수를 각각 구하고 차이를 설명하시오.',m:'대표는 순서나 구분이 없으므로 9C3 = 9×8×7 ÷ 6 = 84가지이다. 직책 배정에서는 세 사람의 위치가 달라지면 다른 결과이므로 9P3 = 9×8×7 = 504가지이다.',k:['대표는 조합 84가지','직책은 순열 504가지','같은 세 사람의 직책 순서 3!']},

    {id:'t2m601',u:'m26',p:'122–123쪽',d:1,q:'공정한 주사위 한 개를 한 번 던질 때 표본공간은?',o:['{1, 2, 3, 4, 5, 6}','{1, 3, 5}','{2, 4, 6}','{0, 1, 2, 3, 4, 5, 6}','{6}'],a:0,e:'표본공간은 가능한 모든 눈을 담아요. 홀수나 짝수만 모은 집합은 각각 하나의 사건이에요.'},
    {id:'t2m602',u:'m26',p:'123쪽',d:1,q:'공정한 주사위 한 개를 던질 때 ‘눈이 2의 배수’인 사건은?',o:['{1, 2}','{2, 3, 6}','{1, 3, 5}','{2, 4, 6}','{2}'],a:3,e:'2, 4, 6은 모두 2로 나누어떨어져요.'},
    {id:'t2m603',u:'m26',p:'124쪽',t:'num',d:1,exact:'1/4',q:'1부터 12까지의 수가 하나씩 적힌 카드에서 한 장을 같은 가능성으로 뽑는다. 4의 배수일 확률은? (분수 또는 소수)',a:1/4,e:'4, 8, 12 세 개가 해당해요. 3/12 = 1/4이에요.'},
    {id:'t2m604',u:'m26',p:'124쪽',t:'num',d:1,exact:'3/25',q:'부품을 250개 검사했더니 30개가 재검사 대상으로 분류되었다. 전체 중 재검사 대상의 상대도수는? (분수 또는 소수)',a:3/25,e:'발생 횟수를 전체 시행 횟수로 나누어 30/250 = 3/25 = 0.12예요.'},
    {id:'t2m605',u:'m26',p:'124–125쪽',t:'num',d:2,exact:'1/3',q:'1부터 36까지의 정수 중 같은 가능성으로 하나를 고른다. 고른 수가 4의 배수라는 조건 아래 6의 배수일 확률은? (분수 또는 소수)',a:1/3,e:'4의 배수는 9개예요. 두 수의 공배수인 12의 배수는 12, 24, 36 세 개이므로 3/9 = 1/3이에요.'},
    {id:'t2m606',u:'m26',p:'125쪽',t:'num',d:2,exact:'3/7',q:'A 공장 물품 60개 중 6개가 불량, B 공장 물품 80개 중 8개가 불량이다. 전체 중 무작위로 하나를 뽑아 불량임을 알았을 때, A 공장 물품일 확률은? (분수 또는 소수)',a:3/7,e:'불량품만 남기므로 분모는 6 + 8 = 14예요. A 공장의 불량품이 6개이므로 6/14 = 3/7이에요.'},
    {id:'t2m607',u:'m26',p:'125쪽',t:'num',d:2,exact:'1/10',q:'A 공장 물품 60개 중 6개가 불량, B 공장 물품 80개 중 8개가 불량이다. 전체 중 무작위로 하나를 뽑아 A 공장 물품임을 알았을 때, 불량일 확률은? (분수 또는 소수)',a:1/10,e:'A 공장에서 만든 60개만 고려해요. 그중 불량품은 6개라서 6/60 = 1/10이에요.'},
    {id:'t2m608',u:'m26',p:'125–126쪽',t:'num',d:2,exact:'3/20',q:'현재 신용등급이 B인 고객의 다음 해 등급 확률은 A가 0.12, B가 0.73, C가 0.10, D가 0.05이다. A가 가장 높고 D가 가장 낮다면 이 고객의 등급이 하락할 확률은? (분수 또는 소수)',a:3/20,e:'현재 B가 조건이에요. B보다 낮은 C나 D가 될 확률은 0.10 + 0.05 = 0.15예요.'},
    {id:'t2m609',u:'m26',p:'126쪽',t:'num',d:3,exact:'3/10',q:'직원 5명 중 기술 담당이 3명, 사무 담당이 2명이다. 두 명을 무작위로 고를 때 모두 기술 담당일 확률은? (분수 또는 소수)',a:3/10,e:'전체는 5C2 = 10가지, 기술 담당 두 명은 3C2 = 3가지예요. 확률은 3/10이에요.'},
    {id:'t2m610',u:'m26',p:'127쪽',d:2,q:'P(A) > 0인 사건 A와 사건 B가 있다. A가 일어났다는 조건에서 B가 일어날 확률을 구하는 식은?',o:['P(A ∩ B) × P(A)','P(A ∩ B) / P(B)','P(A ∩ B) / P(A)','P(B) / P(A)','P(A) + P(B)'],a:2,e:'이미 일어난 사건 A가 분모예요. 그 안에서 두 사건이 함께 일어난 비율을 계산해요.'},
    {id:'t2m611',u:'m26',p:'128쪽',t:'num',d:3,exact:'3/10',q:'빨간 사과 3개, 초록 사과 2개 중 한 개씩 무작위로 두 번 뽑는다. 되돌려 넣지 않을 때 둘 다 빨간 사과일 확률은? (분수 또는 소수)',a:3/10,e:'첫 번째는 3/5, 그때 남은 4개 중 빨간 사과는 2개예요. 3/5 × 2/4 = 3/10이에요.'},
    {id:'t2m612',u:'m26',p:'124–125쪽',t:'essay',d:3,q:'P(A) = 0.4, P(B) = 0.5, P(A ∩ B) = 0.2일 때 P(B | A)와 P(A | B)를 각각 구하고 다른 이유를 설명하시오.',m:'P(B | A)는 조건이 A이므로 0.2/0.4 = 0.5이다. P(A | B)는 조건이 B이므로 0.2/0.5 = 0.4이다. 공통 부분은 같지만 분모로 쓰는 조건의 확률이 다르다.',k:['P(B | A) = 0.5','P(A | B) = 0.4','조건이 달라 분모가 다름']}
  ]
});

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let zhVoice = null;
function pickVoice(){ try { const vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; zhVoice = vs.find(v => /^zh[-_]?(CN|Hans)/i.test(v.lang)) || vs.find(v => /^(zh|cmn)/i.test(v.lang)) || null; } catch (e) { zhVoice = null; } }

/* --- 저장 --- */
const KEY = isFinal ? 'midterm-hub-v1-final-2026' : 'midterm-hub-v1';
const CLOUD_PROGRESS_DOC = isFinal ? 'progress-final-2026' : 'progress';
const DAY = 864e5, GAPS = [1, 3, 7];
const todayTs = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const blank = () => ({v:4, answers:{}, wrong:[], known:{}, mocks:[], dates:{}, studied:{}, review:{}, mockCfg:{}, daily:{}, drill:{}, cardStyle:'flip', updatedAt:0});
function normalize(o){
  const s = Object.assign(blank(), o || {});
  for (const key of ['answers','known','dates','studied','review','mockCfg','daily','drill']) {
    if (!s[key] || typeof s[key] !== 'object' || Array.isArray(s[key])) s[key] = {};
  }
  if (s.examDate && !MIDTERM_CONTENT.subjects.some(x => s.dates[x.id])) MIDTERM_CONTENT.subjects.forEach(x => { s.dates[x.id] = s.examDate; });
  delete s.examDate; delete s.theme;
  if (!Array.isArray(s.wrong)) s.wrong = [];
  if (!Array.isArray(s.mocks)) s.mocks = [];
  if ((s.v || 0) < 4) { s.wrong.forEach(id => { if (!s.review[id]) s.review[id] = {lv: 0, due: todayTs()}; }); s.v = 4; }
  return s;
}
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {} return blank(); }
let S = load();
document.documentElement.removeAttribute('data-theme');
const cloud = {ref:null, busy:false, dirty:false, timer:null, on:false};
function persist(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (cloud.ref) { cloud.dirty = true; clearTimeout(cloud.timer); cloud.timer = setTimeout(flush, 1500); }
}
async function flush(){
  if (!cloud.ref || cloud.busy || !cloud.dirty) return;
  cloud.busy = true; cloud.dirty = false;
  try { await cloud.ref.set({json: JSON.stringify(S), updatedAt: S.updatedAt}); }
  catch (e) { if (e && e.code === 'invalid_argument') { cloud.ref = null; cloud.on = false; } }
  cloud.busy = false;
  if (cloud.dirty) flush();
}
async function cloudInit(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const db = await window.claude.use('db'); if (!db) return;
    const user = await window.claude.use('user'); if (!user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.collection('data/users/' + uid).doc(CLOUD_PROGRESS_DOC);
    const snap = await ref.get();
    const d = snap.exists ? (snap.data() || {}) : null;
    if (d && d.json && (d.updatedAt || 0) > (S.updatedAt || 0)) {
      try { S = normalize(JSON.parse(d.json)); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      render();
    } else if (S.updatedAt && (!d || (S.updatedAt || 0) > (d.updatedAt || 0))) {
      cloud.dirty = true;
    }
    cloud.ref = ref; cloud.on = true;
    if (cloud.dirty) flush();
    if (route.v === 'settings') render();
  } catch (e) { /* 이 기기에만 저장 */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { clearTimeout(cloud.timer); flush(); } });

/* --- 시험 날짜 --- */
function dday(sid){
  const v = S.dates[sid]; if (!v) return null;
  const p = v.split('-').map(Number); if (p.length !== 3 || p.some(isNaN)) return null;
  const now = new Date(); now.setHours(0, 0, 0, 0);

function startMock(){
  finishExpiredMock();
  const sc = MOCK_SCOPE, cfg = mockCfg(sc), pool = mockPool(sc, cfg.d);
  const ids = sc === 'all' ? SUBJ.flatMap((s, i) => {
    const n = Math.floor(cfg.n / SUBJ.length) + (i < cfg.n % SUBJ.length ? 1 : 0);
    return shuffle(pool.filter(q => q.s === s.id)).slice(0, n).map(q => q.id);
  }) : shuffle(pool).slice(0, cfg.n).map(q => q.id);

    ids.push(...shuffle(pool.filter(q => !chosen.has(q.id))).slice(0, cfg.n - ids.length).map(q => q.id));
  }

  return h + '</div>';
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ((tag === 'button' || tag === 'summary') && (e.key === 'Enter' || e.key === ' ')) return;
  const optAt = pos => app.querySelectorAll('.opt')[pos];
  const posKey = q => { if (q.t === 'ox') { const k = e.key.toLowerCase(); return k === 'o' ? 0 : k === 'x' ? 1 : -1; } return (!q.t || q.t === 'listen') && /^[1-5]$/.test(e.key) ? +e.key - 1 : -1; };
